ource", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a checked field projection from the coherent Jensen certificate.\n  In the source proof, \\(G=\\{(0)\\}\\), so avoidance and hitting identify the\n  generic formal fiber exactly.\n", "lean_source": "theorem jensen_generic_formal_fiber_output_source\n    (c : JensenPublishedConstructionData) :\n    Nonempty\n      (JensenGenericFiberOutputData c.seed\n        (jensenSaturationDataOfRecursiveChain c.seed c.recursiveChain)\n        c.completionOutput) := by\n  exact ⟨c.genericFiberOutput⟩", "proof_size_lean": 285, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 180, "effort_local": 0, "proof_size_tex_total": 6839, "proof_size_lean_total": 10380, "effort_total": 0}, "def:jensen_selected_source": {"id": "def:jensen_selected_source", "type": "definition", "title": "Jensen selected source", "chapter": "The Anderson counterexample", "statement": "Package the actual source ring selected by Jensen's construction: a\n  Noetherian local domain \\(A\\), its ideal \\(\\mathfrak m\\), the map\n  \\(A\\to T\\), the completion witness \\(\\widehat A\\cong T\\), and the\n  generic-formal-fiber contraction condition.", "uses": ["def:jensen_completion_witness", "def:jensen_saturation_data", "def:jensen_completion_criterion_output_data", "def:jensen_generic_fiber_output_data"], "lean_name": "Run202608192034.TODO.JensenSelectedSource", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a data package.  It separates the construction of Jensen's selected\n  source ring from the later projections of its UFD, completion, dimension, and\n  contraction properties.\n", "lean_source": "structure JensenSelectedSource where\n  A : Type\n  [instA : CommRing A]\n  𝔪 : Ideal A\n  ι : A →+* nodeRing\n  hNoeth : IsNoetherianRing A\n  hLocal : IsLocalRing A\n  hDomain : IsDomain A\n  witness : JensenCompletionWitness A 𝔪 ι\n  hBot : Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥\n  hNonzeroContraction :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥\n\nattribute [instance] JensenSelectedSource.instA", "proof_size_lean": 412, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 1, "descendant_count": 125, "proof_size_tex": 181, "effort_local": 0, "proof_size_tex_total": 6794, "proof_size_lean_total": 6430, "effort_total": 0}, "lem:jensen_selected_source_exists_source": {"id": "lem:jensen_selected_source_exists_source", "type": "lemma", "title": "Jensen selected source exists", "chapter": "The Anderson counterexample", "statement": "Jensen's published construction certificate assembles into the selected\n  source package used downstream.", "uses": ["def:jensen_published_construction_data", "def:jensen_selected_source", "def:jensen_saturation_data_of_recursive_chain", "lem:farley_completion_criterion", "lem:adic_completion_prime_contraction_condition_iff_target"], "lean_name": "Run202608192034.TODO.jensenSelectedSource_exists_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Choose the certificate supplied by the explicit Corollary~2.4 boundary.\n  Anderson's Corollary~2(1) gives the weak-completeness criterion on the actual\n  adic completion, and the checked prime-contraction transport lemma carries it\n  across \\(\\widehat A\\cong T\\).  Assemble this with the certificate's dependent\n  UFD, completion, and generic-formal-fiber fields into\n  `JensenCompletionWitness` and `JensenSelectedSource`.\n", "lean_source": "theorem jensenSelectedSource_exists_source : Nonempty JensenSelectedSource := by\n  rcases jensen_corollary_2_4_construction_external with ⟨c⟩\n  let sat : JensenSaturationData c.seed :=\n    jensenSaturationDataOfRecursiveChain c.seed c.recursiveChain\n  let ufd := c.ufdOutput\n  let comp := c.completionOutput\n  let fiber := c.genericFiberOutput\n  letI : IsNoetherianRing sat.A := comp.hNoeth\n  letI : IsLocalRing sat.A := comp.hLocal\n  letI : IsDomain sat.A := comp.hDomain\n  have hMax : comp.𝔪 = IsLocalRing.maximalIdeal sat.A :=\n    comp.adicIdeal_eq_maximalIdeal comp.hLocal\n  have hWeakCompletion :\n      WeaklyQuasiComplete sat.A comp.𝔪 ↔\n        AdicCompletionPrimeContractionCondition sat.A comp.𝔪 :=\n    anderson_corollary2_part1_external sat.A comp.𝔪 hMax\n  have hCompletionTarget :\n      AdicCompletionPrimeContractionCondition sat.A comp.𝔪 ↔\n        ∀ P : Ideal nodeRing, P.IsPrime → P ≠ ⊥ →\n          Ideal.comap sat.A.subtype P ≠ ⊥ :=\n    adicCompletionPrimeContractionCondition_iff_target\n      sat.A nodeRing comp.𝔪 sat.A.subtype comp.completionEquiv\n      comp.map_compatible\n  let w : JensenCompletionWitness sat.A comp.𝔪 sat.A.subtype :=\n    { completionEquiv := comp.completionEquiv\n      map_compatible := comp.map_compatible\n      sourceIsUFD := ufd.sourceIsUFD\n      adicIdeal_eq_maximalIdeal := comp.adicIdeal_eq_maximalIdeal\n      sourceRingKrullDim_eq_two := comp.sourceRingKrullDim_eq_two\n      weakCriterion := hWeakCompletion.trans hCompletionTarget }\n  exact\n    ⟨{ A := sat.A\n       instA := inferInstance\n       𝔪 := comp.𝔪\n       ι := sat.A.subtype\n       hNoeth := comp.hNoeth\n       hLocal := comp.hLocal\n       hDomain := comp.hDomain\n       witness := w\n       hBot := fiber.hBot\n       hNonzeroContraction := fiber.hNonzeroContraction }⟩", "proof_size_lean": 1773, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 5, "rdep_count": 4, "descendant_count": 124, "proof_size_tex": 423, "effort_local": 0, "proof_size_tex_total": 9199, "proof_size_lean_total": 15497, "effort_total": 0}, "lem:jensen_selected_ring_exists_source": {"id": "lem:jensen_selected_ring_exists_source", "type": "lemma", "title": "Jensen selected ring exists", "chapter": "The Anderson counterexample", "statement": "The selected source package contains a Noetherian local domain \\(A\\) and a map\n  \\(A\\to T\\).", "uses": ["lem:jensen_selected_source_exists_source"], "lean_name": "Run202608192034.TODO.jensen_selected_ring_exists_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Project \\(A\\), \\(\\mathfrak m\\), the map \\(A\\to T\\), and the Noetherian,\n  local, and domain fields from \\cref{lem:jensen_selected_source_exists_source}.\n", "lean_source": "theorem jensen_selected_ring_exists_source :\n    ∃ (A : Type) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n      (_ι : A →+* nodeRing),\n      IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A := by\n  rcases jensenSelectedSource_exists_source with ⟨s⟩\n  exact ⟨s.A, s.instA, s.𝔪, s.ι, s.hNoeth, s.hLocal, s.hDomain⟩", "proof_size_lean": 321, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 120, "proof_size_tex": 152, "effort_local": 0, "proof_size_tex_total": 9351, "proof_size_lean_total": 15818, "effort_total": 0}, "lem:jensen_selected_ring_completion_equiv_source": {"id": "lem:jensen_selected_ring_completion_equiv_source", "type": "lemma", "title": "Jensen selected completion equivalence", "chapter": "The Anderson counterexample", "statement": "The selected source package carries the completion equivalence\n  \\(\\widehat A\\cong T\\) together with the compatible map \\(A\\to T\\).", "uses": ["lem:jensen_selected_source_exists_source", "def:jensen_completion_witness"], "lean_name": "Run202608192034.TODO.jensen_selected_ring_completion_equiv_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Project the `JensenCompletionWitness` field from the selected source package.\n", "lean_source": "theorem jensen_selected_ring_completion_equiv_source :\n    ∃ (A : Type) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n      (ι : A →+* nodeRing), ∃ (_w : JensenCompletionWitness A _𝔪 ι), True := by\n  rcases jensenSelectedSource_exists_source with ⟨s⟩\n  exact ⟨s.A, s.instA, s.𝔪, s.ι, s.witness, trivial⟩", "proof_size_lean": 311, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 120, "proof_size_tex": 77, "effort_local": 0, "proof_size_tex_total": 9276, "proof_size_lean_total": 15808, "effort_total": 0}, "lem:jensen_selected_ring_ufd_source": {"id": "lem:jensen_selected_ring_ufd_source", "type": "lemma", "title": "Jensen selected ring is a UFD", "chapter": "The Anderson counterexample", "statement": "The selected source ring is a UFD.", "uses": ["lem:jensen_selected_source_exists_source", "def:jensen_completion_witness"], "lean_name": "Run202608192034.TODO.jensen_selected_ring_ufd_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Project the UFD field stored in the selected source package's completion\n  witness.\n", "lean_source": "theorem jensen_selected_ring_ufd_source :\n    ∃ (A : Type) (_inst : CommRing A), ∃ (_ufd : UniqueFactorizationMonoid A), True := by\n  rcases jensenSelectedSource_exists_source with ⟨s⟩\n  exact ⟨s.A, s.instA, s.witness.sourceIsUFD, trivial⟩", "proof_size_lean": 239, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 120, "proof_size_tex": 83, "effort_local": 0, "proof_size_tex_total": 9282, "proof_size_lean_total": 15736, "effort_total": 0}, "lem:jensen_selected_ring_generic_fiber_source": {"id": "lem:jensen_selected_ring_generic_fiber_source", "type": "lemma", "title": "Jensen selected generic formal fiber", "chapter": "The Anderson counterexample", "statement": "In the selected source ring, the zero prime of \\(T\\) contracts to zero, and\n  every nonzero prime of \\(T\\) contracts nontrivially.", "uses": ["lem:jensen_selected_source_exists_source"], "lean_name": "Run202608192034.TODO.jensen_selected_ring_generic_fiber_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Project the two contraction fields from the selected source package.\n", "lean_source": "theorem jensen_selected_ring_generic_fiber_source :\n    ∃ (A : Type) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n      (ι : A →+* nodeRing),\n      Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n        ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥ := by\n  rcases jensenSelectedSource_exists_source with ⟨s⟩\n  exact ⟨s.A, s.instA, s.𝔪, s.ι, s.hBot, s.hNonzeroContraction⟩", "proof_size_lean": 390, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 120, "proof_size_tex": 68, "effort_local": 0, "proof_size_tex_total": 9267, "proof_size_lean_total": 15887, "effort_total": 0}, "lem:jensen_special_case_source": {"id": "lem:jensen_special_case_source", "type": "lemma", "title": "Jensen special case source package", "chapter": "The Anderson counterexample", "statement": "There exists a two-dimensional Noetherian local UFD \\(A\\) with\n  \\(\\widehat A\\cong T\\) such that the only prime ideal of \\(T\\) contracting\n  to zero in \\(A\\) is \\((0)\\), and this selected source ring carries the\n  completion witness used downstream.", "uses": ["lem:jensen_selected_ring_exists_source", "lem:jensen_selected_ring_completion_equiv_source", "lem:jensen_selected_ring_ufd_source", "lem:jensen_selected_ring_generic_fiber_source"], "lean_name": "Run202608192034.TODO.jensenSpecialCase_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Assemble the selected ring, completion witness, UFD output, and contraction\n  statement from the selected source package projections.\n", "lean_source": "theorem jensenSpecialCase_source :\n    ∃ (A : Type) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n      (ι : A →+* nodeRing) (_w : JensenCompletionWitness A _𝔪 ι),\n      IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n        Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n          ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥ := by\n  rcases jensenSelectedSource_exists_source with ⟨s⟩\n  exact\n    ⟨s.A, s.instA, s.𝔪, s.ι, s.witness, s.hNoeth, s.hLocal, s.hDomain, s.hBot,\n      s.hNonzeroContraction⟩", "proof_size_lean": 523, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 1, "descendant_count": 119, "proof_size_tex": 133, "effort_local": 0, "proof_size_tex_total": 9712, "proof_size_lean_total": 17281, "effort_total": 0}, "lem:jensen_special_case": {"id": "lem:jensen_special_case", "type": "lemma", "title": "Jensen special case", "chapter": "The Anderson counterexample", "statement": "The source package gives the counterexample-ring candidate used in the rest of\n  the proof.", "uses": ["lem:jensen_special_case_source"], "lean_name": "Run202608192034.TODO.jensenSpecialCase", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Project the selected ring, map, contraction statement, and completion witness\n  from \\cref{lem:jensen_special_case_source}.\n", "lean_source": "theorem jensenSpecialCase : counterexampleRing := by\n  rcases jensenSpecialCase_source with\n    ⟨A, instA, 𝔪, ι, w, hNoeth, hLocal, hDomain, hBot, hNonzeroContraction⟩\n  exact\n    ⟨A, instA, 𝔪, ι, w, hNoeth, hLocal, hDomain, hBot, hNonzeroContraction⟩", "proof_size_lean": 251, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 118, "proof_size_tex": 123, "effort_local": 0, "proof_size_tex_total": 9835, "proof_size_lean_total": 17532, "effort_total": 0}, "def:counterexample_ring": {"id": "def:counterexample_ring", "type": "definition", "title": "The counterexample candidate", "chapter": "The Anderson counterexample", "statement": "Fix a ring \\(A\\), a maximal ideal \\(\\mathfrak m_A\\), and a completion\n  isomorphism \\(\\widehat A\\cong T\\) supplied by\n  \\cref{lem:jensen_special_case}.", "uses": ["lem:jensen_special_case"], "lean_name": "Run202608192034.TODO.counterexampleRing", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The preceding existence lemma supplies a witness; fix one such witness for\n  the remainder of the construction.\n", "lean_source": "def counterexampleRing : Prop :=\n  ∃ (A : Type) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n    (ι : A →+* nodeRing) (_w : JensenCompletionWitness A _𝔪 ι),\n    IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n      Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n        ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥", "proof_size_lean": 336, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 117, "proof_size_tex": 111, "effort_local": 0, "proof_size_tex_total": 9946, "proof_size_lean_total": 17868, "effort_total": 0}, "lem:counterexample_ring_properties": {"id": "lem:counterexample_ring_properties", "type": "lemma", "title": "Properties of the counterexample candidate", "chapter": "The Anderson counterexample", "statement": "The ring \\(A\\) is a two-dimensional Noetherian local UFD and a domain, its\n  completion is identified with \\(T\\), and every nonzero prime of \\(T\\) has\n  nonzero contraction to \\(A\\).  Moreover, the completion map embeds \\(A\\)\n  into \\(T\\).", "uses": ["def:counterexample_ring", "lem:jensen_special_case"], "lean_name": "Run202608192034.TODO.counterexampleRing_properties", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The structural properties and contraction assertion come from the chosen\n  witness.  A UFD is a domain.  The kernel of the completion map is\n  \\(\\bigcap_{n\\geq1}\\mathfrak m_A^n\\), which is zero by the Krull intersection\n  theorem for the Noetherian local domain \\(A\\).  Hence the completion\n  isomorphism lets us regard \\(A\\) as a subring of \\(T\\).\n", "lean_source": "theorem counterexampleRing_properties : counterexampleRing :=\n  jensenSpecialCase", "proof_size_lean": 81, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 6, "descendant_count": 116, "proof_size_tex": 348, "effort_local": 0, "proof_size_tex_total": 10294, "proof_size_lean_total": 17949, "effort_total": 0}, "lem:counterexample_ring_weak": {"id": "lem:counterexample_ring_weak", "type": "lemma", "title": "The candidate is weakly quasi-complete", "chapter": "The Anderson counterexample", "statement": "The ring \\(A\\) is weakly quasi-complete.", "uses": ["lem:counterexample_ring_properties", "lem:farley_completion_criterion"], "lean_name": "Run202608192034.TODO.counterexampleRing_weaklyQuasiComplete", "proved": false, "mathlib_ok": false, "proof_tex": "\n  By \\cref{lem:counterexample_ring_properties}, every nonzero prime of\n  \\(\\widehat A\\cong T\\) contracts nontrivially to \\(A\\).  Apply\n  \\cref{lem:farley_completion_criterion}.\n", "lean_source": "theorem counterexampleRing_weaklyQuasiComplete :\n    counterexampleRing →\n      ∃ (A : Type) (_inst : CommRing A) (𝔪 : @Ideal A _inst.toSemiring),\n        WeaklyQuasiComplete A 𝔪 := by\n  intro hA\n  rcases hA with\n    ⟨A, instA, 𝔪, ι, w, _hNoeth, _hLocal, _hDomain, _hBot, hNonzero⟩\n  letI := instA\n  exact\n    ⟨A, instA, 𝔪,\n      (counterexampleRing_weakCriterion_source A 𝔪 ι w).2 hNonzero⟩", "proof_size_lean": 391, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 2, "proof_size_tex": 174, "effort_local": 0, "proof_size_tex_total": 10468, "proof_size_lean_total": 18340, "effort_total": 0}, "def:contracted_prime": {"id": "def:contracted_prime", "type": "definition", "title": "Contraction of the distinguished prime", "chapter": "The Anderson counterexample", "statement": "Under the fixed embedding \\(A\\subseteq T\\), define \\(q=Q\\cap A\\).", "uses": ["def:counterexample_ring", "def:node_prime", "lem:counterexample_ring_properties"], "lean_name": "Run202608192034.TODO.contractedPrime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition.\n", "lean_source": "def contractedPrime : Prop :=\n  ∃ (A : Type) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n    (ι : A →+* nodeRing) (q : @Ideal A _inst.toSemiring),\n    counterexampleRing ∧ q = Ideal.comap ι nodePrime ∧ q.IsPrime ∧ q ≠ ⊥", "proof_size_lean": 229, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 2, "descendant_count": 114, "proof_size_tex": 21, "effort_local": 0, "proof_size_tex_total": 10357, "proof_size_lean_total": 19042, "effort_total": 0}, "lem:contracted_prime_height": {"id": "lem:contracted_prime_height", "type": "lemma", "title": "Height of the contracted prime", "chapter": "The Anderson counterexample", "statement": "The ideal \\(q\\) is a nonzero prime ideal of \\(A\\) of height one.", "uses": ["def:contracted_prime", "lem:counterexample_ring_properties", "lem:node_prime_height"], "lean_name": "Run202608192034.TODO.contractedPrime_nonzero_height_one", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Contraction preserves primality.  Since \\(Q\\neq(0)\\) and the zero prime is\n  the only prime of \\(T\\) contracting to zero, \\(q\\neq(0)\\).  The completion\n  map is faithfully flat, so going-down gives\n  \\(\\operatorname{ht}q\\leq\\operatorname{ht}Q=1\\).  A nonzero prime in the\n  domain \\(A\\) has height at least one, hence equality holds.\n", "lean_source": "theorem contractedPrime_nonzero_height_one : contractedPrime := by\n  rcases counterexampleRing_properties with\n    ⟨A, instA, 𝔪, ι, _w, _hNoeth, _hLocal, _hDomain, _hBot, hNonzero⟩\n  letI := instA\n  refine\n    ⟨A, instA, 𝔪, ι, Ideal.comap ι nodePrime, counterexampleRing_properties, rfl,\n      ?_, ?_⟩\n  · haveI : nodePrime.IsPrime := nodePrime_prime_height.1\n    exact Ideal.comap_isPrime ι nodePrime\n  · exact hNonzero nodePrime nodePrime_prime_height.1 nodePrime_prime_height.2.1", "proof_size_lean": 482, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 2, "descendant_count": 113, "proof_size_tex": 333, "effort_local": 0, "proof_size_tex_total": 12393, "proof_size_lean_total": 20800, "effort_total": 0}, "def:prime_generator": {"id": "def:prime_generator", "type": "definition", "title": "A prime generator", "chapter": "The Anderson counterexample", "statement": "Choose a prime element \\(a\\in A\\) for which \\(q=aA\\).", "uses": ["lem:contracted_prime_height", "lem:counterexample_ring_properties"], "lean_name": "Run202608192034.TODO.primeGenerator", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Every height-one prime of the UFD \\(A\\) is principal and generated by a\n  prime element, so \\cref{lem:contracted_prime_height} supplies such \\(a\\).\n", "lean_source": "def primeGenerator : Prop :=\n  ∃ (A : Type) (_inst : CommRing A) (𝔪 : @Ideal A _inst.toSemiring)\n    (ι : A →+* nodeRing) (q : @Ideal A _inst.toSemiring) (a : A)\n    (_w : JensenCompletionWitness A 𝔪 ι),\n    counterexampleRing ∧ IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n      WeaklyQuasiComplete A 𝔪 ∧\n        Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n        (∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥) ∧\n          q = Ideal.comap ι nodePrime ∧ q.IsPrime ∧ q ≠ ⊥ ∧\n            q = Ideal.span ({a} : Set A)", "proof_size_lean": 534, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 7, "descendant_count": 112, "proof_size_tex": 147, "effort_local": 0, "proof_size_tex_total": 12540, "proof_size_lean_total": 21334, "effort_total": 0}, "lem:jensen_special_case_ufd_source": {"id": "lem:jensen_special_case_ufd_source", "type": "lemma", "title": "Jensen's selected ring is a UFD", "chapter": "The Anderson counterexample", "statement": "The ring \\(A\\) selected from Jensen's construction is a UFD.", "uses": ["def:jensen_completion_witness"], "lean_name": "Run202608192034.TODO.jensenSpecialCase_isUFD_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is now a projection from the Jensen completion witness.  The witness\n  records the UFD output of the saturated-union construction together with the\n  completion equivalence and weak-completeness criterion.\n", "lean_source": "theorem jensenSpecialCase_isUFD_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (w : JensenCompletionWitness A 𝔪 ι) :\n    UniqueFactorizationMonoid A := by\n  exact w.sourceIsUFD", "proof_size_lean": 203, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 12, "proof_size_tex": 210, "effort_local": 0, "proof_size_tex_total": 1887, "proof_size_lean_total": 1676, "effort_total": 0}, "lem:counterexample_weak_criterion_source": {"id": "lem:counterexample_weak_criterion_source", "type": "lemma", "title": "Weak-completeness criterion for the selected ring", "chapter": "The Anderson counterexample", "statement": "The selected ring \\(A\\) is weakly quasi-complete exactly when every nonzero\n  prime of \\(T\\) contracts nontrivially to \\(A\\).", "uses": ["def:jensen_completion_witness"], "lean_name": "Run202608192034.TODO.counterexampleRing_weakCriterion_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is now a projection from the Jensen completion witness, which records\n  the Farley completion-prime criterion already transported along\n  \\(\\widehat A\\cong T\\).\n", "lean_source": "theorem counterexampleRing_weakCriterion_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (w : JensenCompletionWitness A 𝔪 ι) :\n    WeaklyQuasiComplete A 𝔪 ↔\n      ∀ P : Ideal nodeRing, P.IsPrime → P ≠ ⊥ → Ideal.comap ι P ≠ ⊥ := by\n  exact w.weakCriterion", "proof_size_lean": 280, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 11, "proof_size_tex": 165, "effort_local": 0, "proof_size_tex_total": 1842, "proof_size_lean_total": 1753, "effort_total": 0}, "lem:nonzero_prime_height_ge_one_source": {"id": "lem:nonzero_prime_height_ge_one_source", "type": "lemma", "title": "A nonzero ideal in a domain has positive height", "chapter": "The Anderson counterexample", "statement": "If \\(A\\) is a domain and \\(q\\neq(0)\\), then \\(\\operatorname{ht}q\\geq 1\\).", "uses": [], "lean_name": "Run202608192034.TODO.nonzeroPrime_height_ge_one_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The zero ideal is prime in a domain.  Since \\((0)\\subsetneq q\\), strict\n  monotonicity of height below a prime ideal gives\n  \\(\\operatorname{ht}(0)<\\operatorname{ht}q\\), and\n  \\(\\operatorname{ht}(0)=0\\).\n", "lean_source": "theorem nonzeroPrime_height_ge_one_source\n    (A : Type) [CommRing A] [IsDomain A] (q : Ideal A)\n    (_hqPrime : q.IsPrime) (hqNonzero : q ≠ ⊥) :\n    (1 : ℕ∞) ≤ q.height := by\n  have hBotLtQ : (⊥ : Ideal A) < q :=\n    bot_lt_iff_ne_bot.mpr hqNonzero\n  haveI : (⊥ : Ideal A).FiniteHeight := by\n    rw [Ideal.finiteHeight_iff]\n    exact Or.inr (by rw [Ideal.height_bot]; simp)\n  have hStrict : (⊥ : Ideal A).height < q.height :=\n    Ideal.height_strict_mono_of_is_prime hBotLtQ\n  have hPositive : 0 < q.height := by\n    simpa [Ideal.height_bot] using hStrict\n  exact ENat.one_le_iff_ne_zero.mpr (ne_of_gt hPositive)", "proof_size_lean": 613, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 14, "proof_size_tex": 203, "effort_local": 0, "proof_size_tex_total": 203, "proof_size_lean_total": 613, "effort_total": 0}, "lem:lies_over_height_le_of_has_going_down_source": {"id": "lem:lies_over_height_le_of_has_going_down_source", "type": "lemma", "title": "Going-down controls height under lies-over", "chapter": "The Anderson counterexample", "statement": "If \\(T\\) is a Noetherian \\(A\\)-algebra satisfying going-down and\n  \\(Q\\subseteq T\\) lies over \\(q\\subseteq A\\), then\n  \\(\\operatorname{ht}q\\leq\\operatorname{ht}Q\\).", "uses": [], "lean_name": "Run202608192034.TODO.liesOver_height_le_of_hasGoingDown_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use Mathlib's height formula for going-down:\n  \\[\n    \\operatorname{ht}Q =\n    \\operatorname{ht}q +\n    \\operatorname{ht}\\bigl(Q(T/qT)\\bigr).\n  \\]\n  Since \\(x\\leq x+y\\) in \\(\\mathbb N_\\infty\\), the desired inequality follows.\n", "lean_source": "theorem liesOver_height_le_of_hasGoingDown_source\n    (A T : Type) [CommRing A] [CommRing T] [Algebra A T]\n    [IsNoetherianRing A] [IsNoetherianRing T] [Algebra.HasGoingDown A T]\n    (q : Ideal A) (Q : Ideal T) (hqPrime : q.IsPrime) (hQPrime : Q.IsPrime)\n    (hLiesOver : Q.LiesOver q) :\n    q.height ≤ Q.height := by\n  haveI : q.IsPrime := hqPrime\n  haveI : Q.IsPrime := hQPrime\n  haveI : Q.LiesOver q := hLiesOver\n  have hEq :\n      Q.height =\n        q.height +\n          (Q.map (Ideal.Quotient.mk <| q.map (algebraMap A T))).height :=\n    Ideal.height_eq_height_add_of_liesOver_of_hasGoingDown q Q\n  exact (self_le_add_right q.height _).trans (le_of_eq hEq.symm)", "proof_size_lean": 667, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 16, "proof_size_tex": 225, "effort_local": 0, "proof_size_tex_total": 225, "proof_size_lean_total": 667, "effort_total": 0}, "lem:adic_completion_has_going_down_of_is_noetherian": {"id": "lem:adic_completion_has_going_down_of_is_noetherian", "type": "lemma", "title": "Noetherian adic completions have going-down", "chapter": "The Anderson counterexample", "statement": "If \\(A\\) is Noetherian, then the canonical algebra map\n  \\(A\\to\\widehat A^{\\,\\mathfrak m}\\) has going-down.", "uses": [], "lean_name": "Run202608192034.TODO.adicCompletion_hasGoingDown_of_isNoetherian", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Mathlib proves that Noetherian adic completions are flat over the original\n  ring.  Flat algebras satisfy going-down, so typeclass inference supplies the\n  result.\n", "lean_source": "theorem adicCompletion_hasGoingDown_of_isNoetherian\n    (A : Type) [CommRing A] (𝔪 : Ideal A) [IsNoetherianRing A] :\n    Algebra.HasGoingDown A (AdicCompletion 𝔪 A) := by\n  infer_instance", "proof_size_lean": 187, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 17, "proof_size_tex": 163, "effort_local": 0, "proof_size_tex_total": 163, "proof_size_lean_total": 187, "effort_total": 0}, "lem:adic_completion_equiv_has_going_down_of_is_noetherian": {"id": "lem:adic_completion_equiv_has_going_down_of_is_noetherian", "type": "lemma", "title": "Going-down transports across a completion equivalence", "chapter": "The Anderson counterexample", "statement": "If \\(A\\) is Noetherian and \\(\\widehat A^{\\,\\mathfrak m}\\cong T\\), then the\n  transported algebra structure \\(A\\to T\\) has going-down.", "uses": ["lem:adic_completion_has_going_down_of_is_noetherian"], "lean_name": "Run202608192034.TODO.adicCompletion_equiv_hasGoingDown_of_isNoetherian", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The canonical map \\(A\\to\\widehat A^{\\,\\mathfrak m}\\) is flat, and a bijective\n  ring map \\(\\widehat A^{\\,\\mathfrak m}\\to T\\) is flat.  Flatness is stable\n  under composition, hence the transported map \\(A\\to T\\) is flat.  Apply\n  `Algebra.HasGoingDown.of_flat`.\n", "lean_source": "theorem adicCompletion_equiv_hasGoingDown_of_isNoetherian\n    (A T : Type) [CommRing A] [CommRing T] (𝔪 : Ideal A)\n    [IsNoetherianRing A] (e : AdicCompletion 𝔪 A ≃+* T) :\n    letI : Algebra A T :=\n      (e.toRingHom.comp (algebraMap A (AdicCompletion 𝔪 A))).toAlgebra\n    Algebra.HasGoingDown A T := by\n  let f : A →+* AdicCompletion 𝔪 A :=\n    algebraMap A (AdicCompletion 𝔪 A)\n  let g : AdicCompletion 𝔪 A →+* T :=\n    e.toRingHom\n  have hf : f.Flat := by\n    rw [RingHom.flat_algebraMap_iff]\n    infer_instance\n  have hg : g.Flat :=\n    RingHom.Flat.of_bijective e.bijective\n  have hfg : (g.comp f).Flat :=\n    hf.comp hg\n  change\n    letI : Algebra A T := (g.comp f).toAlgebra\n    Algebra.HasGoingDown A T\n  letI : Algebra A T := (g.comp f).toAlgebra\n  haveI : Module.Flat A T := hfg\n  infer_instance", "proof_size_lean": 806, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 16, "proof_size_tex": 261, "effort_local": 0, "proof_size_tex_total": 424, "proof_size_lean_total": 993, "effort_total": 0}, "lem:completion_map_has_going_down_source": {"id": "lem:completion_map_has_going_down_source", "type": "lemma", "title": "The completion map has going-down", "chapter": "The Anderson counterexample", "statement": "The selected completion map \\(A\\to T\\) satisfies going-down.", "uses": ["def:jensen_completion_witness", "lem:adic_completion_equiv_has_going_down_of_is_noetherian"], "lean_name": "Run202608192034.TODO.completionMap_hasGoingDown_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The Jensen completion witness identifies the selected map \\(A\\to T\\) with\n  the standard adic completion map transported across\n  \\(\\widehat A\\cong T\\).  Apply the checked transport lemma for going-down\n  across such a completion equivalence.\n", "lean_source": "theorem completionMap_hasGoingDown_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (hNoeth : IsNoetherianRing A) (_hLocal : IsLocalRing A)\n    (w : JensenCompletionWitness A 𝔪 ι) :\n    letI : Algebra A nodeRing := ι.toAlgebra\n    Algebra.HasGoingDown A nodeRing := by\n  rw [w.map_compatible]\n  exact\n    adicCompletion_equiv_hasGoingDown_of_isNoetherian A nodeRing 𝔪\n      w.completionEquiv", "proof_size_lean": 416, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 15, "proof_size_tex": 242, "effort_local": 0, "proof_size_tex_total": 2343, "proof_size_lean_total": 2882, "effort_total": 0}, "lem:contracted_prime_height_le_one_of_has_going_down_source": {"id": "lem:contracted_prime_height_le_one_of_has_going_down_source", "type": "lemma", "title": "Going-down gives the contracted-prime height upper bound", "chapter": "The Anderson counterexample", "statement": "If the selected completion map has going-down, then\n  \\(\\operatorname{ht}(Q\\cap A)\\leq1\\).", "uses": ["lem:lies_over_height_le_of_has_going_down_source", "lem:node_prime_height"], "lean_name": "Run202608192034.TODO.contractedPrime_height_le_one_of_hasGoingDown_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The equality \\(q=Q\\cap A\\) says exactly that \\(Q\\) lies over \\(q\\).  Apply\n  the going-down height comparison and then use\n  \\(\\operatorname{ht}Q=1\\).\n", "lean_source": "theorem contractedPrime_height_le_one_of_hasGoingDown_source\n    (A : Type) [CommRing A] (_𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (q : Ideal A) (hNoeth : IsNoetherianRing A) (_hLocal : IsLocalRing A)\n    (_hDomain : IsDomain A) (hqComap : q = Ideal.comap ι nodePrime)\n    (hqPrime : q.IsPrime) (_hqNonzero : q ≠ ⊥)\n    (hGoingDown :\n      letI : Algebra A nodeRing := ι.toAlgebra\n      Algebra.HasGoingDown A nodeRing) :\n    q.height ≤ 1 := by\n  letI : Algebra A nodeRing := ι.toAlgebra\n  haveI : IsNoetherianRing A := hNoeth\n  haveI : IsNoetherianRing nodeRing := node_complete_cm_dim.1\n  haveI : Algebra.HasGoingDown A nodeRing := hGoingDown\n  have hNodePrime : nodePrime.IsPrime := nodePrime_prime_height.1\n  have hNodeHeight : nodePrime.height = 1 := nodePrime_prime_height.2.2\n  have hLiesOver : nodePrime.LiesOver q := by\n    constructor\n    simpa [Ideal.under_def, RingHom.algebraMap_toAlgebra] using hqComap\n  exact\n    (liesOver_height_le_of_hasGoingDown_source A nodeRing q nodePrime hqPrime\n      hNodePrime hLiesOver).trans (le_of_eq hNodeHeight)", "proof_size_lean": 1057, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 15, "proof_size_tex": 150, "effort_local": 0, "proof_size_tex_total": 2120, "proof_size_lean_total": 3864, "effort_total": 0}, "lem:contracted_prime_height_le_one_source": {"id": "lem:contracted_prime_height_le_one_source", "type": "lemma", "title": "Going-down gives the contracted-prime height upper bound", "chapter": "The Anderson counterexample", "statement": "For \\(q=Q\\cap A\\), the completion map gives\n  \\(\\operatorname{ht}q\\leq 1\\).", "uses": ["lem:completion_map_has_going_down_source", "lem:contracted_prime_height_le_one_of_has_going_down_source"], "lean_name": "Run202608192034.TODO.contractedPrime_height_le_one_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine the source fact that the selected completion map has going-down with\n  the checked height comparison for ideals satisfying lies-over.\n", "lean_source": "theorem contractedPrime_height_le_one_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (q : Ideal A) (w : JensenCompletionWitness A 𝔪 ι)\n    (hNoeth : IsNoetherianRing A) (hLocal : IsLocalRing A)\n    (hDomain : IsDomain A) (hqComap : q = Ideal.comap ι nodePrime)\n    (hqPrime : q.IsPrime) (hqNonzero : q ≠ ⊥) :\n    q.height ≤ 1 := by\n  exact\n    contractedPrime_height_le_one_of_hasGoingDown_source A 𝔪 ι q hNoeth\n      hLocal hDomain hqComap hqPrime hqNonzero\n      (completionMap_hasGoingDown_source A 𝔪 ι hNoeth hLocal w)", "proof_size_lean": 549, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 14, "proof_size_tex": 141, "effort_local": 0, "proof_size_tex_total": 4604, "proof_size_lean_total": 7295, "effort_total": 0}, "lem:contracted_prime_height_one_source": {"id": "lem:contracted_prime_height_one_source", "type": "lemma", "title": "The contracted prime has height one", "chapter": "The Anderson counterexample", "statement": "For \\(q=Q\\cap A\\), the contracted prime \\(q\\) has height one.", "uses": ["lem:nonzero_prime_height_ge_one_source", "lem:contracted_prime_height_le_one_source"], "lean_name": "Run202608192034.TODO.contractedPrime_height_one_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine the going-down upper bound \\(\\operatorname{ht}q\\leq1\\) with the\n  lower bound \\(\\operatorname{ht}q\\geq1\\) coming from \\(q\\neq(0)\\) in the\n  domain \\(A\\).\n", "lean_source": "theorem contractedPrime_height_one_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (q : Ideal A) (w : JensenCompletionWitness A 𝔪 ι)\n    (hNoeth : IsNoetherianRing A) (hLocal : IsLocalRing A)\n    (hDomain : IsDomain A) (hqComap : q = Ideal.comap ι nodePrime)\n    (hqPrime : q.IsPrime) (hqNonzero : q ≠ ⊥) :\n    q.height = 1 := by\n  haveI : IsDomain A := hDomain\n  exact le_antisymm\n    (contractedPrime_height_le_one_source A 𝔪 ι q w hNoeth hLocal hDomain\n      hqComap hqPrime hqNonzero)\n    (nonzeroPrime_height_ge_one_source A q hqPrime hqNonzero)", "proof_size_lean": 576, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 13, "proof_size_tex": 161, "effort_local": 0, "proof_size_tex_total": 4968, "proof_size_lean_total": 8484, "effort_total": 0}, "lem:height_one_prime_principal_ufd_source": {"id": "lem:height_one_prime_principal_ufd_source", "type": "lemma", "title": "Height-one primes in the selected UFD are principal", "chapter": "The Anderson counterexample", "statement": "A nonzero height-one prime ideal in the selected UFD is principal.", "uses": ["lem:jensen_special_case_ufd_source", "lem:contracted_prime_height_one_source"], "lean_name": "Run202608192034.TODO.heightOnePrime_principal_of_ufd_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Mathlib gives a prime element \\(p\\in q\\) inside any nonzero prime ideal of a\n  UFD.  Then \\((p)\\) is a nonzero prime ideal and \\((p)\\subseteq q\\).  If the\n  containment were strict, strict monotonicity of prime height would give\n  \\(\\operatorname{ht}(p)<\\operatorname{ht}q=1\\), contradicting\n  \\(\\operatorname{ht}(p)>0\\).\n", "lean_source": "theorem heightOnePrime_principal_of_ufd_source\n    (A : Type) [CommRing A] [IsDomain A] [UniqueFactorizationMonoid A]\n    (q : Ideal A) (_hqPrime : q.IsPrime) (_hqNonzero : q ≠ ⊥)\n    (_hqHeight : q.height = 1) :\n    ∃ a : A, q = Ideal.span ({a} : Set A) := by\n  rcases Ideal.IsPrime.exists_mem_prime_of_ne_bot _hqPrime _hqNonzero with\n    ⟨p, hpMem, hpPrime⟩\n  refine ⟨p, ?_⟩\n  have hpSpanPrime : (Ideal.span ({p} : Set A)).IsPrime :=\n    (Ideal.span_singleton_prime hpPrime.ne_zero).2 hpPrime\n  haveI : (Ideal.span ({p} : Set A)).IsPrime := hpSpanPrime\n  have hpSpanLeQ : Ideal.span ({p} : Set A) ≤ q :=\n    (Ideal.span_singleton_le_iff_mem q).mpr hpMem\n  have hpSpanNonzero : Ideal.span ({p} : Set A) ≠ ⊥ :=\n    mt Ideal.span_singleton_eq_bot.mp hpPrime.ne_zero\n  have hpBotLtSpan : (⊥ : Ideal A) < Ideal.span ({p} : Set A) :=\n    bot_lt_iff_ne_bot.mpr hpSpanNonzero\n  haveI : (⊥ : Ideal A).FiniteHeight := by\n    rw [Ideal.finiteHeight_iff]\n    exact Or.inr (by rw [Ideal.height_bot]; simp)\n  have hpSpanHeightPos : 0 < (Ideal.span ({p} : Set A)).height := by\n    have hStrict :\n        (⊥ : Ideal A).height < (Ideal.span ({p} : Set A)).height :=\n      Ideal.height_strict_mono_of_is_prime hpBotLtSpan\n    simpa [Ideal.height_bot] using hStrict\n  have hpSpanPrimeHeightPos : 0 < (Ideal.span ({p} : Set A)).primeHeight := by\n    simpa [Ideal.height_eq_primeHeight] using hpSpanHeightPos\n  haveI : q.FiniteHeight := by\n    rw [Ideal.finiteHeight_iff]\n    exact Or.inr (by rw [_hqHeight]; simp)\n  have hqPrimeHeight : q.primeHeight = 1 := by\n    simpa [Ideal.height_eq_primeHeight] using _hqHeight\n  by_contra hNe\n  have hSpanLtQ : Ideal.span ({p} : Set A) < q :=\n    lt_of_le_of_ne hpSpanLeQ (fun hEq => hNe hEq.symm)\n  have hPrimeHeightLt :\n      (Ideal.span ({p} : Set A)).primeHeight < q.primeHeight :=\n    Ideal.primeHeight_strict_mono hSpanLtQ\n  rw [hqPrimeHeight] at hPrimeHeightLt\n  exact\n    (not_lt_of_ge\n      (ENat.one_le_iff_ne_zero.mpr (ne_of_gt hpSpanPrimeHeightPos)))\n      hPrimeHeightLt", "proof_size_lean": 2005, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 11, "proof_size_tex": 321, "effort_local": 0, "proof_size_tex_total": 5499, "proof_size_lean_total": 10692, "effort_total": 0}, "lem:prime_generator_source": {"id": "lem:prime_generator_source", "type": "lemma", "title": "Source theorem for the prime generator", "chapter": "The Anderson counterexample", "statement": "The Jensen construction and the UFD height-one-prime argument supply the\n  prime-generator package used later.", "uses": ["def:prime_generator", "lem:jensen_special_case", "lem:counterexample_weak_criterion_source", "lem:contracted_prime_height_one_source", "lem:height_one_prime_principal_ufd_source", "lem:jensen_special_case_ufd_source"], "lean_name": "Run202608192034.TODO.primeGenerator_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use the constructed ring \\(A\\), take \\(q=Q\\cap A\\), and apply the\n  height-one-prime-in-a-UFD argument to choose \\(a\\) with \\(q=aA\\).  The\n  generic-fiber condition gives nonzeroness of the contraction.  The Jensen\n  completion witness supplies both the transported Farley criterion and the\n  going-down input used in the height calculation.\n", "lean_source": "theorem primeGenerator_source : primeGenerator := by\n  rcases jensenSpecialCase with\n    ⟨A, instA, 𝔪, ι, w, hNoeth, hLocal, hDomain, hBot, hNonzeroContraction⟩\n  letI := instA\n  let q : Ideal A := Ideal.comap ι nodePrime\n  have hCounter : counterexampleRing :=\n    ⟨A, instA, 𝔪, ι, w, hNoeth, hLocal, hDomain, hBot, hNonzeroContraction⟩\n  have hqComap : q = Ideal.comap ι nodePrime := rfl\n  have hqPrime : q.IsPrime := by\n    haveI : nodePrime.IsPrime := nodePrime_prime_height.1\n    exact Ideal.comap_isPrime ι nodePrime\n  have hqNonzero : q ≠ ⊥ :=\n    hNonzeroContraction nodePrime nodePrime_prime_height.1 nodePrime_prime_height.2.1\n  have hqHeight : q.height = 1 :=\n    contractedPrime_height_one_source A 𝔪 ι q w hNoeth hLocal hDomain\n      hqComap hqPrime hqNonzero\n  have hWeak : WeaklyQuasiComplete A 𝔪 :=\n    (counterexampleRing_weakCriterion_source A 𝔪 ι w).2 hNonzeroContraction\n  haveI : IsDomain A := hDomain\n  haveI : UniqueFactorizationMonoid A :=\n    jensenSpecialCase_isUFD_source A 𝔪 ι w\n  rcases heightOnePrime_principal_of_ufd_source A q hqPrime hqNonzero hqHeight with\n    ⟨a, hqPrincipal⟩\n  exact\n    ⟨A, instA, 𝔪, ι, q, a, w, hCounter, hNoeth, hLocal, hDomain, hWeak,\n      hBot, hNonzeroContraction, hqComap, hqPrime, hqNonzero, hqPrincipal⟩", "proof_size_lean": 1266, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 6, "rdep_count": 1, "descendant_count": 10, "proof_size_tex": 341, "effort_local": 0, "proof_size_tex_total": 15123, "proof_size_lean_total": 29959, "effort_total": 0}, "lem:extended_principal_specific_not_prime": {"id": "lem:extended_principal_specific_not_prime", "type": "lemma", "title": "The chosen extended principal ideal is not prime", "chapter": "The Anderson counterexample", "statement": "For the specific generator \\(a\\) of the contracted prime \\(q\\), the extended\n  ideal \\(aT\\) is not prime.", "uses": ["def:prime_generator", "lem:counterexample_ring_properties", "lem:node_prime_height", "lem:node_prime_nonprincipal"], "lean_name": "Run202608192034.TODO.extendedPrincipal_not_prime_of_generator_data", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The identity \\(q=aA\\) gives \\(qT=aT\\), while\n  \\(q=Q\\cap A\\) gives \\(qT\\subseteq Q\\).  Since \\(A\\subseteq T\\), the extended\n  ideal is nonzero.  If \\(aT\\) were prime, the principal ideal theorem would\n  give height at most one, and nonzeroness in the domain \\(T\\) gives height at\n  least one.  A strict containment \\(aT\\subsetneq Q\\) would then strictly\n  increase prime height, contradicting that both have height one.  Hence\n  \\(aT=Q\\), contradicting that \\(Q\\) is not principal.\n", "lean_source": "theorem extendedPrincipal_not_prime_of_generator_data\n    (A : Type u) [CommRing A] (ι : A →+* nodeRing) (q : Ideal A) (a : A)\n    (hBot : Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥)\n    (hqComap : q = Ideal.comap ι nodePrime)\n    (hqNonzero : q ≠ ⊥)\n    (hqPrincipal : q = Ideal.span ({a} : Set A)) :\n    ¬ (Ideal.span ({ι a} : Set nodeRing)).IsPrime := by\n  have hMapPrincipal :\n      Ideal.map ι q = Ideal.span ({ι a} : Set nodeRing) := by\n    calc\n      Ideal.map ι q = Ideal.map ι (Ideal.span ({a} : Set A)) := by\n        rw [hqPrincipal]\n      _ = Ideal.span (ι '' ({a} : Set A)) := Ideal.map_span ι ({a} : Set A)\n      _ = Ideal.span ({ι a} : Set nodeRing) := by simp\n  have hMapLeNodePrime : Ideal.map ι q ≤ nodePrime := by\n    rw [hqComap]\n    exact Ideal.map_comap_le\n  have hPrincipalLeNodePrime : Ideal.span ({ι a} : Set nodeRing) ≤ nodePrime := by\n    simpa [hMapPrincipal] using hMapLeNodePrime\n  intro hPrincipalPrime\n  have hNodePrime : nodePrime.IsPrime := nodePrime_prime_height.1\n  have hNodeHeight : nodePrime.height = 1 := nodePrime_prime_height.2.2\n  have hNodeNotPrincipal :\n      ¬ ∃ b : nodeRing, nodePrime = Ideal.span ({b} : Set nodeRing) :=\n    nodePrime_not_principal\n  haveI : IsDomain nodeRing := nodeRing_isDomain\n  haveI : IsNoetherianRing nodeRing := node_complete_cm_dim.1\n  have hInjective : Function.Injective ι := by\n    rw [RingHom.injective_iff_ker_eq_bot, RingHom.ker_eq_comap_bot]\n    exact hBot\n  have hMapNonzero : Ideal.map ι q ≠ ⊥ := by\n    intro hMapBot\n    exact hqNonzero ((Ideal.map_eq_bot_iff_of_injective hInjective).mp hMapBot)\n  have hPrincipalNonzero :\n      Ideal.span ({ι a} : Set nodeRing) ≠ ⊥ := by\n    simpa [hMapPrincipal] using hMapNonzero\n  have hPrincipalProper :\n      Ideal.span ({ι a} : Set nodeRing) ≠ ⊤ := by\n    intro hTop\n    exact hNodePrime.ne_top\n      (top_le_iff.mp (by simpa [hTop] using hPrincipalLeNodePrime))\n  have hPrincipalHeightLe :\n      (Ideal.span ({ι a} : Set nodeRing)).height ≤ 1 := by\n    have hRankLe :\n        Cardinal.toENat\n            (Submodule.spanRank (Ideal.span ({ι a} : Set nodeRing))) ≤\n          (1 : ℕ∞) := by\n      calc\n        Cardinal.toENat\n            (Submodule.spanRank (Ideal.span ({ι a} : Set nodeRing))) ≤\n            Cardinal.toENat (Cardinal.mk ({ι a} : Set nodeRing)) :=\n          Cardinal.toENat.monotone'\n            (Submodule.spanRank_span_le_card ({ι a} : Set nodeRing))\n        _ = (1 : ℕ∞) := by simp\n    exact (Ideal.height_le_spanRank_toENat\n      (Ideal.span ({ι a} : Set nodeRing)) hPrincipalProper).trans hRankLe\n  have hBotLtPrincipal :\n      (⊥ : Ideal nodeRing) < Ideal.span ({ι a} : Set nodeRing) := by\n    exact bot_lt_iff_ne_bot.mpr hPrincipalNonzero\n  have hPrincipalHeightPos :\n      0 < (Ideal.span ({ι a} : Set nodeRing)).height := by\n    have hStrict :\n        (⊥ : Ideal nodeRing).height <\n          (Ideal.span ({ι a} : Set nodeRing)).height :=\n      Ideal.height_strict_mono_of_is_prime hBotLtPrincipal\n    simpa [Ideal.height_bot] using hStrict\n  have hPrincipalHeightEq :\n      (Ideal.span ({ι a} : Set nodeRing)).height = 1 := by\n    refine le_antisymm hPrincipalHeightLe ?_\n    exact ENat.one_le_iff_ne_zero.mpr (ne_of_gt hPrincipalHeightPos)\n  have hPrincipalEqNode : Ideal.span ({ι a} : Set nodeRing) = nodePrime := by\n    by_contra hNe\n    have hLt : Ideal.span ({ι a} : Set nodeRing) < nodePrime :=\n      lt_of_le_of_ne hPrincipalLeNodePrime hNe\n    have hPrimeHeightLt :\n        (Ideal.span ({ι a} : Set nodeRing)).primeHeight < nodePrime.primeHeight :=\n      Ideal.primeHeight_strict_mono hLt\n    have hPrincipalPrimeHeight :\n        (Ideal.span ({ι a} : Set nodeRing)).primeHeight = 1 := by\n      simpa [Ideal.height_eq_primeHeight] using hPrincipalHeightEq\n    have hNodePrimeHeight : nodePrime.primeHeight = 1 := by\n      simpa [Ideal.height_eq_primeHeight] using hNodeHeight\n    rw [hPrincipalPrimeHeight, hNodePrimeHeight] at hPrimeHeightLt\n    exact (lt_irrefl (1 : ℕ∞)) hPrimeHeightLt\n  exact hNodeNotPrincipal ⟨ι a, hPrincipalEqNode.symm⟩", "proof_size_lean": 3996, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 2, "descendant_count": 5, "proof_size_tex": 481, "effort_local": 0, "proof_size_tex_total": 13446, "proof_size_lean_total": 25591, "effort_total": 0}, "lem:extended_principal_not_prime": {"id": "lem:extended_principal_not_prime", "type": "lemma", "title": "The extended principal ideal is not prime", "chapter": "The Anderson counterexample", "statement": "The ideal \\(aT\\) is a proper nonprime ideal of \\(T\\).", "uses": ["lem:extended_principal_specific_not_prime"], "lean_name": "Run202608192034.TODO.extendedPrincipal_not_prime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the existential form of\n  \\cref{lem:extended_principal_specific_not_prime}.\n", "lean_source": "theorem extendedPrincipal_not_prime :\n    primeGenerator →\n      ∃ (a : nodeRing), ¬ (Ideal.span ({a} : Set nodeRing)).IsPrime := by\n  intro hGen\n  rcases hGen with\n    ⟨A, instA, _𝔪, ι, q, a, _w, _hCounter, _hNoeth, _hLocal, _hDomain,\n      _hWeak, hBot, _hNonzeroContraction, hqComap, _hqPrime, _hqNonzero,\n      hqPrincipal⟩\n  letI := instA\n  exact\n    ⟨ι a,\n      extendedPrincipal_not_prime_of_generator_data A ι q a hBot hqComap\n        _hqNonzero hqPrincipal⟩", "proof_size_lean": 466, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 83, "effort_local": 0, "proof_size_tex_total": 13529, "proof_size_lean_total": 26057, "effort_total": 0}, "def:bad_quotient": {"id": "def:bad_quotient", "type": "definition", "title": "The bad quotient", "chapter": "The Anderson counterexample", "statement": "Set \\(B=A/aA\\).", "uses": ["def:counterexample_ring", "def:prime_generator"], "lean_name": "Run202608192034.TODO.badQuotient", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition.\n", "lean_source": "def badQuotient : Prop :=\n  ∃ (A : Type) (_inst : CommRing A) (𝔪 : @Ideal A _inst.toSemiring)\n    (ι : A →+* nodeRing) (q : @Ideal A _inst.toSemiring) (a : A),\n    IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n      WeaklyQuasiComplete A 𝔪 ∧\n        Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n          q = Ideal.comap ι nodePrime ∧ q.IsPrime ∧ q ≠ ⊥ ∧\n            q = Ideal.span ({a} : Set A)", "proof_size_lean": 395, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 108, "proof_size_tex": 21, "effort_local": 0, "proof_size_tex_total": 12561, "proof_size_lean_total": 21729, "effort_total": 0}, "def:bad_quotient_source_data": {"id": "def:bad_quotient_source_data", "type": "definition", "title": "Bad quotient source data", "chapter": "The Anderson counterexample", "statement": "Package the source data for the bad quotient as one object:\n  \\(A\\), \\(\\mathfrak m_A\\), the map \\(A\\to T\\), the contracted prime\n  \\(q=Q\\cap A\\), its chosen generator \\(a\\), and the structural properties of\n  \\(A\\) and \\(q\\).", "uses": ["def:bad_quotient", "def:prime_generator"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a data structure organizing the hypotheses already present in\n  \\cref{def:bad_quotient}, together with the Jensen generic-fiber data needed\n  to recover the earlier contracted-prime and prime-generator nodes.\n", "lean_source": "structure BadQuotientSourceData where\n  A : Type\n  [instA : CommRing A]\n  𝔪 : Ideal A\n  ι : A →+* nodeRing\n  q : Ideal A\n  a : A\n  hCounter : counterexampleRing\n  hNoeth : IsNoetherianRing A\n  hLocal : IsLocalRing A\n  hDomain : IsDomain A\n  jensenCompletion : JensenCompletionWitness A 𝔪 ι\n  hWeak : WeaklyQuasiComplete A 𝔪\n  hBot : Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥\n  hNonzeroContraction :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥\n  hqComap : q = Ideal.comap ι nodePrime\n  hqPrime : q.IsPrime\n  hqNonzero : q ≠ ⊥\n  hqPrincipal : q = Ideal.span ({a} : Set A)\n\nattribute [instance] BadQuotientSourceData.instA", "proof_size_lean": 638, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 23, "descendant_count": 106, "proof_size_tex": 216, "effort_local": 0, "proof_size_tex_total": 12777, "proof_size_lean_total": 22367, "effort_total": 0}, "def:bad_quotient_quasi_criterion_field": {"id": "def:bad_quotient_quasi_criterion_field", "type": "definition", "title": "Quotient criterion field", "chapter": "The Anderson counterexample", "statement": "The source data carries the Anderson/Farley criterion saying that\n  \\(A\\) is quasi-complete exactly when all quotients \\(A/J\\) are weakly\n  quasi-complete.", "uses": ["def:bad_quotient_source_data", "lem:quotient_weak_characterization"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.QuasiCriterion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This field records the criterion in the notation of the chosen data package.\n", "lean_source": "def BadQuotientSourceData.QuasiCriterion\n    (d : BadQuotientSourceData) : Prop :=\n  QuasiComplete d.A d.𝔪 ↔\n    ∀ J : Ideal d.A,\n      WeaklyQuasiComplete (d.A ⧸ J) (Ideal.map (Ideal.Quotient.mk J) d.𝔪)", "proof_size_lean": 203, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 9, "proof_size_tex": 76, "effort_local": 0, "proof_size_tex_total": 13602, "proof_size_lean_total": 25878, "effort_total": 0}, "def:bad_quotient_dimension_criterion_field": {"id": "def:bad_quotient_dimension_criterion_field", "type": "definition", "title": "Dimension-one criterion field", "chapter": "The Anderson counterexample", "statement": "The source data carries the dimension-one criterion identifying weak\n  quasi-completeness of \\(A/q\\) with analytic irreducibility of the completed\n  quotient \\(T/aT\\).", "uses": ["def:bad_quotient_source_data", "lem:dimension_one_weak_criterion"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.DimensionCriterion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This field records the dimension-one criterion in the notation of the chosen\n  data package.\n", "lean_source": "def BadQuotientSourceData.DimensionCriterion\n    (d : BadQuotientSourceData) : Prop :=\n  WeaklyQuasiComplete (d.A ⧸ d.q)\n    (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ↔\n      AnalyticallyIrreducible (d.A ⧸ d.q)\n        (nodeRing ⧸ Ideal.span ({d.ι d.a} : Set nodeRing))", "proof_size_lean": 267, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 92, "effort_local": 0, "proof_size_tex_total": 13362, "proof_size_lean_total": 23384, "effort_total": 0}, "lem:bad_quotient_source_data_quotient_is_noetherian": {"id": "lem:bad_quotient_source_data_quotient_is_noetherian", "type": "lemma", "title": "The bad quotient is Noetherian", "chapter": "The Anderson counterexample", "statement": "The quotient ring \\(A/q\\) is Noetherian.", "uses": ["def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.quotient_isNoetherian", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This follows from the stored Noetherian hypothesis on \\(A\\) and Mathlib's\n  Noetherian quotient instance.\n", "lean_source": "theorem BadQuotientSourceData.quotient_isNoetherian\n    (d : BadQuotientSourceData) :\n    IsNoetherianRing (d.A ⧸ d.q) := by\n  letI : IsNoetherianRing d.A := d.hNoeth\n  infer_instance", "proof_size_lean": 183, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 17, "proof_size_tex": 105, "effort_local": 0, "proof_size_tex_total": 12882, "proof_size_lean_total": 22550, "effort_total": 0}, "lem:bad_quotient_source_data_quotient_is_domain": {"id": "lem:bad_quotient_source_data_quotient_is_domain", "type": "lemma", "title": "The bad quotient is a domain", "chapter": "The Anderson counterexample", "statement": "The quotient ring \\(A/q\\) is a domain.", "uses": ["def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.quotient_isDomain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Since \\(q\\) is prime, this is `Ideal.Quotient.isDomain_iff_prime`.\n", "lean_source": "theorem BadQuotientSourceData.quotient_isDomain\n    (d : BadQuotientSourceData) :\n    IsDomain (d.A ⧸ d.q) := by\n  exact (Ideal.Quotient.isDomain_iff_prime d.q).mpr d.hqPrime", "p ", "proof_size_lean": 161, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 4, "descendant_count": 28, "proof_size_tex": 81, "effort_local": 0, "proof_size_tex_total": 12858, "proof_size_lean_total": 22528, "effort_total": 0}, "lem:adic_completion_is_noetherian_ring_from_jensen": {"id": "lem:adic_completion_is_noetherian_ring_from_jensen", "type": "lemma", "title": "The Jensen completion is Noetherian", "chapter": "The Anderson counterexample", "statement": "If Jensen's construction identifies \\(\\widehat A\\) with the chosen node\n  ring \\(T\\), then \\(\\widehat A\\) is Noetherian.", "uses": ["def:jensen_completion_witness", "lem:node_complete_cm_dim", "lem:is_noetherian_ring_of_ring_equiv_source"], "lean_name": "Run202608192034.TODO.adicCompletion_isNoetherianRing_from_jensen", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The complete node ring \\(T\\) is Noetherian by the node-ring package.\n  Transport this Noetherianity backward across the inverse of the Jensen\n  completion equivalence \\(\\widehat A\\cong T\\).\n", "lean_source": "theorem adicCompletion_isNoetherianRing_from_jensen\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (w : JensenCompletionWitness A 𝔪 ι) :\n    IsNoetherianRing (AdicCompletion 𝔪 A) := by\n  haveI : IsNoetherianRing nodeRing := node_complete_cm_dim.1\n  exact isNoetherianRing_of_ringEquiv_source w.completionEquiv.symm", "proof_size_lean": 334, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 1, "descendant_count": 16, "proof_size_tex": 189, "effort_local": 0, "proof_size_tex_total": 3526, "proof_size_lean_total": 3491, "effort_total": 0}, "lem:bad_quotient_source_data_source_ring_krull_dim_eq_two": {"id": "lem:bad_quotient_source_data_source_ring_krull_dim_eq_two", "type": "lemma", "title": "The source ring is two-dimensional", "chapter": "The Anderson counterexample", "statement": "The Jensen source ring \\(A\\) has Krull dimension two.", "uses": ["lem:bad_quotient_source_data_jensen_completion_witness"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.source_ringKrullDim_eq_two", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the dimension field of the Jensen completion witness: the selected\n  \\(A\\) has completion \\(T\\), and \\(T\\) is the two-dimensional node ring.\n", "lean_source": "theorem BadQuotientSourceData.source_ringKrullDim_eq_two\n    (d : BadQuotientSourceData) :\n    ringKrullDim d.A = 2 :=\n  d.jensenCompletionWitness.sourceRingKrullDim_eq_two", "proof_size_lean": 172, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 18, "proof_size_tex": 148, "effort_local": 0, "proof_size_tex_total": 13006, "proof_size_lean_total": 22700, "effort_total": 0}, "lem:bad_quotient_source_data_adic_completion_is_noetherian_ring": {"id": "lem:bad_quotient_source_data_adic_completion_is_noetherian_ring", "type": "lemma", "title": "The source completion is Noetherian", "chapter": "The Anderson counterexample", "statement": "For the bad quotient source data, the completion\n  \\(\\widehat A^{\\,\\mathfrak m}\\) is Noetherian.", "uses": ["lem:bad_quotient_source_data_jensen_completion_witness", "lem:adic_completion_is_noetherian_ring_from_jensen"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.adicCompletion_isNoetherianRing", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply the Jensen completion Noetherianity lemma to the completion witness\n  recovered from the source data.\n", "lean_source": "theorem BadQuotientSourceData.adicCompletion_isNoetherianRing\n    (d : BadQuotientSourceData) :\n    IsNoetherianRing (AdicCompletion d.𝔪 d.A) :=\n  adicCompletion_isNoetherianRing_from_jensen d.A d.𝔪 d.ι\n    d.jensenCompletionWitness", "proof_size_lean": 23 ata_generator_ne_zero"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.generator_mem_nonZeroDivisors", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Since \\(A\\) is a domain, every nonzero element is a non-zero-divisor.\n", "lean_source": "theorem BadQuotientSourceData.generator_mem_nonZeroDivisors\n    (d : BadQuotientSourceData) :\n    d.a ∈ nonZeroDivisors d.A := by\n  haveI : IsDomain d.A := d.hDomain\n  exact mem_nonZeroDivisors_iff_ne_zero.mpr d.generator_ne_zero", "proof_size_lean": 229, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 19, "proof_size_tex": 69, "effort_local": 0, "proof_size_tex_total": 12929, "proof_size_lean_total": 22758, "effort_total": 0}, "lem:bad_quotient_source_data_generator_mem_maximal_ideal": {"id": "lem:bad_quotient_source_data_generator_mem_maximal_ideal", "type": "lemma", "title": "The chosen generator lies in the maximal ideal", "chapter": "The Anderson counterexample", "statement": "The chosen generator \\(a\\) lies in the maximal ideal of the local ring \\(A\\).", "uses": ["lem:bad_quotient_source_data_generator_mem_q"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.generator_mem_maximalIdeal", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The proper prime ideal \\(q\\) is contained in the maximal ideal of the local\n  ring \\(A\\), and \\(a\\in q\\).\n", "lean_source": "theorem BadQuotientSourceData.generator_mem_maximalIdeal\n    (d : BadQuotientSourceData) :\n    d.a ∈ @IsLocalRing.maximalIdeal d.A inferInstance d.hLocal := by\n  letI : IsLocalRing d.A := d.hLocal\n  have hqLe : d.q ≤ IsLocalRing.maximalIdeal d.A :=\n    IsLocalRing.le_maximalIdeal d.hqPrime.ne_top\n  exact hqLe d.generator_mem_q", "proof_size_lean": 328, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 19,
