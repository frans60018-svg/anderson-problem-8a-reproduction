<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blueprint dependency graph</title>
<link rel="stylesheet" href="https://unpkg.com/katex@0.16.9/dist/katex.min.css">
<script src="https://unpkg.com/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root {
  --sidebar-bg: #0f172a;
  --toolbar-bg: #1e293b;
  --surface:    #1a2744;
  --border:     #1e3a5f;
  --text:       #e2e8f0;
  --muted:      #64748b;
  --accent:     #60a5fa;
  --green:      #4ade80;
  --green-bg:   rgba(74,222,128,.12);
  --red:        #f87171;
  --red-bg:     rgba(248,113,113,.12);
  --orange:     #fb923c;
  --orange-bg:  rgba(251,146,60,.12);
  --code-bg:    #090d16;
  --radius:     7px;
  --mono: 'JetBrains Mono','Fira Code','Cascadia Code','Consolas','Monaco',monospace;
  --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}

html { margin:0; padding:0; height:100%; overflow:hidden; }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--sans); display:flex; flex-direction:column;
       height:100%; background:#f8fafc; color:var(--text); }

/* ── Toolbar ─────────────────────────────────────────────────── */
#toolbar {
  background:var(--toolbar-bg); height:44px; padding:0 16px;
  display:flex; align-items:center; gap:14px; flex-shrink:0;
  border-bottom:1px solid #263045;
}
.brand { font-size:13px; font-weight:700; color:#f1f5f9; letter-spacing:.03em; }
.stat  { font-size:12px; color:#64748b; white-space:nowrap; }
.legend { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.leg-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.leg-bar {
  width:54px; height:8px; border-radius:4px; display:inline-block;
  background:linear-gradient(90deg,#facc15,#f59e0b,#f97316);
}
.leg-txt { font-size:10px; font-weight:600; color:#94a3b8; }
.sym-legend { padding-left:10px; margin-left:4px; border-left:1px solid #334155; gap:8px; }
.hint { margin-left:auto; font-size:11px; color:#334155; white-space:nowrap; }

/* ── Controls bar ────────────────────────────────────────────── */
#controls {
  background:#16233b; min-height:40px; padding:6px 16px;
  display:flex; align-items:center; gap:10px; flex-shrink:0;
  border-bottom:1px solid #263045; flex-wrap:wrap;
}
#controls input[type=text], #controls select {
  background:#0f1f3d; color:var(--text); border:1px solid #1e3a5f;
  border-radius:5px; font-size:12px; padding:5px 8px;
  font-family:var(--sans); outline:none;
}
#controls input[type=text] { width:200px; }
#controls input[type=text]:focus, #controls select:focus { border-color:var(--accent); }
#controls select { max-width:260px; cursor:pointer; }
#controls .chk { font-size:12px; color:#94a3b8; display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; }
.btn {
  background:#1e293b; color:#cbd5e1; border:1px solid #334155;
  border-radius:5px; font-size:12px; padding:5px 12px; cursor:pointer;
}
.btn:hover { background:#263045; }
.pill {
  display:inline-flex; align-items:center; gap:7px;
  background:#172554; color:#93c5fd; border:1px solid #1e3a8a;
  border-radius:12px; font-size:11px; padding:3px 4px 3px 11px; cursor:pointer;
  max-width:280px;
}
.pill .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill .x { font-weight:700; padding:0 6px; border-radius:9px; }
.pill:hover .x { background:#1e3a8a; }

/* ── Main layout ─────────────────────────────────────────────── */
#main  { display:flex; flex:1; overflow:hidden; min-height:0; position:relative; }
#graph { flex:1; min-height:0; background:#f8fafc; }

/* ── Project-stats overlay ───────────────────────────────────── */
#stats-panel {
  position:absolute; top:12px; left:12px; z-index:5;
  background:rgba(15,23,42,.9); border:1px solid #1e3a5f; border-radius:8px;
  padding:10px 12px; min-width:188px; backdrop-filter:blur(3px);
  font-size:11px; color:#cbd5e1; box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#stats-panel h4 {
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:#64748b; margin-bottom:7px;
}
#stats-panel .row { display:flex; justify-content:space-between; gap:14px; line-height:1.7; }
#stats-panel .row .v { font-family:var(--mono); color:#f1f5f9; }
#stats-panel .v.done { color:var(--green); }
#stats-panel .v.work { color:var(--orange); }
#stats-panel .v.inf  { color:var(--red); }
#stats-panel .bar {
  height:6px; border-radius:3px; background:#1e293b; margin:7px 0 3px; overflow:hidden;
}
#stats-panel .bar > span { display:block; height:100%; background:var(--green); }
#stats-panel .sep { border-top:1px solid #1e3a5f; margin:7px 0; }
#graph canvas { display:block; }

/* ── File-view colour legend ─────────────────────────────────── */
#file-legend {
  position:absolute; bottom:12px; left:12px; z-index:5;
  background:rgba(15,23,42,.9); border:1px solid #1e3a5f; border-radius:8px;
  padding:9px 11px; max-width:280px; max-height:42%; overflow-y:auto;
  backdrop-filter:blur(3px); font-size:11px; color:#cbd5e1;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#file-legend::-webkit-scrollbar { width:4px; }
#file-legend::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:2px; }
#file-legend h4 {
  font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:#64748b; margin-bottom:7px;
}
#file-legend .fl-row { display:flex; align-items:center; gap:7px; line-height:1.9; }
#file-legend .fl-sw { width:11px; height:11px; border-radius:3px; flex-shrink:0;
  border:1px solid rgba(255,255,255,.18); }
#file-legend .fl-name {
  font-family:var(--mono); font-size:10px; color:#cbd5e1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
}
#file-legend .fl-n { font-family:var(--mono); font-size:10px; color:#64748b; }
#file-legend .fl-empty { font-style:italic; color:#475569; }

/* ── Sidebar ─────────────────────────────────────────────────── */
#sidebar {
  width:340px; flex-shrink:0;
  background:var(--sidebar-bg);
  border-left:1px solid #1e293b;
  display:flex; flex-direction:column; overflow:hidden;
}
#sidebar-empty {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
}
#sidebar-empty svg { opacity:.2; }
#sidebar-empty p { font-size:13px; color:#334155; }
#sidebar-content {
  flex:1; overflow-y:auto; padding:10px;
  display:flex; flex-direction:column; gap:8px;
}
#sidebar-content::-webkit-scrollbar { width:4px; }
#sidebar-content::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:2px; }

/* ── Cards ───────────────────────────────────────────────────── */
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px;
}
.card-title {
  font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); margin-bottom:10px;
}
.btn-focus {
  width:100%; margin-top:10px; background:#172554; color:#93c5fd;
  border:1px solid #1e3a8a; border-radius:5px; font-size:11px;
  font-weight:600; padding:7px; cursor:pointer; letter-spacing:.02em;
}
.btn-focus:hover { background:#1e3a8a; color:#bfdbfe; }

/* ── Header card ─────────────────────────────────────────────── */
.node-badges { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
.badge {
  display:inline-block; padding:2px 8px; border-radius:10px;
  font-size:10px; font-weight:700; letter-spacing:.04em;
}
.badge-type    { background:#172554; color:#93c5fd; border:1px solid #1e3a8a44; }
.badge-proved  { background:var(--green-bg);  color:var(--green);  border:1px solid rgba(74,222,128,.25); }
.badge-sorry   { background:var(--orange-bg); color:var(--orange); border:1px solid rgba(251,146,60,.25); }
.badge-unproved{ background:var(--red-bg);    color:var(--red);    border:1px solid rgba(248,113,113,.25); }
.node-title   { font-size:15px; font-weight:600; color:#f1f5f9; line-height:1.35; margin-bottom:5px; }
.node-id      { font-family:var(--mono); font-size:11px; color:#475569; }
.node-chapter { font-size:11px; color:#334155; margin-top:3px; }
.lean-ref     { font-size:11px; color:var(--muted); margin-top:6px; }
.lean-ref code{ font-family:var(--mono); color:var(--accent); }

/* ── Structure card ──────────────────────────────────────────── */
.degrees { display:flex; gap:20px; margin-bottom:10px; }
.degree  { display:flex; flex-direction:column; align-items:center; gap:2px; }
.degree-val   { font-size:22px; font-weight:700; color:#f1f5f9; line-height:1; }
.degree-label { font-size:10px; color:var(--muted); text-align:center; }
.deps-list  { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
.deps-sub   { font-size:10px; color:var(--muted); margin:6px 0 4px; letter-spacing:.03em; }
.dep-chip {
  font-family:var(--mono); font-size:10px; padding:3px 7px;
  background:#0f1f3d; border:1px solid #1e3a5f;
  border-radius:4px; color:var(--accent); cursor:pointer; transition:background .15s;
}
.dep-chip:hover { background:#172554; }
.no-deps { font-size:12px; color:var(--muted); font-style:italic; }

/* ── Metrics card ────────────────────────────────────────────── */
.metrics-grid {
  display:grid; grid-template-columns:auto 1fr 1fr;
  gap:5px 10px; align-items:center;
}
.col-head { font-size:10px; color:#334155; text-align:right; font-weight:600; }
.m-label  { font-size:11px; color:var(--muted); }
.m-val    { font-family:var(--mono); font-size:12px; color:#94a3b8; text-align:right; }
.m-done   { color:var(--green); font-weight:700; }
.m-inf    { color:var(--red);   font-weight:700; }
.m-work   { color:var(--orange); }

/* ── Section header ──────────────────────────────────────────── */
.sec-hdr {
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;
}
.chars-pair { font-family:var(--mono); font-size:10px; color:#334155; }
.chars-inf  { color:var(--red); }
.chars-val  { color:#475569; }

/* ── LaTeX rendered block ────────────────────────────────────── */
.latex-rendered {
  font-family:var(--sans); font-size:13px; line-height:1.7;
  color:#94a3b8; overflow-x:auto; min-height:1.5em;
}
.latex-rendered .katex-display { margin:6px 0; overflow-x:auto; }
.latex-rendered em { font-style:italic; color:#cbd5e1; }
.latex-rendered strong { font-weight:600; color:#cbd5e1; }
.latex-rendered.empty { color:#1e3a5f; font-style:italic; }

/* ── Lean code block ─────────────────────────────────────────── */
.code-block {
  font-family:var(--mono); font-size:11px; line-height:1.6;
  background:var(--code-bg); color:#abb2bf;
  border:1px solid #1a2744; border-radius:5px;
  padding:10px 12px; white-space:pre; overflow:auto;
  max-height:220px;
}
.code-block::-webkit-scrollbar { width:4px; height:4px; }
.code-block::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:2px; }
.code-block.empty { color:#1e3a5f; font-style:italic; white-space:normal; }

/* ── Lean syntax colours (One Dark palette) ──────────────────── */
.hl-kw      { color:#c678dd; }
.hl-tactic  { color:#61afef; }
.hl-type    { color:#e5c07b; }
.hl-comment { color:#5c6370; font-style:italic; }
.hl-str     { color:#98c379; }
.hl-num     { color:#d19a66; }
</style>
</head>

  <button id="reset" class="btn">Reset view</button>
</div>
<div id="main">

  <div id="stats-panel"></div>
  <div id="file-legend" style="display:none"></div>

      </svg>
      <p>Click a node to inspect it</p>
    </div>
    <div id="sidebar-content" style="display:none"></div>
  </aside>
</div>

const allNodes  = {"def:quasi_complete": {"id": "def:quasi_complete", "type": "definition", "title": "Quasi-complete local ring", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: D.~D. Anderson, Definition~1,\n  references/anderson\\_2014\\_fulltext.txt, lines 68--76,\n  DOI 10.1007/978-1-4939-0925-4\\_2.}\n  Let \\((R,\\mathfrak m)\\) be a Noetherian local ring.  It is\n  \\emph{quasi-complete} if, for every decreasing sequence\n  \\[\n    I_1\\supseteq I_2\\supseteq\\cdots\n  \\]\n  of ideals and every integer \\(k\\geq 1\\), there is an index \\(s\\) for which\n  \\[\n    I_s\\subseteq \\left(\\bigcap_{n\\geq 1}I_n\\right)+\\mathfrak m^k.\n  \\]", "uses": [], "lean_name": "Run202608192034.TODO.QuasiComplete", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition.  The intersection is the infimum of the sequence in\n  the lattice of ideals, and the sum and power are the usual ideal operations.\n", "lean_source": "def QuasiComplete (R : Type u) [CommRing R] (𝔪 : Ideal R) : Prop :=\n  ∀ (I : ℕ → Ideal R),\n    (∀ n : ℕ, I (n + 1) ≤ I n) →\n      ∀ k : ℕ, 0 < k → ∃ s : ℕ, I s ≤ (⨅ n, I n) ⊔ 𝔪 ^ k", "proof_size_lean": 180, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 0, "rdep_count": 3, "descendant_count": 147, "proof_size_tex": 152, "effort_local": 0, "proof_size_tex_total": 152, "proof_size_lean_total": 180, "effort_total": 0}, "def:weakly_quasi_complete": {"id": "def:weakly_quasi_complete", "type": "definition", "title": "Weakly quasi-complete local ring", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: D.~D. Anderson, Definition~1,\n  references/anderson\\_2014\\_fulltext.txt, lines 68--76,\n  DOI 10.1007/978-1-4939-0925-4\\_2.}\n  Let \\((R,\\mathfrak m)\\) be a Noetherian local ring.  It is \\emph{weakly\n  quasi-complete} if every decreasing sequence of ideals with zero\n  intersection eventually lies in each prescribed power of \\(\\mathfrak m\\):\n  for every \\(k\\geq 1\\), some \\(s\\) satisfies \\(I_s\\subseteq\\mathfrak m^k\\).", "uses": ["def:quasi_complete"], "lean_name": "Run202608192034.TODO.WeaklyQuasiComplete", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition, obtained from \\cref{def:quasi_complete} by restricting\n  to chains whose intersection is the zero ideal.\n", "lean_source": "def WeaklyQuasiComplete (R : Type u) [CommRing R] (𝔪 : Ideal R) : Prop :=\n  ∀ (I : ℕ → Ideal R),\n    (∀ n : ℕ, I (n + 1) ≤ I n) →\n      (⨅ n, I n) = ⊥ →\n        ∀ k : ℕ, 0 < k → ∃ s : ℕ, I s ≤ 𝔪 ^ k", "proof_size_lean": 198, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 8, "descendant_count": 146, "proof_size_tex": 126, "effort_local": 0, "proof_size_tex_total": 278, "proof_size_lean_total": 378, "effort_total": 0}, "def:generic_formal_fiber": {"id": "def:generic_formal_fiber", "type": "definition", "title": "Generic formal fiber", "chapter": "Quasi-completeness and completion criteria", "statement": "Let \\((A,\\mathfrak m)\\) be a Noetherian local domain, let\n  \\(K=\\operatorname{Frac}(A)\\), and let \\(\\widehat A\\) be the\n  \\(\\mathfrak m\\)-adic completion.  The generic formal fiber is\n  \\[\n    \\operatorname{Spec}(\\widehat A\\otimes_A K).\n  \\]\n  Equivalently, its points are the prime ideals \\(P\\) of \\(\\widehat A\\) with\n  \\(P\\cap A=(0)\\).", "uses": [], "lean_name": "Run202608192034.TODO.genericFormalFiber", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Localization at the nonzero elements of \\(A\\) identifies\n  \\(\\widehat A\\otimes_A K\\) with that localization of \\(\\widehat A\\).\n  Prime ideals of a localization correspond exactly to primes disjoint from\n  the localized multiplicative set, which here says \\(P\\cap A=(0)\\).\n", "lean_source": "def genericFormalFiber (A T : Type u) [CommRing A] [CommRing T] (ι : A →+* T) :\n    Set (Ideal T) :=\n  {P | P.IsPrime ∧ Ideal.comap ι P = ⊥}", "proof_size_lean": 140, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 0, "rdep_count": 4, "descendant_count": 199, "proof_size_tex": 271, "effort_local": 0, "proof_size_tex_total": 271, "proof_size_lean_total": 140, "effort_total": 0}, "def:analytically_irreducible": {"id": "def:analytically_irreducible", "type": "definition", "title": "Analytic irreducibility", "chapter": "Quasi-completeness and completion criteria", "statement": "A Noetherian local domain \\(A\\) is \\emph{analytically irreducible} when its\n  adic completion \\(\\widehat A\\) is an integral domain.", "uses": [], "lean_name": "Run202608192034.TODO.AnalyticallyIrreducible", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition.\n", "lean_source": "def AnalyticallyIrreducible (A T : Type u) [CommRing A] [CommRing T] : Prop :=\n  IsDomain T", "proof_size_lean": 91, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 0, "rdep_count": 3, "descendant_count": 21, "proof_size_tex": 21, "effort_local": 0, "proof_size_tex_total": 21, "proof_size_lean_total": 91, "effort_total": 0}, "lem:quotient_sup_quotient_equiv": {"id": "lem:quotient_sup_quotient_equiv", "type": "lemma", "title": "Quotient by a quotient is quotient by a sum", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(I,J\\subseteq R\\) are ideals, then there is a natural ring equivalence\n  \\[\n    R/(I+J)\\cong (R/I)/(J(R/I)).\n  \\]", "uses": [], "lean_name": "Run202608192034.TODO.quotientSupQuotientEquiv", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use the quotient map \\(R\\to R/I\\) and the induced map from \\(R/(I+J)\\) to\n  \\((R/I)/(J(R/I))\\).  Its kernel is zero because the preimage of \\(J(R/I)\\)\n  is \\(I+J\\), using `Ideal.comap_map_of_surjective`; it is surjective because\n  \\(R\\to R/I\\) is surjective.  Apply `RingEquiv.ofBijective`.\n", "lean_source": "noncomputable def quotientSupQuotientEquiv\n    (R : Type u) [CommRing R] (I J : Ideal R) :\n    R ⧸ (I ⊔ J) ≃+* (R ⧸ I) ⧸ Ideal.map (Ideal.Quotient.mk I) J := by\n  let π : R →+* R ⧸ I := Ideal.Quotient.mk I\n  let K : Ideal (R ⧸ I) := Ideal.map π J\n  have hSupLe : I ⊔ J ≤ Ideal.comap π K := by\n    rw [sup_le_iff]\n    constructor\n    · intro x hx\n      change π x ∈ K\n      have hzero : π x = 0 := Ideal.Quotient.eq_zero_iff_mem.mpr hx\n      simp [hzero]\n    · intro x hx\n      exact Ideal.mem_map_of_mem π hx\n  have hComapLe : Ideal.comap π K ≤ I ⊔ J := by\n    calc\n      Ideal.comap π K = J ⊔ RingHom.ker π := by\n        dsimp [K, π]\n        exact Ideal.comap_map_of_surjective\n          (Ideal.Quotient.mk I) Ideal.Quotient.mk_surjective J\n      _ = J ⊔ I := by rw [Ideal.mk_ker]\n      _ = I ⊔ J := by rw [sup_comm]\n      _ ≤ I ⊔ J := le_rfl\n  let f : R ⧸ (I ⊔ J) →+* (R ⧸ I) ⧸ K :=\n    Ideal.quotientMap K π hSupLe\n  exact RingEquiv.ofBijective f\n    ⟨Ideal.quotientMap_injective' hComapLe,\n      Ideal.quotientMap_surjective Ideal.Quotient.mk_surjective⟩", "proof_size_lean": 1058, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 0, "rdep_count": 2, "descendant_count": 39, "proof_size_tex": 290, "effort_local": 0, "proof_size_tex_total": 290, "proof_size_lean_total": 1058, "effort_total": 0}, "lem:quotient_sup_quotient_equiv_mk": {"id": "lem:quotient_sup_quotient_equiv_mk", "type": "lemma", "title": "The quotient-by-sum equivalence on representatives", "chapter": "Quasi-completeness and completion criteria", "statement": "Under the equivalence \\(R/(I+J)\\cong (R/I)/(J(R/I))\\), the class of\n  \\(x\\in R\\) maps to the class of the class of \\(x\\) in \\(R/I\\).", "uses": ["lem:quotient_sup_quotient_equiv"], "lean_name": "Run202608192034.TODO.quotientSupQuotientEquiv_mk", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This follows by unfolding the induced quotient map.\n", "lean_source": "@[simp]\ntheorem quotientSupQuotientEquiv_mk\n    (R : Type u) [CommRing R] (I J : Ideal R) (x : R) :\n    quotientSupQuotientEquiv R I J (Ideal.Quotient.mk (I ⊔ J) x) =\n      Ideal.Quotient.mk (Ideal.map (Ideal.Quotient.mk I) J)\n        (Ideal.Quotient.mk I x) := by\n  rfl", "proof_size_lean": 270, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 51, "effort_local": 0, "proof_size_tex_total": 341, "proof_size_lean_total": 1328, "effort_total": 0}, "lem:quotient_weak_characterization": {"id": "lem:quotient_weak_characterization", "type": "lemma", "title": "Quotient characterization of quasi-completeness", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: D.~D. Anderson, discussion before Theorem~4 and\n  Theorem~4, references/anderson\\_2014\\_fulltext.txt, lines 160--167 and\n  170--262, DOI 10.1007/978-1-4939-0925-4\\_2.}\n  A Noetherian local ring \\(R\\) is quasi-complete if and only if every quotient\n  \\(R/J\\) is weakly quasi-complete.", "uses": ["def:quasi_complete", "def:weakly_quasi_complete"], "lean_name": "Run202608192034.TODO.quasiComplete_iff_all_quotients_weak", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Suppose first that \\(R\\) is quasi-complete.  A decreasing zero-intersection\n  chain in \\(R/J\\) pulls back to a decreasing chain \\((I_n)\\) of ideals of\n  \\(R\\) whose intersection is \\(J\\).  Quasi-completeness gives\n  \\(I_s\\subseteq J+\\mathfrak m^k\\); passing to the quotient gives the required\n  containment in the \\(k\\)-th power of the maximal ideal of \\(R/J\\).\n\n  Conversely, given a decreasing chain \\((I_n)\\) in \\(R\\), put\n  \\(J=\\bigcap_n I_n\\).  The images \\(I_n/J\\) have zero intersection in \\(R/J\\).\n  Weak quasi-completeness of this quotient gives\n  \\(I_s/J\\subseteq(\\mathfrak m/J)^k\\).  Powers commute with passage to the\n  quotient, so lifting the containment yields\n  \\(I_s\\subseteq J+\\mathfrak m^k\\), which is quasi-completeness of \\(R\\).\n", "lean_source": "theorem quasiComplete_iff_all_quotients_weak\n    (R : Type u) [CommRing R] (𝔪 : Ideal R) :\n    QuasiComplete R 𝔪 ↔\n      ∀ J : Ideal R,\n        WeaklyQuasiComplete (R ⧸ J) (Ideal.map (Ideal.Quotient.mk J) 𝔪) := by\n  constructor\n  · intro hQuasi J K hKmono hKinf k hk\n    let π : R →+* R ⧸ J := Ideal.Quotient.mk J\n    let I : ℕ → Ideal R := fun n => Ideal.comap π (K n)\n    have hImono : ∀ n : ℕ, I (n + 1) ≤ I n := by\n      intro n\n      exact Ideal.comap_mono (hKmono n)\n    have hIinf : (⨅ n, I n) = J := by\n      dsimp [I, π]\n      rw [← Ideal.comap_iInf, hKinf]\n      simpa [RingHom.ker_eq_comap_bot] using\n        (Ideal.mk_ker (I := J) : RingHom.ker (Ideal.Quotient.mk J) = J)\n    obtain ⟨s, hs⟩ := hQuasi I hImono k hk\n    refine ⟨s, ?_⟩\n    have hs' : I s ≤ J ⊔ 𝔪 ^ k := by\n      simpa [hIinf] using hs\n    have hmap : Ideal.map π (I s) ≤ Ideal.map π (J ⊔ 𝔪 ^ k) :=\n      Ideal.map_mono hs'\n    have hleft : Ideal.map π (I s) = K s := by\n      dsimp [I, π]\n      exact Ideal.map_comap_of_surjective _ Ideal.Quotient.mk_surjective (K s)\n    have hright :\n        Ideal.map π (J ⊔ 𝔪 ^ k) =\n          (Ideal.map π 𝔪) ^ k := by\n      rw [Ideal.map_sup, Ideal.map_quotient_self, bot_sup_eq, Ideal.map_pow]\n    simpa [hleft, hright, π] using hmap\n  · intro hAll I hImono k hk\n    let J : Ideal R := ⨅ n, I n\n    let π : R →+* R ⧸ J := Ideal.Quotient.mk J\n    let K : ℕ → Ideal (R ⧸ J) := fun n => Ideal.map π (I n)\n    have hJ_le : ∀ n : ℕ, J ≤ I n := by\n      intro n\n      exact iInf_le _ n\n    have hKmono : ∀ n : ℕ, K (n + 1) ≤ K n := by\n      intro n\n      exact Ideal.map_mono (hImono n)\n    have hKinf : (⨅ n, K n) = ⊥ := by\n      apply Ideal.comap_injective_of_surjective π Ideal.Quotient.mk_surjective\n      have hKer : RingHom.ker π = J := by\n        dsimp [π]\n        exact Ideal.mk_ker\n      have hComapBot : Ideal.comap π (⊥ : Ideal (R ⧸ J)) = J := by\n        rw [← RingHom.ker_eq_comap_bot, hKer]\n      have hEach :\n          ∀ n : ℕ, Ideal.comap π (Ideal.map π (I n)) = I n ⊔ J := by\n        intro n\n        rw [Ideal.comap_map_of_surjective π Ideal.Quotient.mk_surjective,\n          hComapBot]\n      calc\n        Ideal.comap π (⨅ n, K n) =\n            J := by\n              dsimp [K]\n              rw [Ideal.comap_iInf]\n              apply le_antisymm\n              · refine le_iInf fun n => ?_\n                calc\n                  (⨅ n, Ideal.comap π (Ideal.map π (I n))) ≤\n                      Ideal.comap π (Ideal.map π (I n)) := iInf_le _ n\n                  _ = I n ⊔ J := hEach n\n                  _ = I n := sup_eq_left.mpr (hJ_le n)\n              · exact le_iInf fun n => by\n                  rw [hEach n]\n                  exact le_sup_right\n        _ = Ideal.comap π (⊥ : Ideal (R ⧸ J)) := hComapBot.symm\n    obtain ⟨s, hs⟩ := hAll J K hKmono hKinf k hk\n    refine ⟨s, ?_⟩\n    have hsComap : I s ≤ Ideal.comap π ((Ideal.map π 𝔪) ^ k) :=\n      Ideal.map_le_iff_le_comap.mp hs\n    have hComap :\n        Ideal.comap π ((Ideal.map π 𝔪) ^ k) = J ⊔ 𝔪 ^ k := by\n      rw [← Ideal.map_pow]\n      calc\n        Ideal.comap π (Ideal.map π (𝔪 ^ k)) =\n            𝔪 ^ k ⊔ RingHom.ker π := by\n              exact Ideal.comap_map_of_surjective π Ideal.Quotient.mk_surjective (𝔪 ^ k)\n        _ = J ⊔ 𝔪 ^ k := by\n              rw [Ideal.mk_ker, sup_comm]\n    simpa [hComap, J, π] using hsComap", "proof_size_lean": 3308, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 12, "proof_size_tex": 749, "effort_local": 0, "proof_size_tex_total": 1027, "proof_size_lean_total": 3686, "effort_total": 0}, "lem:farley_completion_criterion": {"id": "lem:farley_completion_criterion", "type": "lemma", "title": "Completion-prime criterion", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: J.~D. Farley, Proposition~1,\n  references/farley\\_2016\\_fulltext.txt, lines 61--63,\n  DOI 10.4134/BKMS.b140895.}\n  A Noetherian local domain \\(A\\) is weakly quasi-complete if and only if every\n  nonzero prime ideal \\(P\\) of \\(\\widehat A\\) has nonzero contraction to \\(A\\).\n  Equivalently, its generic formal fiber consists only of the zero prime.", "uses": ["def:weakly_quasi_complete", "def:generic_formal_fiber"], "lean_name": "Run202608192034.TODO.weaklyQuasiComplete_iff_completion_primes", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The proof is the completion criterion underlying Farley's proposition.\n  For the forward implication, a nonzero completion prime with zero\n  contraction gives, by successive approximation modulo\n  \\(\\mathfrak m^n\\widehat A\\), a decreasing chain of contraction ideals in\n  \\(A\\) with zero intersection which never enters a fixed power of\n  \\(\\mathfrak m\\), contradicting weak quasi-completeness.  For the reverse\n  implication, failure of weak quasi-completeness supplies such a chain;\n  extend the corresponding proper ideal in the completion to a prime.\n  Krull intersection makes its contraction zero, while the failed fixed-power\n  containment makes the completion prime nonzero.  The localization\n  description in \\cref{def:generic_formal_fiber} gives the equivalent\n  formulation.\n", "lean_source": "theorem weaklyQuasiComplete_iff_completion_primes\n    (A Ahat : Type u) [CommRing A] [CommRing Ahat] (𝔪 : Ideal A)\n    (ι : A →+* Ahat)\n    (hCriterion :\n      WeaklyQuasiComplete A 𝔪 ↔\n        ∀ P : Ideal Ahat, P.IsPrime → P ≠ ⊥ → Ideal.comap ι P ≠ ⊥) :\n    WeaklyQuasiComplete A 𝔪 ↔\n      ∀ P : Ideal Ahat, P.IsPrime → P ≠ ⊥ → Ideal.comap ι quivalence", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(e:\\widehat A\\cong T\\) and\n  \\(\\iota=e\\circ(A\\to\\widehat A)\\), then the nonzero-prime contraction\n  condition in \\(\\widehat A\\) is equivalent to the corresponding condition in\n  \\(T\\).", "uses": ["def:adic_completion_prime_contraction_condition"], "lean_name": "Run202608192034.TODO.adicCompletionPrimeContractionCondition_iff_target", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Map a completion prime forward along \\(e\\), and comap a target prime\n  backward.  Ring equivalences preserve primality and the bottom ideal, while\n  \\(\\operatorname{comap}_e(\\operatorname{map}_e P)=P\\) and\n  \\(\\operatorname{map}_e(\\operatorname{comap}_e Q)=Q\\).  Map compatibility\n  then identifies the two contractions to \\(A\\).\n", "lean_source": "theorem adicCompletionPrimeContractionCondition_iff_target\n    (A T : Type u) [CommRing A] [CommRing T] (𝔪 : Ideal A)\n    (ι : A →+* T) (e : AdicCompletion 𝔪 A ≃+* T)\n    (hι : ι = e.toRingHom.comp (algebraMap A (AdicCompletion 𝔪 A))) :\n    AdicCompletionPrimeContractionCondition A 𝔪 ↔\n      ∀ Q : Ideal T, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥ := by\n  constructor\n  · intro hCompletion Q hQPrime hQNe\n    let P : Ideal (AdicCompletion 𝔪 A) := Ideal.comap e Q\n    have hPPrime : P.IsPrime := by\n      letI : Q.IsPrime := hQPrime\n      exact Ideal.comap_isPrime e Q\n    have hPNe : P ≠ ⊥ := by\n      intro hPBot\n      apply hQNe\n      calc\n        Q = Ideal.map e P :=\n          (Ideal.map_comap_of_surjective e e.surjective Q).symm\n        _ = ⊥ := by rw [hPBot, Ideal.map_bot]\n    simpa [P, hι, Ideal.comap_comap] using\n      hCompletion P hPPrime hPNe\n  · intro hTarget P hPPrime hPNe\n    let Q : Ideal T := Ideal.map e P\n    have hQPrime : Q.IsPrime := by\n      letI : P.IsPrime := hPPrime\n      exact inferInstance\n    have hQNe : Q ≠ ⊥ :=\n      (Ideal.map_eq_bot_iff_of_injective e.injective).not.mpr hPNe\n    have hContraction := hTarget Q hQPrime hQNe\n    rw [hι] at hContraction\n    change\n      Ideal.comap (e.toRingHom.comp\n        (algebraMap A (AdicCompletion 𝔪 A))) (Ideal.map e P) ≠ ⊥\n      at hContraction\n    rw [← Ideal.comap_comap] at hContraction\n    have hComapMap :\n        Ideal.comap e.toRingHom (Ideal.map e P) = P := by\n      simpa only [Ideal.map_coe] using\n        (Ideal.comap_map_of_bijective e.toRingHom e.bijective :\n          Ideal.comap e.toRingHom (Ideal.map e.toRingHom P) = P)\n    rw [hComapMap] at hContraction\n    exact hContraction", "proof_size_lean": 1673, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 125, "proof_size_tex": 329, "effort_local": 0, "proof_size_tex_total": 801, "proof_size_lean_total": 2024, "effort_total": 0}, "def:weakly_quasi_complete_bad_chain": {"id": "def:weakly_quasi_complete_bad_chain", "type": "definition", "title": "Bad weak-completeness chain", "chapter": "Quasi-completeness and completion criteria", "statement": "A bad chain is a decreasing sequence of ideals \\(I_n\\) with\n  \\(\\bigcap_n I_n=0\\), together with a fixed power \\(\\mathfrak m^k\\), \\(k>0\\),\n  such that no \\(I_s\\) is contained in \\(\\mathfrak m^k\\).", "uses": ["def:weakly_quasi_complete"], "lean_name": "Run202608192034.TODO.WeaklyQuasiCompleteBadChain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the explicit negation witness for weak quasi-completeness.  It is\n  introduced to make Farley's proof follow the source order: failure of weak\n  quasi-completeness is represented by an actual descending chain.\n", "lean_source": "def WeaklyQuasiCompleteBadChain\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) : Prop :=\n  ∃ I : ℕ → Ideal A,\n    (∀ n : ℕ, I (n + 1) ≤ I n) ∧\n      (⨅ n, I n) = ⊥ ∧\n        ∃ k : ℕ, 0 < k ∧ ∀ s : ℕ, ¬ I s ≤ 𝔪 ^ k", "proof_size_lean": 210, "has_sorry": false, "tex_ eteq I_n\\).", "uses": ["def:bad_prime_contraction_chain"], "lean_name": "Run202608192034.TODO.power_le_badPrimeContractionChain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked directly: elements of \\(\\mathfrak m^n\\) map into\n  \\(\\mathfrak m^n\\widehat A\\), hence into \\(P+\\mathfrak m^n\\widehat A\\).\n", "lean_source": "theorem power_le_badPrimeContractionChain\n    (A : Type u) [CommRing A] (𝔪 : Ideal A)\n    (P : Ideal (AdicCompletion 𝔪 A)) (n : ℕ) :\n    𝔪 ^ n ≤ badPrimeContractionChain A 𝔪 P n := by\n  intro x hx\n  rw [mem_badPrimeContractionChain]\n  have hle :\n      adicCompletionPowerImage A 𝔪 n ≤\n        P ⊔ adicCompletionPowerImage A 𝔪 n := le_sup_right\n  exact hle (Ideal.mem_map_of_mem (algebraMap A (AdicCompletion 𝔪 A)) hx)", "proof_size_lean": 417, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 137, "effort_local": 0, "proof_size_tex_total": 812, "proof_size_lean_total": 1189, "effort_total": 0}, "lem:comap_le_bad_prime_contraction_chain": {"id": "lem:comap_le_bad_prime_contraction_chain", "type": "lemma", "title": "Prime contraction lies in every chain term", "chapter": "Quasi-completeness and completion criteria", "statement": "The contraction \\(P\\cap A\\) is contained in every\n  \\(I_n=(P+\\mathfrak m^n\\widehat A)\\cap A\\).", "uses": ["def:bad_prime_contraction_chain"], "lean_name": "Run202608192034.TODO.comap_le_badPrimeContractionChain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked directly from \\(P\\subseteq P+\\mathfrak m^n\\widehat A\\) and\n  monotonicity of ideal comap.\n", "lean_source": "theorem comap_le_badPrimeContractionChain\n    (A : Type u) [CommRing A] (𝔪 : Ideal A)\n    (P : Ideal (AdicCompletion 𝔪 A)) (n : ℕ) :\n    Ideal.comap (algebraMap A (AdicCompletion 𝔪 A)) P ≤\n      badPrimeContractionChain A 𝔪 P n := by\n  exact Ideal.comap_mono le_sup_left", "proof_size_lean": 270, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 18, "proof_size_tex": 105, "effort_local": 0, "proof_size_tex_total": 780, "proof_size_lean_total": 1042, "effort_total": 0}, "lem:comap_le_bad_prime_contraction_chain_iinf": {"id": "lem:comap_le_bad_prime_contraction_chain_iinf", "type": "lemma", "title": "Prime contraction lies in the chain intersection", "chapter": "Quasi-completeness and completion criteria", "statement": "The contraction \\(P\\cap A\\) is contained in \\(\\bigcap_n I_n\\).", "uses": ["lem:comap_le_bad_prime_contraction_chain"], "lean_name": "Run202608192034.TODO.comap_le_badPrimeContractionChain_iInf", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked in Lean by applying the previous containment for every\n  \\(n\\).\n", "lean_source": "theorem comap_le_badPrimeContractionChain_iInf\n    (A : Type u) [CommRing A] (𝔪 : Ideal A)\n    (P : Ideal (AdicCompletion 𝔪 A)) :\n    Ideal.comap (algebraMap A (AdicCompletion 𝔪 A)) P ≤\n      ⨅ n, badPrimeContractionChain A 𝔪 P n := by\n  exact le_iInf fun n => comap_le_badPrimeContractionChain A 𝔪 P n", "proof_size_lean": 302, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 17, "proof_size_tex": 79, "effort_local": 0, "proof_size_tex_total": 859, "proof_size_lean_total": 1344, "effort_total": 0}, "lem:adic_completion_power_image_one_ne_top": {"id": "lem:adic_completion_power_image_one_ne_top", "type": "lemma", "title": "The first completed power is proper", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(\\mathfrak m\\) is the maximal ideal of \\(A\\), then its image\n  \\(\\mathfrak m\\widehat A\\) is a proper ideal of \\(\\widehat A\\).", "uses": ["def:adic_completion_power_image"], "lean_name": "Run202608192034.TODO.adicCompletionPowerImage_one_ne_top", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked in Lean.  If \\(1\\in\\mathfrak m\\widehat A\\), then applying\n  the finite projection\n  \\(\\widehat A\\to A/\\mathfrak m\\) sends the top ideal to zero.  Hence\n  \\(1=0\\) in \\(A/\\mathfrak m\\), so \\(1\\in\\mathfrak m\\), contradicting that\n  \\(\\mathfrak m\\) is the local maximal ideal.\n", "lean_source": "theorem adicCompletionPowerImage_one_ne_top\n    (A : Type u) [CommRing A] [IsLocalRing A] (𝔪 : Ideal A)\n    (hMax : 𝔪 = IsLocalRing.maximalIdeal A) :\n    adicCompletionPowerImage A 𝔪 1 ≠ ⊤ := by\n  intro htop\n  have hmap_eq_bot :\n      Ideal.map (AdicCompletion.evalₐ 𝔪 1).toRingHom\n        (adicCompletionPowerImage A 𝔪 1) = ⊥ := by\n    rw [adicCompletionPowerImage, Ideal.map_map]\n    rw [Ideal.map_eq_bot_iff_le_ker]\n    intro a ha\n    rw [RingHom.mem_ker]\n    change (AdicCompletion.evalₐ 𝔪 1)\n        (algebraMap A (AdicCompletion 𝔪 A) a) = 0\n    rw [AdicCompletion.algebraMap_apply, AdicCompletion.evalₐ_of]\n    exact Ideal.Quotient.eq_zero_iff_mem.mpr ha\n  have htopbot : (⊤ : Ideal (A ⧸ 𝔪 ^ 1)) = ⊥ := by\n    calc\n      (⊤ : Ideal (A ⧸ 𝔪 ^ 1)) =\n          Ideal.map (AdicCompletion.evalₐ 𝔪 1).toRingHom ⊤ := by\n            rw [Ideal.map_top]\n      _ = Ideal.map (AdicCompletion.evalₐ 𝔪 1).toRingHom\n          (adicCompletionPowerImage A 𝔪 1) := by rw [htop]\n      _ = ⊥ := hmap_eq_bot\n  have hqmem : (1 : A ⧸ 𝔪 ^ 1) ∈ (⊥ : Ideal (A ⧸ 𝔪 ^ 1)) := by\n    rw [← htopbot]\n    trivial\n  have hqzero : (1 : A ⧸ 𝔪 ^ 1) = 0 := by\n    simpa using hqmem\n  have hOnePow : (1 : A) ∈ 𝔪 ^ 1 :=\n    Ideal.Quotient.eq_zero_iff_mem.mp (by simpa using hqzero)\n  have hOneM : (1 : A) ∈ 𝔪 := by\n    simpa using hOnePow\n  have hmtop : 𝔪 = ⊤ := (Ideal.eq_top_iff_one 𝔪).mpr hOneM\n  have hmne : 𝔪 ≠ ⊤ := by\n    rw [hMax]\n    exact (IsLocalRing.maximalIdeal.isMaximal A).ne_top\n  exact hmne hmtop", "proof_size_lean": 1478, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 24, "proof_size_tex": 288, "effort_local": 0, "proof_size_tex_total": 843, "proof_size_lean_total": 2015, "effort_total": 0}, "lem:adic_completion_quotient_hausdorff_of_noetherian_local_completion": {"id": "lem:adic_completion_quotient_hausdorff_of_noetherian_local_completion", "type": "lemma", "title": "Hausdorff quotient from a Noetherian local completion", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(\\widehat A\\) is Noetherian local, then every quotient\n  \\(\\widehat A/P\\) is Hausdorff for the \\(\\mathfrak m\\widehat A\\)-adic\n  topology.", "uses": ["lem:adic_completion_power_image_one_ne_top"], "lean_name": "Run202608192034.TODO.adicCompletion_quotient_hausdorff_of_noetherian_local_completion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked in Lean from Mathlib's Krull-intersection theorem for finite\n  modules over Noetherian local rings, packaged as\n  \\texttt{IsHausdorff.of\\_isLocalRing}, together with the preceding properness\n  of \\(\\mathfrak m\\widehat A\\).\n", "lean_source": "theorem adicCompletion_quotient_hausdorff_of_noetherian_local_completion\n    (A : Type u) [CommRing A] [IsLocalRing A] (𝔪 : Ideal A)\n    (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    [IsNoetherianRing (AdicCompletion 𝔪 A)]\n    [IsLocalRing (AdicCompletion 𝔪 A)]\n    (P : Ideal (AdicCompletion 𝔪 A)) :\n    IsHausdorff (adicCompletionPowerImage A 𝔪 1)\n      (AdicCompletion 𝔪 A ⧸ P) := by\n  exact IsHausdorff.of_isLocalRing\n    (adicCompletionPowerImage A 𝔪 1)\n    (AdicCompletion 𝔪 A ⧸ P)\n    (adicCompletionPowerImage_one_ne_top A 𝔪 hMax)", "proof_size_lean": 536, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 23, "proof_size_tex": 238, "effort_local": 0, "proof_size_tex_total": 1081, "proof_size_lean_total": 2551, "effort_total": 0}, "lem:adic_completion_quotient_hausdorff_of_noetherian_jacobson_completion": {"id": "lem:adic_completion_quotient_hausdorff_of_noetherian_jacobson_completion", "type": "lemma", "title": "Hausdorff quotient from a Jacobson containment", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(\\widehat A\\) is Noetherian and\n  \\[\n    \\mathfrak m\\widehat A\\subseteq \\operatorname{Jac}(\\widehat A),\n  \\]\n  then every quotient \\(\\widehat A/P\\) is Hausdorff for the\n  \\(\\mathfrak m\\widehat A\\)-adic topology.", "uses": ["def:adic_completion_power_image"], "lean_name": "Run202608192034.TODO.adicCompletion_quotient_hausdorff_of_noetherian_jacobson_completion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked directly from Mathlib's Krull-intersection theorem in the\n  form \\texttt{IsHausdorff.of\\_le\\_jacobson}.  It isolates the remaining\n  completion-structure work into Noetherianity plus the Jacobson containment.\n", "lean_source": "theorem adicCompletion_quotient_hausdorff_of_noetherian_jacobson_completion\n    (A : Type u) [CommRing A] (𝔪 : Ideal A)\n    [IsNoetherianRing (AdicCompletion 𝔪 A)]\n    (hJac :\n      adicCompletionPowerImage A 𝔪 1 ≤\n        (⊥ : Ideal (AdicCompletion 𝔪 A)).jacobson)\n    (P : Ideal (AdicCompletion 𝔪 A)) :\n    IsHausdorff (adicCompletionPowerImage A 𝔪 1)\n      (AdicCompletion 𝔪 A ⧸ P) := by\n  exact IsHausdorff.of_le_jacobson\n    (adicCompletionPowerImage A 𝔪 1)\n    (AdicCompletion 𝔪 A ⧸ P)\n    hJac", "proof_size_lean": 500, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 26, "proof_size_tex": 224, "effort_local": 0, "proof_size_tex_total": 779, "proof_size_lean_total": 1037, "effort_total": 0}, "lem:adic_completion_power_image_one_le_jacobson_of_is_adic_complete": {"id": "lem:adic_completion_power_image_one_le_jacobson_of_is_adic_complete", "type": "lemma", "title": "Adic completeness gives the Jacobson containment", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(\\widehat A\\) is complete for the\n  \\(\\mathfrak m\\widehat A\\)-adic topology, then\n  \\(\\mathfrak m\\widehat A\\subseteq\\operatorname{Jac}(\\widehat A)\\).", "uses": ["def:adic_completion_power_image"], "lean_name": "Run202608192034.TODO.adicCompletionPowerImage_one_le_jacobson_of_isAdicComplete", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked directly from Mathlib's\n  \\texttt{IsAdicComplete.le\\_jacobson\\_bot}.  It shows that the Jacobson\n  containment remaining in \\cref{lem:adic_completion_quotient_hausdorff} can be\n  obtained from `mAhat`-adic completeness.\n", "lean_source": "theorem adicCompletionPowerImage_one_le_jacobson_of_isAdicComplete\n    (A : Type u) [CommRing A] (𝔪 : Ideal A)\n    (hComplete :\n      IsAdicComplete (adicCompletionPowerImage A 𝔪 1) (AdicCompletion 𝔪 A)) :\n    adicCompletionPowerImage A 𝔪 1 ≤\n      (⊥ : Ideal (AdicCompletion 𝔪 A)).jacobson := by\n  exact @IsAdicComplete.le_jacobson_bot\n    (AdicCompletion 𝔪 A) _ (adicCompletionPowerImage A 𝔪 1) hComplete\n\naxiom adicCompletion_quotient_hausdorff_external\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (P : Ideal (AdicCompletion 𝔪 A)) :\n    IsHausdorff (adicCompletionPowerImage A 𝔪 1)\n      (AdicCompletion 𝔪 A ⧸ P)", "proof_size_lean": 713, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 26, "proof_size_tex": 235, "effort_local": 0, "proof_size_tex_total": 790, "proof_size_lean_total": 1250, "effort_total": 0}, "lem:adic_completion_quotient_hausdorff": {"id": "lem:adic_completion_quotient_hausdorff", "type": "lemma", "title": "Hausdorff quotient of the completion", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: J.~D. Farley, Proposition~1,\n  references/farley\\_2016\\_fulltext.txt, lines 61--63,\n  DOI 10.4134/BKMS.b140895.}\n  The quotient \\(\\widehat A/P\\) is Hausdorff for the topology induced by\n  \\(\\mathfrak m\\widehat A\\).", "uses": ["lem:adic_completion_quotient_hausdorff_of_noetherian_local_completion", "lem:adic_completion_quotient_hausdorff_of_noetherian_jacobson_completion", "lem:adic_completion_power_image_one_le_jacobson_of_is_adic_complete", "lem:adic_completion_quotient_hausdorff_of_noetherian_original_precomplete", "lem:adic_completion_quotient_hausdorff_of_noetherian_completion", "lem:adic_completion_power_image_one_is_adic_complete_source", "lem:adic_completion_is_precomplete_original_source", "lem:adic_completion_power_image_one_is_adic_complete_of_original_precomplete", "lem:adic_completion_is_local_ring_of_original_precomplete", "lem:adic_completion_power_image_one_is_maximal", "lem:adic_completion_power_image_one_is_hausdorff"], "lean_name": "Run202608192034.TODO.adicCompletion_quotient_hausdorff_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This standard closed-ideal/Krull-intersection fact is the explicit auxiliary\n  boundary `adicCompletion_quotient_hausdorff_external`.  The surrounding Lean\n  lemmas prove the result once Noetherianity of the completion is available,\n  and they prove all remaining completeness, localness, maximality, and\n  Jacobson-containment steps.  Mathlib v4.29 does not provide the general\n  theorem that a Noetherian ring's adic completion is Noetherian.  This\n  auxiliary boundary is not in the final theorem's dependency closure.\n", "lean_source": "theorem adicCompletion_quotient_hausdorff_source\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (_hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (P : Ideal (AdicCompletion 𝔪 A)) :\n    IsHausdorff (adicCompletionPowerImage A 𝔪 1)\n      (AdicCompletion 𝔪 A ⧸ P) := by\n  exact adicCompletion_quotient_hausdorff_external A 𝔪 _hMax P", "proof_size_lean": 375, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 11, "rdep_count": 2, "descendant_count": 22, "proof_size_tex": 521, "effort_local": 0, "proof_size_tex_total": 6345, "proof_size_lean_total": 20765, "effort_total": 0}, "lem:adic_completion_neighborhood_iinf_le_prime_of_hausdorff": {"id": "lem:adic_completion_neighborhood_iinf_le_prime_of_hausdorff", "type": "lemma", "title": "Neighborhood intersection from Hausdorff quotient", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(\\widehat A/P\\) is Hausdorff for the \\(\\mathfrak m\\widehat A\\)-adic\n  topology, then\n  \\[\n    \\bigcap_n(P+\\mathfrak m^n\\widehat A)\\subseteq P.\n  \\]", "uses": ["def:adic_completion_power_image", "lem:adic_completion_quotient_hausdorff"], "lean_name": "Run202608192034.TODO.adicCompletion_neighborhood_iInf_le_prime_of_hausdorff", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked in Lean.  An element in every \\(P+\\mathfrak m^n\\widehat A\\)\n  maps in \\(\\widehat A/P\\) into every power of \\(\\mathfrak m\\widehat A\\).  The\n  Hausdorff condition forces its image in the quotient to be zero, hence the\n  original element lies in \\(P\\).\n", "lean_source": "theorem adicCompletion_neighborhood_iInf_le_prime_of_hausdorff\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A)\n    (P : Ideal (AdicCompletion 𝔪 A))\n    [IsHausdorff (adicCompletionPowerImage A 𝔪 1)\n      (AdicCompletion 𝔪 A ⧸ P)] :\n    (⨅ n, P ⊔ adicCompletionPowerImage A 𝔪 n) ≤ P := by\n  intro x hx\n  have hxzero : (Ideal.Quotient.mk P) x = 0 := by\n    refine IsHausdorff.haus\n      (inferInstance : IsHausdorff (adicCompletionPowerImage A 𝔪 1)\n        (AdicCompletion 𝔪 A ⧸ P))\n      ((Ideal.Quotient.mk P) x) ?_\n    intro n\n    rw [SModEq.zero]\n    have hx_n : x ∈ P ⊔ adicCompletionPowerImage A 𝔪 n :=\n      (Ideal.mem_iInf.mp hx) n\n    have hpow :\n        adicCompletionPowerImage A 𝔪 1 ^ n =\n          adicCompletionPowerImage A 𝔪 n := by\n      simp [adicCompletionPowerImage, Ideal.map_pow]\n    rw [hpow]\n    rcases Submodule.mem_sup.mp hx_n with ⟨p, hp, z, hz, hpzx⟩\n    have hqz :\n        (Ideal.Quotient.mk P) z ∈\n          (adicCompletionPowerImage A 𝔪 n) •\n            (⊤ : Submodule (AdicCompletion 𝔪 A)\n              (AdicCompletion 𝔪 A ⧸ P)) := by\n      simpa [Algebra.smul_def] using\n        (Submodule.smul_mem_smul hz\n          (Submodule.mem_top :\n            (1 : AdicCompletion 𝔪 A ⧸ P) ∈\n              (⊤ : Submodule (AdicCompletion 𝔪 A)\n                (AdicCompletion 𝔪 A ⧸ P))))\n    have hqx :\n        (Ideal.Quotient.mk P) x = (Ideal.Quotient.mk P) z := by\n      calc\n        (Ideal.Quotient.mk P) x =\n            (Ideal.Quotient.mk P) (p + z) := by rw [hpzx]\n        _ = (Ideal.Quotient.mk P) p + (Ideal.Quotient.mk P) z := rfl\n        _ = 0 + (Ideal.Quotient.mk P) z := by\n            rw [Ideal.Quotient.eq_zero_iff_mem.mpr hp]\n        _ = (Ideal.Quotient.mk P) z := zero_add _\n    rwa [hqx]\n  exact Ideal.Quotient.eq_zero_iff_mem.mp hxzero", "proof_size_lean": 1819, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 21, "proof_size_tex": 265, "effort_local": 0, "proof_size_tex_total": 6610, "proof_size_lean_total": 22584, "effort_total": 0}, "lem:adic_completion_neighborhood_iinf_le_prime": {"id": "lem:adic_completion_neighborhood_iinf_le_prime", "type": "lemma", "title": "Completion-neighborhood Krull-intersection containment", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: J.~D. Farley, Propositio false, "mathlib_ok": false, "proof_tex": "\n  This is now checked in Lean.  If \\(x\\) lies in all contracted ideals, then\n  its image in \\(\\widehat A\\) lies in every \\(P+\\mathfrak m^n\\widehat A\\);\n  the completion-neighborhood Krull-intersection input puts that image in\n  \\(P\\), hence \\(x\\in P\\cap A\\).\n", "lean_source": "theorem badPrimeContractionChain_iInf_le_comap\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (P : Ideal (AdicCompletion 𝔪 A)) :\n    (⨅ n, badPrimeContractionChain A 𝔪 P n) ≤\n      Ideal.comap (algebraMap A (AdicCompletion 𝔪 A)) P := by\n  intro x hx\n  have hxhat :\n      algebraMap A (AdicCompletion 𝔪 A) x ∈\n        ⨅ n, P ⊔ adicCompletionPowerImage A 𝔪 n := by\n    rw [Ideal.mem_iInf]\n    intro n\n    exact (mem_badPrimeContractionChain A 𝔪 P n x).mp\n      ((Ideal.mem_iInf.mp hx) n)\n  exact adicCompletion_neighborhood_iInf_le_prime_source A 𝔪 hMax P hxhat", "proof_size_lean": 654, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 5, "proof_size_tex": 256, "effort_local": 0, "proof_size_tex_total": 7084, "proof_size_lean_total": 23985, "effort_total": 0}, "lem:bad_prime_contraction_chain_iinf_eq_comap": {"id": "lem:bad_prime_contraction_chain_iinf_eq_comap", "type": "lemma", "title": "Intersection of the bad-prime contraction chain", "chapter": "Quasi-completeness and completion criteria", "statement": "The intersection of \\(I_n=(P+\\mathfrak m^n\\widehat A)\\cap A\\) is exactly\n  \\(P\\cap A\\).", "uses": ["lem:bad_prime_contraction_chain_iinf_le_comap", "lem:comap_le_bad_prime_contraction_chain_iinf"], "lean_name": "Run202608192034.TODO.badPrimeContractionChain_iInf_eq_comap", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is now a checked Lean wrapper: one inclusion is formal lattice\n  reasoning, and the other is the remaining Krull-intersection source input.\n", "lean_source": "theorem badPrimeContractionChain_iInf_eq_comap\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (P : Ideal (AdicCompletion 𝔪 A)) :\n    (⨅ n, badPrimeContractionChain A 𝔪 P n) =\n      Ideal.comap (algebraMap A (AdicCompletion 𝔪 A)) P := by\n  exact le_antisymm\n    (badPrimeContractionChain_iInf_le_comap A 𝔪 hMax P)\n    (comap_le_badPrimeContractionChain_iInf A 𝔪 P)", "proof_size_lean": 458, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 4, "proof_size_tex": 144, "effort_local": 0, "proof_size_tex_total": 7412, "proof_size_lean_total": 25015, "effort_total": 0}, "lem:bad_prime_contraction_chain_iinf_eq_bot": {"id": "lem:bad_prime_contraction_chain_iinf_eq_bot", "type": "lemma", "title": "Zero intersection for a bad-prime contraction chain", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(P\\cap A=0\\), then the associated contraction chain has zero\n  intersection.", "uses": ["lem:bad_prime_contraction_chain_iinf_eq_comap", "def:adic_completion_bad_prime"], "lean_name": "Run202608192034.TODO.badPrimeContractionChain_iInf_eq_bot", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked in Lean from\n  \\cref{lem:bad_prime_contraction_chain_iinf_eq_comap} and the zero\n  contraction hypothesis.\n", "lean_source": "theorem badPrimeContractionChain_iInf_eq_bot\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (P : Ideal (AdicCompletion 𝔪 A))\n    (hPzero : Ideal.comap (algebraMap A (AdicCompletion 𝔪 A)) P = ⊥) :\n    (⨅ n, badPrimeContractionChain A 𝔪 P n) = ⊥ := by\n  rw [badPrimeContractionChain_iInf_eq_comap A 𝔪 hMax P, hPzero]", " mId :\n        y ∈ ((𝔪 ^ n).map (algebraMap A (AdicCompletion 𝔪 A))).restrictScalars A := by\n      by_cases hn : n = 0\n      · subst n\n        rw [pow_zero]\n        have hmap :\n            Ideal.map (algebraMap A (AdicCompletion 𝔪 A)) (1 : Ideal A) =\n              ⊤ := by\n          rw [Ideal.one_eq_top, Ideal.map_top]\n        rw [hmap]\n        trivial\n      · have hpos : 0 < n := Nat.pos_of_ne_zero hn\n        simpa [adicCompletionPowerImage] using h n hpos\n    exact hEq.symm ▸ hmemId\n  exact hy hyzero", "proof_size_lean": 1244, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 14, "proof_size_tex": 316, "effort_local": 0, "proof_size_tex_total": 871, "proof_size_lean_total": 1781, "effort_total": 0}, "def:quotient_power_linear_map": {"id": "def:quotient_power_linear_map", "type": "definition", "title": "Finite quotient linear map", "chapter": "Quasi-completeness and completion criteria", "statement": "For each \\(t\\), let\n  \\[\n    A\\to A/\\mathfrak m^t\n  \\]\n  be the quotient map, regarded as an \\(A\\)-linear map.", "uses": [], "lean_name": "Run202608192034.TODO.quotientPowerLinearMap", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the linear map underlying the usual quotient algebra map\n  \\(A\\to A/\\mathfrak m^t\\).\n", "lean_source": "def quotientPowerLinearMap\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) (t : ℕ) :\n    A →ₗ[A] A ⧸ 𝔪 ^ t :=\n  (Ideal.Quotient.mkₐ A (𝔪 ^ t)).toLinearMap", "proof_size_lean": 150, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 0, "rdep_count": 3, "descendant_count": 41, "proof_size_tex": 92, "effort_local": 0, "proof_size_tex_total": 92, "proof_size_lean_total": 150, "effort_total": 0}, "lem:quotient_power_linear_map_surjective": {"id": "lem:quotient_power_linear_map_surjective", "type": "lemma", "tit Ring A] [IsNoetherianRing A] (𝔪 : Ideal A)\n    (t : ℕ) :\n    Function.Exact\n      (AdicCompletion.map 𝔪 ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A))\n      (AdicCompletion.map 𝔪 (quotientPowerLinearMap A 𝔪 t)) := by\n  exact\n    AdicCompletion.map_exact\n      (I := 𝔪)\n      (f := ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A))\n      (g := quotientPowerLinearMap A 𝔪 t)\n      (Submodule.injective_subtype (𝔪 ^ t))\n      (by\n        simpa [quotientPowerLinearMap, Ideal.Quotient.mkₐ_eq_mk] using\n          (LinearMap.exact_subtype_mkQ (𝔪 ^ t)))\n      (quotientPowerLinearMap_surjective A 𝔪 t)", "proof_size_lean": 657, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 38, "proof_size_tex": 189, "effort_local": 0, "proof_size_tex_total": 381, "proof_size_lean_total": 1044, "effort_total": 0}, "lem:adic_completion_power_tensor_image_le_power_image": {"id": "lem:adic_completion_power_tensor_image_le_power_image", "type": "lemma", "title": "Tensor image of the completed power lies in the extended power", "chapter": "Quasi-completeness and completion criteria", "statement": "The tensor presentation map\n  \\[\n    \\widehat A\\otimes_A\\mathfrak m^t\\to\\widehat A\n  \\]\n  has image contained in \\(\\mathfrak m^t\\widehat A\\).", "uses": ["def:adic_completion_power_image"], "lean_name": "Run202608192034.TODO.adicCompletion_powerTensorImage_le_powerImage", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked by tensor induction.  On pure tensors, the image is\n  \\(r\\cdot a\\) with \\(a\\in\\mathfrak m^t\\), hence lies in the extended ideal;\n  the zero and additive cases follow from ideal laws.\n", "lean_source": "theorem adicCompletion_powerTensorImage_le_powerImage\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) (t : ℕ)\n    (z : TensorProduct A (AdicCompletion 𝔪 A) (𝔪 ^ t : Ideal A)) :\n    AdicCompletion.ofTensorProduct 𝔪 A\n        (TensorProduct.AlgebraTensorModule.map\n          (LinearMap.id :\n            AdicCompletion 𝔪 A →ₗ[AdicCompletion 𝔪 A]\n              AdicCompletion 𝔪 A)\n          ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A) z) ∈\n      adicCompletionPowerImage A 𝔪 t := by\n  induction z using TensorProduct.induction_on with\n  | zero =>\n      exact Ideal.zero_mem _\n  | tmul r x =>\n      simp only [TensorProduct.AlgebraTensorModule.map_tmul,\n        LinearMap.id_coe, id_eq, AdicCompletion.ofTensorProduct_tmul]\n      change r * algebraMap A (AdicCompletion 𝔪 A) (x : A) ∈\n        adicCompletionPowerImage A 𝔪 t\n      exact Ideal.mul_mem_left _\n        r (Ideal.mem_map_of_mem (algebraMap A (AdicCompletion 𝔪 A)) x.property)\n  | add x y hx hy =>\n      have hinner :\n          (TensorProduct.AlgebraTensorModule.map\n            (LinearMap.id :\n              AdicCompletion 𝔪 A →ₗ[AdicCompletion 𝔪 A]\n                AdicCompletion 𝔪 A)\n            ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A)) (x + y) =\n          (TensorProduct.AlgebraTensorModule.map\n            (LinearMap.id :\n              AdicCompletion 𝔪 A →ₗ[AdicCompletion 𝔪 A]\n                AdicCompletion 𝔪 A)\n            ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A)) x +\n          (TensorProduct.AlgebraTensorModule.map\n            (LinearMap.id :\n              AdicCompletion 𝔪 A →ₗ[AdicCompletion 𝔪 A]\n                AdicCompletion 𝔪 A)\n            ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A)) y := by\n        exact map_add _ x y\n      rw [hinner]\n      rw [LinearMap.map_add]\n      exact Ideal.add_mem _ hx hy", "proof_size_lean": 1785, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 39, "proof_size_tex": 198, "effort_local": 0, "proof_size_tex_total": 753, "proof_size_lean_total": 2322, "effort_total": 0}, "lem:adic_completion_power_submodule_range_le_power_image": {"id": "lem:adic_completion_power_submodule_range_le_power_image", "type": "lemma", "title": "Completed power image lies in the extended power", "chapter": "Quasi-completeness and completion criteria", "statement": "The range of the completed inclusion\n  \\(\\widehat{\\mathfrak m^t}\\to\\widehat A\\) is contained in\n  \\(\\mathfrak m^t\\widehat A\\).", "uses": ["lem:adic_completion_power_tensor_image_le_power_image"], "lean_name": "Run202608192034.TODO.adicCompletion_powerSubmoduleRange_le_powerImage", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked using the surjective tensor presentation\n  `AdicCompletion.ofTensorProduct\\_surjective\\_of\\_finite` for the finite\n  \\(A\\)-module \\(\\mathfrak m^t\\), together with naturality of\n  `AdicCompletion.ofTensorProduct`.\n", "lean_source": "theorem adicCompletion_powerSubmoduleRange_le_powerImage\n    (A : Type u) [CommRing A] [IsNoetherianRing A] (𝔪 : Ideal A)\n    (t : ℕ) :\n    LinearMap.range\n        (AdicCompletion.map 𝔪 ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A)) ≤\n      adicCompletionPowerImage A 𝔪 t := by\n  intro y hy\n  obtain ⟨z, rfl⟩ := (LinearMap.mem_range).mp hy\n  letI : Module.Finite A (𝔪 ^ t : Ideal A) := inferInstance\n  obtain ⟨w, hw⟩ :=\n    AdicCompletion.ofTensorProduct_surjective_of_finite 𝔪 (𝔪 ^ t : Ideal A) z\n  rw [← hw]\n  have hnat :=\n    congrFun\n      (congrArg DFunLike.coe\n        (AdicCompletion.ofTensorProduct_naturality 𝔪\n          ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A))) w\n  change\n      ((AdicCompletion.map 𝔪 ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A)) ∘ₗ\n        AdicCompletion.ofTensorProduct 𝔪 (𝔪 ^ t : Ideal A)) w ∈\n      adicCompletionPowerImage A 𝔪 t\n  rw [hnat]\n  exact adicCompletion_powerTensorImage_le_powerImage A 𝔪 t w", "proof_size_lean": 942, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 38, "proof_size_tex": 228, "effort_local": 0, "proof_size_tex_total": 981, "proof_size_lean_total": 3264, "effort_total": 0}, "lem:adic_completion_map_quotient_power_eq_zero_of_eval_zero": {"id": "lem:adic_completion_map_quotient_power_eq_zero_of_eval_zero", "type": "lemma", "title": "Finite projection zero implies completed quotient map zero", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(x\\in\\widehat A\\) maps to zero in \\(A/\\mathfrak m^t\\), then its image in\n  the completion of \\(A/\\mathfrak m^t\\) is zero.", "uses": ["def:quotient_power_linear_map"], "lean_name": "Run202608192034.TODO.adicCompletion_map_quotientPower_eq_zero_of_evalₐ_eq_zero", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked coordinatewise in the inverse-limit definition of\n  `AdicCompletion`.  For levels \\(n\\le t\\), compatibility with transition maps\n  propagates the zero \\(t\\)-th coordinate downward.  For \\(t\\le n\\), a\n  representative whose \\(t\\)-th image is zero already lies in\n  \\(\\mathfrak m^t\\), hence maps to zero in \\(A/\\mathfrak m^t\\).\n", "lean_source": "theorem adicCompletion_map_quotientPower_eq_zero_of_evalₐ_eq_zero\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) (t : ℕ)\n    {x : AdicCompletion 𝔪 A}\n    (hx : (AdicCompletion.evalₐ 𝔪 t).toRingHom x = 0) :\n    AdicCompletion.map 𝔪 (quotientPowerLinearMap A 𝔪 t) x = 0 := by\n  apply AdicCompletion.ext\n  intro n\n  rw [AdicCompletion.map_val_apply]\n  have hxEval :\n      AdicCompletion.eval 𝔪 A t x = 0 := by\n    have h :=\n      AdicCompletion.factor_evalₐ_eq_eval\n        (I := 𝔪) (x := x) (n := t)\n        (show 𝔪 ^ t ≤ 𝔪 ^ t • (⊤ : Ideal A) by\n          exact le_of_eq (by ext y; simp))\n    rw [← h]\n    change\n      Ideal.Quotient.factor\n          (show 𝔪 ^ t ≤ 𝔪 ^ t • (⊤ : Ideal A) by\n            exact le_of_eq (by ext y; simp))\n          ((AdicCompletion.evalₐ 𝔪 t).toRingHom x) = 0\n    rw [hx]\n    rfl\n  by_cases hnt : n ≤ t\n  · have hxn : x.val n = 0 := by\n      rw [← AdicCompletion.transitionMap_comp_eval_apply 𝔪 A hnt x]\n      change\n        AdicCompletion.transitionMap 𝔪 A hnt\n          ((AdicCompletion.eval 𝔪 A t) x) = 0\n      rw [hxEval]\n      rfl\n    rw [hxn]\n    simp\n  · have htn : t ≤ n := le_of_not_ge hnt\n    have hxt : x.val t = 0 := by\n      simpa [AdicCompletion.eval_apply] using hxEval\n    have hfactor :\n        AdicCompletion.transitionMap 𝔪 A htn (x.val n) = 0 := by\n      rw [AdicCompletion.transitionMap_comp_eval_apply 𝔪 A htn x, hxt]\n    revert hfactor\n    induction x.val n using Quotient.inductionOn' with\n    | h a =>\n        intro hfactor\n        change\n          Submodule.Quotient.mk\n              (p := (𝔪 ^ n • ⊤ : Submodule A (A ⧸ 𝔪 ^ t)))\n              (quotientPowerLinearMap A 𝔪 t a) = 0\n        rw [Submodule.Quotient.mk_eq_zero]\n        have ha_zero :\n            Submodule.Quotient.mk (p := (𝔪 ^ t • ⊤ : Submodule A A)) a = 0 := by\n          simpa using hfactor\n        have ha_mem : a ∈ 𝔪 ^ t := by\n          have ha_mem_sub :\n              a ∈ (𝔪 ^ t • ⊤ : Submodule A A) :=\n            (Submodule.Quotient.mk_eq_zero _).mp ha_zero\n          simpa using ha_mem_sub\n        change quotientPowerLinearMap A 𝔪 t a ∈\n          𝔪 ^ n • (⊤ : Submodule A (A ⧸ 𝔪 ^ t))\n        have hq : quotientPowerLinearMap A 𝔪 t a = 0 := by\n          change Ideal.Quotient.mk (𝔪 ^ t) a = 0\n          exact Ideal.Quotient.eq_zero_iff_mem.mpr ha_mem\n        rw [hq]\n        exact Submodule.zero_mem _", "proof_size_lean": 2326, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 38, "proof_size_tex": 341, "effort_local": 0, "proof_size_tex_total": 433, "proof_size_lean_total": 2476, "effort_total": 0}, "lem:adic_completion_eval_kernel_le_power_image": {"id": "lem:adic_completion_eval_kernel_le_power_image", "type": "lemma", "title": "Kernel of a finite adic projection", "chapter": "Quasi-completeness and completion criteria", "statement": "For every finite level \\(t\\), the kernel of the canonical projection\n  \\[\n    \\widehat A\\to A/\\mathfrak m^t\n  \\]\n  is contained in the extended power image\n  \\(\\mathfrak m^t\\widehat A\\).", "uses": ["lem:adic_completion_power_quotient_exact", "lem:adic_completion_power_submodule_range_le_power_image", "lem:adic_completion_map_quotient_power_eq_zero_of_eval_zero"], "lean_name": "Run202608192034.TODO.adicCompletion_evalₐ_kernel_le_powerImage_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is now checked in Lean.  If \\(x\\) maps to zero at finite level \\(t\\),\n  the preceding coordinate lemma shows that \\(x\\) maps to zero in\n  \\(\\widehat{A/\\mathfrak m^t}\\).  Exactness of the completed quotient sequence\n  puts \\(x\\) in the range of\n  \\(\\widehat{\\mathfrak m^t}\\to\\widehat A\\), and the tensor-presentation lemma\n  identifies that range with a subideal of \\(\\mathfrak m^t\\widehat A\\).\n", "lean_source": "theorem adicCompletion_evalₐ_kernel_le_powerImage_source\n    (A : Type u) [CommRing A] [IsNoetherianRing A] (𝔪 : Ideal A)\n    (t : ℕ) :\n    RingHom.ker (AdicCompletion.evalₐ 𝔪 t).toRingHom ≤\n      adicCompletionPowerImage A 𝔪 t := by\n  intro x hx\n  have hExact := adicCompletion_power_quotient_exact A 𝔪 t\n  have hxmap :\n      AdicCompletion.map 𝔪 (quotientPowerLinearMap A 𝔪 t) x = 0 :=\n    adicCompletion_map_quotientPower_eq_zero_of_evalₐ_eq_zero A 𝔪 t\n      (RingHom.mem_ker.mp hx)\n  have hxrange :\n      x ∈ LinearMap.range\n        (AdicCompletion.map 𝔪 ((𝔪 ^ t).subtype : (𝔪 ^ t : Ideal A) →ₗ[A] A)) := by\n    simpa [LinearMap.mem_range] using (hExact x).mp hxmap\n  exact adicCompletion_powerSubmoduleRange_le_powerImage A 𝔪 t hxrange", "proof_size_lean": 740, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 3, "rdep_count": 3, "descendant_count": 37, "proof_size_tex": 398, "effo ": "theorem adicCompletionPowerImage_one_pow\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) (t : ℕ) :\n    adicCompletionPowerImage A 𝔪 1 ^ t =\n      adicCompletionPowerImage A 𝔪 t := by\n  simp [adicCompletionPowerImage, Ideal.map_pow]", "proof_size_lean": 227, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 34, "proof_size_tex": 96, "effort_local": 0, "proof_size_tex_total": 651, "proof_size_lean_total": 764, "effort_total": 0}, "lem:ideal_smul_top_eq_self": {"id": "lem:ideal_smul_top_eq_self", "type": "lemma", "title": "Ideal action on the top submodule", "chapter": "Quasi-completeness and completion criteria", "statement": "For any commutative ring \\(B\\) and ideal \\(J\\), the submodule\n  \\(J\\cdot B\\) is just \\(J\\) itself.", "uses": [], "lean_name": "Run202608192034.TODO.ideal_smul_top_eq_self", "proved": false, "mathlib_ok": false, "proof_tex": "\n  One containment is ideal absorption under multiplication; the other writes\n  \\(x\\in J\\) as \\(x\\cdot 1\\).\n", "lean_source": "theorem ideal_smul_top_eq_self\n    (B : Type u) [CommRing B] (J : Ideal B) :\n    J • (⊤ : Submodule B B) = (J : Submodule B B) := by\n  apply le_antisymm\n  · refine Submodule.smul_le.mpr ?_\n    intro r hr x _hx\n    change r * x ∈ J\n    exact Ideal.mul_mem_right x J hr\n  · intro x hx\n    simpa using\n      (Submodule.smul_mem_smul hx\n        (Submodule.mem_top : (1 : B) ∈ (⊤ : Submodule B B)))", "proof_size_lean": 393, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 33, "proof_size_tex": 104, "effort_local": 0, "proof_size_tex_total": 104, "proof_size_lean_total": 393, "effort_total": 0}, "lem:adic_completion_power_image_one_pow_smul_top_restrict_scalars": {"id": "lem:adic_completion_power_image_one_pow_smul_top_restrict_scalars", "type": "  A) (𝔪 ^ t)\n  rw [hJ, hA]\n  rfl", "proof_size_lean": 1221, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 32, "proof_size_tex": 192, "effort_local": 0, "proof_size_tex_total": 947, "proof_size_lean_total": 2378, "effort_total": 0}, "def:adic_completion_quotient_power_image_equiv": {"id": "def:adic_completion_quotient_power_image_equiv", "type": "definition", "title": "Finite-level quotient comparison", "chapter": "Quasi-completeness and completion criteria", "statement": "The kernel equality gives a checked ring equivalence\n  \\[\n    \\widehat A/\\mathfrak m^t\\widehat A \\simeq A/\\mathfrak m^t.\n  \\]", "uses": ["lem:adic_completion_power_image_eq_eval_kernel"], "lean_name": "Run202608192034.TODO.adicCompletionQuotientPowerImageEquiv", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This equivalence is checked in Lean using quotient-by-equal-ideal\n  equivalences and the first isomorphism theorem for the surjective finite\n  projection \\(\\widehat A\\to A/\\mathfrak m^t\\).\n", "lean_source": "noncomputable def adicCompletionQuotientPowerImageEquiv\n    (A : Type u) [CommRing A] [IsNoetherianRing A] (𝔪 : Ideal A)\n    (t : ℕ) :\n    AdicCompletion 𝔪 A ⧸ adicCompletionPowerImage A 𝔪 t ≃+*\n      A ⧸ 𝔪 ^ t :=\n  (Ideal.quotEquivOfEq (adicCompletionPowerImage_eq_evalₐ_kernel A 𝔪 t)).trans\n    (RingHom.quotientKerEquivOfSurjective\n      (f := (AdicCompletion.evalₐ 𝔪 t).toRingHom)\n      (AdicCompletion.surjective_evalₐ 𝔪 t))", "proof_size_lean": 429, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 1, "proof_size_tex": 188, "effort_local": 0, "proof_size_tex_total": 2541, "proof_size_lean_total": 8530, "effort_total": 0}, "def:adic_completion_quotient_power_equiv": {"id": "def:adic_completion_quotient_power_equiv", "type" s is checked in Lean.  The previous lemma identifies\n  \\(\\mathfrak m\\widehat A\\) with the kernel of the surjective map\n  \\(\\widehat A\\to A/\\mathfrak m\\), and the target is a field because\n  \\(\\mathfrak m\\) is maximal.\n", "lean_source": "theorem adicCompletionPowerImage_one_isMaximal\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A) :\n    (adicCompletionPowerImage A 𝔪 1).IsMaximal := by\n  have hmMax : 𝔪.IsMaximal := by\n    rw [hMax]\n    exact IsLocalRing.maximalIdeal.isMaximal A\n  have hpowMax : (𝔪 ^ 1).IsMaximal := by\n    simpa using hmMax\n  letI : DivisionRing (A ⧸ 𝔪 ^ 1) := Ideal.Quotient.divisionRing (𝔪 ^ 1)\n  rw [adicCompletionPowerImage_one_eq_evalₐ_kernel A 𝔪]\n  exact RingHom.ker_isMaximal_of_surjective\n    (AdicCompletion.evalₐ 𝔪 1).toRingHom\n    (AdicCompletion.surjective_evalₐ 𝔪 1)", "proof_size_lean": 639, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 25, "proof_size_tex": 220, "effort_local": 0, "proof_size_tex_total": 2644, "proof_size_lean_total": 9018, "effort_total": 0}, "lem:adic_completion_power_image_one_is_hausdorff": {"id": "lem:adic_completion_power_image_one_is_hausdorff", "type": "lemma", "title": "The completed ring is Hausdorff for the completed maximal ideal", "chapter": "Quasi-completeness and completion criteria", "statement": "The completion \\(\\widehat A\\) is Hausdorff for the\n  \\(\\mathfrak m\\widehat A\\)-adic topology.", "uses": ["def:adic_completion_power_image"], "lean_name": "Run202608192034.TODO.adicCompletionPowerImage_one_isHausdorff", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is checked in Lean by transporting Mathlib's Hausdorff instance for\n  \\(\\operatorname{AdicCompletion}_{\\mathfrak m}(A)\\) along\n  \\(\\mathfrak m\\widehat A=\\operatorname{map}(A\\to\\widehat A)(\\mathfrak m)\\).\n", "lean_source": "theorem adicCompletionPowerImage_one_isHausdorff\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) :\n    IsHausdorff (adicCompletionPowerImage A 𝔪 1)\n      (AdicCompletion 𝔪 A) := by\n  have hMap :\n      IsHausdorff (Ideal.map (algebraMap A (AdicCompletion 𝔪 A)) 𝔪)\n        (AdicCompletion 𝔪 A) :=\n    (IsHausdorff.map_algebraMap_iff\n      (I := 𝔪) (S := AdicCompletion 𝔪 A)).mpr inferInstance\n  simpa [adicCompletionPowerImage] using hMap", "proof_size_lean": 432, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 30, "proof_size_tex": 208, "effort_local": 0, "proof_size_tex_total": 763, "proof_size_lean_total": 969, "effort_total": 0}, "lem:adic_completion_eval_eq_of_smod_eq": {"id": "lem:adic_completion_eval_eq_of_smod_eq", "type": "lemma", "title": "Finite-level evaluation kills the matching adic neighborhood", "chapter": "Quasi-completeness and completion criteria", "statement": "The finite projection\n  \\(\\widehat A\\to A/\\mathfrak m^n\\) is constant on cosets modulo\n  \\(\\mathfrak m^n\\widehat A\\), viewed as an \\(A\\)-submodule of\n  \\(\\widehat A\\).", "uses": [], "lean_name": "Run202608192034.TODO.adicCompletion_eval_eq_of_smodEq", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The proof is by induction on membership in\n  \\(\\mathfrak m^n\\cdot\\widehat A\\).  A scalar from \\(\\mathfrak m^n\\) kills\n  every element after projection to \\(A/\\mathfrak m^n\\), and the kernel is\n  closed under addition.\n", "lean_source": "theorem adicCompletion_eval_eq_of_smodEq\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) (n : ℕ)\n    {x y : AdicCompletion 𝔪 A}\n    (hxy :\n      x ≡ y\n        [SMOD (𝔪 ^ n •\n          (⊤ : Submodule A (AdicCompletion 𝔪 A)))]) :\n    AdicCompletion.eval 𝔪 A n x = AdicCompletion.eval 𝔪 A n y := by\n  rw [← sub_eq_zero]\n  change AdicCompletion.eval 𝔪 A n (x - y) = 0\n  change x - y ∈ LinearMap.ker (AdicCompletion.eval 𝔪 A n)\n  have hsub :\n      x - y ∈\n        𝔪 ^ n • (⊤ : Submodule A (AdicCompletion 𝔪 A)) :=\n    SModEq.sub_mem.mp hxy\n  refine Submodule.smul_induction_on hsub ?_ ?_\n  · intro r hr z _hz\n    change AdicCompletion.eval 𝔪 A n (r • z) = 0\n    rw [map_smul]\n    induction (AdicCompletion.eval 𝔪 A n z) using Quotient.inductionOn' with\n    | _ a =>\n      simpa using (Submodule.Quotient.mk_eq_zero _).mpr\n        (Submodule.smul_mem_smul hr\n          (Submodule.mem_top : a ∈ (⊤ : Submodule A A)))\n  · intro z w hz hw\n    exact Submodule.add_mem _ hz hw", "proof_size_lean": 961, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 29, "proof_size_tex": 217, "effort_local": 0, "proof_size_tex_total": 217, "proof_size_lean_total": 961, "effort_total": 0}, "lem:adic_completion_is_precomplete_original_source": {"id": "lem:adic_completion_is_precomplete_original_source", "type": "lemma", "title": "The adic completion is precomplete for the original ideal", "chapter": "Quasi-completeness and completion criteria", "statement": "If \\(A\\) is Noetherian, then \\(\\widehat A\\), as an \\(A\\)-module, is\n  precomplete for the original \\(\\mathfrak m\\)-adic topology.", "uses": ["lem:adic_completion_eval_eq_of_smod_eq", "lem:adic_completion_eval_kernel_le_power_image"], "lean_name": "Run202608192034.TODO.adicCompletion_isPrecomplete_original_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Given a Cauchy sequence \\(f_n\\) in \\(\\widehat A\\), define the candidate\n  limit \\(L\\) by taking its \\(n\\)-th finite coordinate to be the image of\n  \\(f_n\\) in \\(A/\\mathfrak m^n\\).  The previous lemma proves these coordinates\n  are compatible.  The difference \\(f_n-L\\) has zero \\(n\\)-th coordinate, and\n  the checked finite-level kernel containment places it in\n  \\(\\mathfrak m^n\\widehat A\\).\n", "l ap A (AdicCompletion 𝔪 A) a ∈\n        adicCompletionPowerImage A 𝔪 t) :\n    ∀ s : ℕ, ¬ badPrimeContractionChain A 𝔪 P s ≤ 𝔪 ^ k := by\n  intro s hle\n  let t : ℕ := max s k\n  rcases hApprox t with ⟨a, haApprox⟩\n  have hts : s ≤ t := Nat.le_max_left s k\n  have htk : k ≤ t := Nat.le_max_right s k\n  have haApprox_s :\n      y - algebraMap A (AdicCompletion 𝔪 A) a ∈\n        adicCompletionPowerImage A 𝔪 s :=\n    (adicCompletionPowerImage_antitone A 𝔪 hts) haApprox\n  have hdelta_sup :\n      y - algebraMap A (AdicCompletion 𝔪 A) a ∈\n        P ⊔ adicCompletionPowerImage A 𝔪 s :=\n    (show adicCompletionPowerImage A 𝔪 s ≤\n      P ⊔ adicCompletionPowerImage A 𝔪 s from le_sup_right) haApprox_s\n  have hy_sup : y ∈ P ⊔ adicCompletionPowerImage A 𝔪 s :=\n    (show P ≤ P ⊔ adicCompletionPowerImage A 𝔪 s from le_sup_left) hyP\n  have ha_image :\n      algebraMap A (AdicCompletion 𝔪 A) a ∈\n        P ⊔ adicCompletionPowerImage A 𝔪 s := by\n    have hsub :=\n      (P ⊔ adicCompletionPowerImage A 𝔪 s).sub_mem hy_sup hdelta_sup\n    convert hsub using 1\n    ring\n  have ha_chain : a ∈ badPrimeContractionChain A 𝔪 P s :=\n    (mem_badPrimeContractionChain A 𝔪 P s a).mpr ha_image\n  have ha_pow : a ∈ 𝔪 ^ k := hle ha_chain\n  have hfa_k :\n      algebraMap A (AdicCompletion 𝔪 A) a ∈\n        adicCompletionPowerImage A 𝔪 k :=\n    Ideal.mem_map_of_mem (algebraMap A (AdicCompletion 𝔪 A)) ha_pow\n  have haApprox_k :\n      y - algebraMap A (AdicCompletion 𝔪 A) a ∈\n        adicCompletionPowerImage A 𝔪 k :=\n    (adicCompletionPowerImage_antitone A 𝔪 htk) haApprox\n  have hy_k : y ∈ adicCompletionPowerImage A 𝔪 k := by\n    have hsum :=\n      (adicCompletionPowerImage A 𝔪 k).add_mem haApprox_k hfa_k\n    convert hsum using 1\n    ring\n  exact hyNot hy_k", "proof_size_lean": 2044, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 14, "proof_size_tex": 306, "effor
