 primeGenerator : Prop :=\n  ∃ (A : Type) (_inst : CommRing A) (𝔪 : @Ideal A _inst.toSemiring)\n    (ι : A →+* nodeRing) (q : @Ideal A _inst.toSemiring) (a : A),\n    counterexampleRing ∧ IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n      WeaklyQuasiComplete A 𝔪 ∧ Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n        (∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥) ∧\n          q = Ideal.comap ι nodePrime ∧ q.IsPrime ∧ q ≠ ⊥ ∧\n            q = Ideal.span ({a} : Set A)", "proof_size_lean": 485, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 7, "descendant_count": 26, "proof_size_tex": 147, "effort_local": 0, "proof_size_tex_total": 11284, "proof_size_lean_total": null, "effort_total": 130}, "lem:jensen_special_case_ufd_source": {"id": "lem:jensen_special_case_ufd_source", "type": "lemma", "title": "Jensen's selected ring is a UFD", "chapter": "The Anderson counterexample", "statement": "The ring \\(A\\) selected from Jensen's construction is a UFD.", "uses": ["lem:jensen_special_case", "lem:jensen_union_ufd"], "lean_name": "Run202608192034.TODO.jensenSpecialCase_isUFD_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the UFD part of Jensen's theorem: the saturated union is a UFD, and\n  the completion criterion upgrades the same union to the Noetherian local ring\n  used in the counterexample.\n", "lean_source": "theorem jensenSpecialCase_isUFD_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (_hCounter : counterexampleRing) :\n    UniqueFactorizationMonoid A := by\n  sorry", "proof_size_lean": null, "has_sorry": true, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 14, "proof_size_tex": 185, "effort_local": 185, "proof_size_tex_total": 10509, "proof_size_lean_total": null, "effort_total": 315}, "lem:counterexample_weak_criterion_source": {"id": "lem:counterexample_weak_criterion_source", "type": "lemma", "title": "Weak-completeness criterion for the selected ring", "chapter": "The Anderson counterexample", "statement": "The selected ring \\(A\\) is weakly quasi-complete exactly when every nonzero\n  prime of \\(T\\) contracts nontrivially to \\(A\\).", "uses": ["def:jensen_completion_witness"], "lean_name": "Run202608192034.TODO.counterexampleRing_weakCriterion_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is now a projection from the Jensen completion witness, which records\n  the Farley completion-prime criterion already transported along\n  \\(\\widehat A\\cong T\\).\n", "lean_source": "theorem counterexampleRing_weakCriterion_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (w : JensenCompletionWitness A 𝔪 ι) :\n    WeaklyQuasiComplete A 𝔪 ↔\n      ∀ P : Ideal nodeRing, P.IsPrime → P ≠ ⊥ → Ideal.comap ι P ≠ ⊥ := by\n  exact w.weakCriterion", "proof_size_lean": 280, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 13, "proof_size_tex": 165, "effort_local": 0, "proof_size_tex_total": 11807, "proof_size_lean_total": null, "effort_total": 130}, "lem:nonzero_prime_height_ge_one_source": {"id": "lem:nonzero_prime_height_ge_one_source", "type": "lemma", "title": "A nonzero ideal in a domain has positive height", "chapter": "The Anderson counterexample", "statement": "If \\(A\\) is a domain and \\(q\\neq(0)\\), then \\(\\operatorname{ht}q\\geq 1\\).", "uses": [], "lean_name": "Run202608192034.TODO.nonzeroPrime_height_ge_one_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The zero ideal is prime in a domain.  Since \\((0)\\subsetneq q\\), strict\n  monotonicity of height below a prime ideal gives\n  \\(\\operatorname{ht}(0)<\\operatorname{ht}q\\), and\n  \\(\\operatorname{ht}(0)=0\\).\n", "lean_source": "theorem nonzeroPrime_height_ge_one_source\n    (A : Type) [CommRing A] [IsDomain A] (q : Ideal A)\n    (_hqPrime : q.IsPrime) (hqNonzero : q ≠ ⊥) :\n    (1 : ℕ∞) ≤ q.height := by\n  have hBotLtQ : (⊥ : Ideal A) < q :=\n    bot_lt_iff_ne_bot.mpr hqNonzero\n  haveI : (⊥ : Ideal A).FiniteHeight := by\n    rw [Ideal.finiteHeight_iff]\n    exact Or.inr (by rw [Ideal.height_bot]; simp)\n  have hStrict : (⊥ : Ideal A).height < q.height :=\n    Ideal.height_strict_mono_of_is_prime hBotLtQ\n  have hPositive : 0 < q.height := by\n    simpa [Ideal.height_bot] using hStrict\n  exact ENat.one_le_iff_ne_zero.mpr (ne_of_gt hPositive)", "proof_size_lean": 613, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 15, "proof_size_tex": 203, "effort_local": 0, "proof_size_tex_total": 203, "proof_size_lean_total": 613, "effort_total": 0}, "lem:lies_over_height_le_of_has_going_down_source": {"id": "lem:lies_over_height_le_of_has_going_down_source", "type": "lemma", "title": "Going-down controls height under lies-over", "chapter": "The Anderson counterexample", "statement": "If \\(T\\) is a Noetherian \\(A\\)-algebra satisfying going-down and\n  \\(Q\\subseteq T\\) lies over \\(q\\subseteq A\\), then\n  \\(\\operatorname{ht}q\\leq\\operatorname{ht}Q\\).", "uses": [], "lean_name": "Run202608192034.TODO.liesOver_height_le_of_hasGoingDown_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use Mathlib's height formula for going-down:\n  \\[\n    \\operatorname{ht}Q =\n    \\operatorname{ht}q +\n    \\operatorname{ht}\\bigl(Q(T/qT)\\bigr).\n  \\]\n  Since \\(x\\leq x+y\\) in \\(\\mathbb N_\\infty\\), the desired inequality follows.\n", "lean_source": "theorem liesOver_height_le_of_hasGoingDown_source\n    (A T : Type) [CommRing A] [CommRing T] [Algebra A T]\n    [IsNoetherianRing A] [IsNoetherianRing T] [Algebra.HasGoingDown A T]\n    (q : Ideal A) (Q : Ideal T) (hqPrime : q.IsPrime) (hQPrime : Q.IsPrime)\n    (hLiesOver : Q.LiesOver q) :\n    q.height ≤ Q.height := by\n  haveI : q.IsPrime := hqPrime\n  haveI : Q.IsPrime := hQPrime\n  haveI : Q.LiesOver q := hLiesOver\n  have hEq :\n      Q.height =\n        q.height +\n          (Q.map (Ideal.Quotient.mk <| q.map (algebraMap A T))).height :=\n    Ideal.height_eq_height_add_of_liesOver_of_hasGoingDown q Q\n  exact (self_le_add_right q.height _).trans (le_of_eq hEq.symm)", "proof_size_lean": 667, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 17, "proof_size_tex": 225, "effort_local": 0, "proof_size_tex_total": 225, "proof_size_lean_total": 667, "effort_total": 0}, "lem:adic_completion_has_going_down_of_is_noetherian": {"id": "lem:adic_completion_has_going_down_of_is_noetherian", "type": "lemma", "title": "Noetherian adic completions have going-down", "chapter": "The Anderson counterexample", "statement": "If \\(A\\) is Noetherian, then the canonical algebra map\n  \\(A\\to\\widehat A^{\\,\\mathfrak m}\\) has going-down.", "uses": [], "lean_name": "Run202608192034.TODO.adicCompletion_hasGoingDown_of_isNoetherian", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Mathlib proves that Noetherian adic completions are flat over the original\n  ring.  Flat algebras satisfy going-down, so typeclass inference supplies the\n  result.\n", "lean_source": "theorem adicCompletion_hasGoingDown_of_isNoetherian\n    (A : Type) [CommRing A] (𝔪 : Ideal A) [IsNoetherianRing A] :\n    Algebra.HasGoingDown A (AdicCompletion 𝔪 A) := by\n  infer_instance", "proof_size_lean": 187, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 18, "proof_size_tex": 163, "effort_local": 0, "proof_size_tex_total": 163, "proof_size_lean_total": 187, "effort_total": 0}, "lem:adic_completion_equiv_has_going_down_of_is_noetherian": {"id": "lem:adic_completion_equiv_has_going_down_of_is_noetherian", "type": "lemma", "title": "Going-down transports across a completion equivalence", "chapter": "The Anderson counterexample", "statement": "If \\(A\\) is Noetherian and \\(\\widehat A^{\\,\\mathfrak m}\\cong T\\), then the\n  transported algebra structure \\(A\\to T\\) has going-down.", "uses": ["lem:adic_completion_has_going_down_of_is_noetherian"], "lean_name": "Run202608192034.TODO.adicCompletion_equiv_hasGoingDown_of_isNoetherian", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The canonical map \\(A\\to\\widehat A^{\\,\\mathfrak m}\\) is flat, and a bijective\n  ring map \\(\\widehat A^{\\,\\mathfrak m}\\to T\\) is flat.  Flatness is stable\n  under composition, hence the transported map \\(A\\to T\\) is flat.  Apply\n  `Algebra.HasGoingDown.of_flat`.\n", "lean_source": "theorem adicCompletion_equiv_hasGoingDown_of_isNoetherian\n    (A T : Type) [CommRing A] [CommRing T] (𝔪 : Ideal A)\n    [IsNoetherianRing A] (e : AdicCompletion 𝔪 A ≃+* T) :\n    letI : Algebra A T :=\n      (e.toRingHom.comp (algebraMap A (AdicCompletion 𝔪 A))).toAlgebra\n    Algebra.HasGoingDown A T := by\n  let f : A →+* AdicCompletion 𝔪 A :=\n    algebraMap A (AdicCompletion 𝔪 A)\n  let g : AdicCompletion 𝔪 A →+* T :=\n    e.toRingHom\n  have hf : f.Flat := by\n    rw [RingHom.flat_algebraMap_iff]\n    infer_instance\n  have hg : g.Flat :=\n    RingHom.Flat.of_bijective e.bijective\n  have hfg : (g.comp f).Flat :=\n    hf.comp hg\n  change\n    letI : Algebra A T := (g.comp f).toAlgebra\n    Algebra.HasGoingDown A T\n  letI : Algebra A T := (g.comp f).toAlgebra\n  haveI : Module.Flat A T := hfg\n  infer_instance", "proof_size_lean": 806, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 17, "proof_size_tex": 261, "effort_local": 0, "proof_size_tex_total": 424, "proof_size_lean_total": 993, "effort_total": 0}, "lem:completion_map_has_going_down_source": {"id": "lem:completion_map_has_going_down_source", "type": "lemma", "title": "The completion map has going-down", "chapter": "The Anderson counterexample", "statement": "The selected completion map \\(A\\to T\\) satisfies going-down.", "uses": ["def:jensen_completion_witness", "lem:adic_completion_equiv_has_going_down_of_is_noetherian"], "lean_name": "Run202608192034.TODO.completionMap_hasGoingDown_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The Jensen completion witness identifies the selected map \\(A\\to T\\) with\n  the standard adic completion map transported across\n  \\(\\widehat A\\cong T\\).  Apply the checked transport lemma for going-down\n  across such a completion equivalence.\n", "lean_source": "theorem completionMap_hasGoingDown_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (hNoeth : IsNoetherianRing A) (_hLocal : IsLocalRing A)\n    (w : JensenCompletionWitness A 𝔪 ι) :\n    letI : Algebra A nodeRing := ι.toAlgebra\n    Algebra.HasGoingDown A nodeRing := by\n  rw [w.map_compatible]\n  exact\n    adicCompletion_equiv_hasGoingDown_of_isNoetherian A nodeRing 𝔪\n      w.completionEquiv", "proof_size_lean": 416, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 16, "proof_size_tex": 242, "effort_local": 0, "proof_size_tex_total": 12308, "proof_size_lean_total": null, "effort_total": 130}, "lem:contracted_prime_height_le_one_of_has_going_down_source": {"id": "lem:contracted_prime_height_le_one_of_has_going_down_source", "type": "lemma", "title": "Going-down gives the contracted-prime height upper bound", "chapter": "The Anderson counterexample", "statement": "If the selected completion map has going-down, then\n  \\(\\operatorname{ht}(Q\\cap A)\\leq1\\).", "uses": ["lem:lies_over_height_le_of_has_going_down_source", "lem:node_prime_height"], "lean_name": "Run202608192034.TODO.contractedPrime_height_le_one_of_hasGoingDown_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The equality \\(q=Q\\cap A\\) says exactly that \\(Q\\) lies over \\(q\\).  Apply\n  the going-down height comparison and then use\n  \\(\\operatorname{ht}Q=1\\).\n", "lean_source": "theorem contractedPrime_height_le_one_of_hasGoingDown_source\n    (A : Type) [CommRing A] (_𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (q : Ideal A) (hNoeth : IsNoetherianRing A) (_hLocal : IsLocalRing A)\n    (_hDomain : IsDomain A) (hqComap : q = Ideal.comap ι nodePrime)\n    (hqPrime : q.IsPrime) (_hqNonzero : q ≠ ⊥)\n    (hGoingDown :\n      letI : Algebra A nodeRing := ι.toAlgebra\n      Algebra.HasGoingDown A nodeRing) :\n    q.height ≤ 1 := by\n  letI : Algebra A nodeRing := ι.toAlgebra\n  haveI : IsNoetherianRing A := hNoeth\n  haveI : IsNoetherianRing nodeRing := node_complete_cm_dim.1\n  haveI : Algebra.HasGoingDown A nodeRing := hGoingDown\n  have hNodePrime : nodePrime.IsPrime := nodePrime_prime_height.1\n  have hNodeHeight : nodePrime.height = 1 := nodePrime_prime_height.2.2\n  have hLiesOver : nodePrime.LiesOver q := by\n    constructor\n    simpa [Ideal.under_def, RingHom.algebraMap_toAlgebra] using hqComap\n  exact\n    (liesOver_height_le_of_hasGoingDown_source A nodeRing q nodePrime hqPrime\n      hNodePrime hLiesOver).trans (le_of_eq hNodeHeight)", "proof_size_lean": 1057, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 16, "proof_size_tex": 150, "effort_local": 0, "proof_size_tex_total": 2120, "proof_size_lean_total": 3539, "effort_total": 0}, "lem:contracted_prime_height_le_one_source": {"id": "lem:contracted_prime_height_le_one_source", "type": "lemma", "title": "Going-down gives the contracted-prime height upper bound", "chapter": "The Anderson counterexample", "statement": "For \\(q=Q\\cap A\\), the completion map gives\n  \\(\\operatorname{ht}q\\leq 1\\).", "uses": ["lem:completion_map_has_going_down_source", "lem:contracted_prime_height_le_one_of_has_going_down_source"], "lean_name": "Run202608192034.TODO.contractedPrime_height_le_one_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine the source fact that the selected completion map has going-down with\n  the checked height comparison for ideals satisfying lies-over.\n", "lean_source": "theorem contractedPrime_height_le_one_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (q : Ideal A) (w : JensenCompletionWitness A 𝔪 ι)\n    (hNoeth : IsNoetherianRing A) (hLocal : IsLocalRing A)\n    (hDomain : IsDomain A) (hqComap : q = Ideal.comap ι nodePrime)\n    (hqPrime : q.IsPrime) (hqNonzero : q ≠ ⊥) :\n    q.height ≤ 1 := by\n  exact\n    contractedPrime_height_le_one_of_hasGoingDown_source A 𝔪 ι q hNoeth\n      hLocal hDomain hqComap hqPrime hqNonzero\n      (completionMap_hasGoingDown_source A 𝔪 ι hNoeth hLocal w)", "proof_size_lean": 549, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 15, "proof_size_tex": 141, "effort_local": 0, "proof_size_tex_total": 12824, "proof_size_lean_total": null, "effort_total": 130}, "lem:contracted_prime_height_one_source": {"id": "lem:contracted_prime_height_one_source", "type": "lemma", "title": "The contracted prime has height one", "chapter": "The Anderson counterexample", "statement": "For \\(q=Q\\cap A\\), the contracted prime \\(q\\) has height one.", "uses": ["lem:nonzero_prime_height_ge_one_source", "lem:contracted_prime_height_le_one_source"], "lean_name": "Run202608192034.TODO.contractedPrime_height_one_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine the going-down upper bound \\(\\operatorname{ht}q\\leq1\\) with the\n  lower bound \\(\\operatorname{ht}q\\geq1\\) coming from \\(q\\neq(0)\\) in the\n  domain \\(A\\).\n", "lean_source": "theorem contractedPrime_height_one_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (q : Ideal A) (w : JensenCompletionWitness A 𝔪 ι)\n    (hNoeth : IsNoetherianRing A) (hLocal : IsLocalRing A)\n    (hDomain : IsDomain A) (hqComap : q = Ideal.comap ι nodePrime)\n    (hqPrime : q.IsPrime) (hqNonzero : q ≠ ⊥) :\n    q.height = 1 := by\n  haveI : IsDomain A := hDomain\n  exact le_antisymm\n    (contractedPrime_height_le_one_source A 𝔪 ι q w hNoeth hLocal hDomain\n      hqComap hqPrime hqNonzero)\n    (nonzeroPrime_height_ge_one_source A q hqPrime hqNonzero)", "proof_size_lean": 576, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 14, "proof_size_tex": 161, "effort_local": 0, "proof_size_tex_total": 13188, "proof_size_lean_total": null, "effort_total": 130}, "lem:height_one_prime_principal_ufd_source": {"id": "lem:height_one_prime_principal_ufd_source", "type": "lemma", "title": "Height-one primes in the selected UFD are principal", "chapter": "The Anderson counterexample", "statement": "A nonzero height-one prime ideal in the selected UFD is principal.", "uses": ["lem:jensen_special_case_ufd_source", "lem:contracted_prime_height_one_source"], "lean_name": "Run202608192034.TODO.heightOnePrime_principal_of_ufd_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Mathlib gives a prime element \\(p\\in q\\) inside any nonzero prime ideal of a\n  UFD.  Then \\((p)\\) is a nonzero prime ideal and \\((p)\\subseteq q\\).  If the\n  containment were strict, strict monotonicity of prime height would give\n  \\(\\operatorname{ht}(p)<\\operatorname{ht}q=1\\), contradicting\n  \\(\\operatorname{ht}(p)>0\\).\n", "lean_source": "theorem heightOnePrime_principal_of_ufd_source\n    (A : Type) [CommRing A] [IsDomain A] [UniqueFactorizationMonoid A]\n    (q : Ideal A) (_hqPrime : q.IsPrime) (_hqNonzero : q ≠ ⊥)\n    (_hqHeight : q.height = 1) :\n    ∃ a : A, q = Ideal.span ({a} : Set A) := by\n  rcases Ideal.IsPrime.exists_mem_prime_of_ne_bot _hqPrime _hqNonzero with\n    ⟨p, hpMem, hpPrime⟩\n  refine ⟨p, ?_⟩\n  have hpSpanPrime : (Ideal.span ({p} : Set A)).IsPrime :=\n    (Ideal.span_singleton_prime hpPrime.ne_zero).2 hpPrime\n  haveI : (Ideal.span ({p} : Set A)).IsPrime := hpSpanPrime\n  have hpSpanLeQ : Ideal.span ({p} : Set A) ≤ q :=\n    (Ideal.span_singleton_le_iff_mem q).mpr hpMem\n  have hpSpanNonzero : Ideal.span ({p} : Set A) ≠ ⊥ :=\n    mt Ideal.span_singleton_eq_bot.mp hpPrime.ne_zero\n  have hpBotLtSpan : (⊥ : Ideal A) < Ideal.span ({p} : Set A) :=\n    bot_lt_iff_ne_bot.mpr hpSpanNonzero\n  haveI : (⊥ : Ideal A).FiniteHeight := by\n    rw [Ideal.finiteHeight_iff]\n    exact Or.inr (by rw [Ideal.height_bot]; simp)\n  have hpSpanHeightPos : 0 < (Ideal.span ({p} : Set A)).height := by\n    have hStrict :\n        (⊥ : Ideal A).height < (Ideal.span ({p} : Set A)).height :=\n      Ideal.height_strict_mono_of_is_prime hpBotLtSpan\n    simpa [Ideal.height_bot] using hStrict\n  have hpSpanPrimeHeightPos : 0 < (Ideal.span ({p} : Set A)).primeHeight := by\n    simpa [Ideal.height_eq_primeHeight] using hpSpanHeightPos\n  haveI : q.FiniteHeight := by\n    rw [Ideal.finiteHeight_iff]\n    exact Or.inr (by rw [_hqHeight]; simp)\n  have hqPrimeHeight : q.primeHeight = 1 := by\n    simpa [Ideal.height_eq_primeHeight] using _hqHeight\n  by_contra hNe\n  have hSpanLtQ : Ideal.span ({p} : Set A) < q :=\n    lt_of_le_of_ne hpSpanLeQ (fun hEq => hNe hEq.symm)\n  have hPrimeHeightLt :\n      (Ideal.span ({p} : Set A)).primeHeight < q.primeHeight :=\n    Ideal.primeHeight_strict_mono hSpanLtQ\n  rw [hqPrimeHeight] at hPrimeHeightLt\n  exact\n    (not_lt_of_ge\n      (ENat.one_le_iff_ne_zero.mpr (ne_of_gt hpSpanPrimeHeightPos)))\n      hPrimeHeightLt", "proof_size_lean": 2005, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 13, "proof_size_tex": 321, "effort_local": 0, "proof_size_tex_total": 13694, "proof_size_lean_total": null, "effort_total": 315}, "lem:prime_generator_source": {"id": "lem:prime_generator_source", "type": "lemma", "title": "Source theorem for the prime generator", "chapter": "The Anderson counterexample", "statement": "The Jensen construction and the UFD height-one-prime argument supply the\n  prime-generator package used later.", "uses": ["def:prime_generator", "lem:jensen_special_case", "lem:jensen_completion_witness_source", "lem:counterexample_weak_criterion_source", "lem:contracted_prime_height_one_source", "lem:height_one_prime_principal_ufd_source"], "lean_name": "Run202608192034.TODO.primeGenerator_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use the constructed ring \\(A\\), take \\(q=Q\\cap A\\), and apply the\n  height-one-prime-in-a-UFD argument to choose \\(a\\) with \\(q=aA\\).  The\n  generic-fiber condition gives nonzeroness of the contraction.  The Jensen\n  completion witness supplies both the transported Farley criterion and the\n  going-down input used in the height calculation.\n", "lean_source": "theorem primeGenerator_source : primeGenerator := by\n  rcases jensenSpecialCase with\n    ⟨A, instA, 𝔪, ι, hNoeth, hLocal, hDomain, hBot, hNonzeroContraction⟩\n  letI := instA\n  let q : Ideal A := Ideal.comap ι nodePrime\n  have hCounter : counterexampleRing :=\n    ⟨A, instA, 𝔪, ι, hNoeth, hLocal, hDomain, hBot, hNonzeroContraction⟩\n  have hqComap : q = Ideal.comap ι nodePrime := rfl\n  have hqPrime : q.IsPrime := by\n    haveI : nodePrime.IsPrime := nodePrime_prime_height.1\n    exact Ideal.comap_isPrime ι nodePrime\n  have hqNonzero : q ≠ ⊥ :=\n    hNonzeroContraction nodePrime nodePrime_prime_height.1 nodePrime_prime_height.2.1\n  let w : JensenCompletionWitness A 𝔪 ι :=\n    jensenCompletionWitness_source A 𝔪 ι hNoeth hLocal hDomain hBot\n      hNonzeroContraction\n  have hqHeight : q.height = 1 :=\n    contractedPrime_height_one_source A 𝔪 ι q w hNoeth hLocal hDomain\n      hqComap hqPrime hqNonzero\n  have hWeak : WeaklyQuasiComplete A 𝔪 :=\n    (counterexampleRing_weakCriterion_source A 𝔪 ι w).2 hNonzeroContraction\n  haveI : IsDomain A := hDomain\n  haveI : UniqueFactorizationMonoid A :=\n    jensenSpecialCase_isUFD_source A 𝔪 ι hCounter\n  rcases heightOnePrime_principal_of_ufd_source A q hqPrime hqNonzero hqHeight with\n    ⟨a, hqPrincipal⟩\n  exact\n    ⟨A, instA, 𝔪, ι, q, a, hCounter, hNoeth, hLocal, hDomain, hWeak, hBot,\n      hNonzeroContraction, hqComap, hqPrime, hqNonzero, hqPrincipal⟩", "proof_size_lean": 1401, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 6, "rdep_count": 1, "descendant_count": 13, "proof_size_tex": 341, "effort_local": 0, "proof_size_tex_total": 15841, "proof_size_lean_total": null, "effort_total": 656}, "lem:extended_principal_specific_not_prime": {"id": "lem:extended_principal_specific_not_prime", "type": "lemma", "title": "The chosen extended principal ideal is not prime", "chapter": "The Anderson counterexample", "statement": "For the specific generator \\(a\\) of the contracted prime \\(q\\), the extended\n  ideal \\(aT\\) is not prime.", "uses": ["def:prime_generator", "lem:counterexample_ring_properties", "lem:node_prime_height", "lem:node_prime_nonprincipal"], "lean_name": "Run202608192034.TODO.extendedPrincipal_not_prime_of_generator_data", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The identity \\(q=aA\\) gives \\(qT=aT\\), while\n  \\(q=Q\\cap A\\) gives \\(qT\\subseteq Q\\).  Since \\(A\\subseteq T\\), the extended\n  ideal is nonzero.  If \\(aT\\) were prime, the principal ideal theorem would\n  give height at most one, and nonzeroness in the domain \\(T\\) gives height at\n  least one.  A strict containment \\(aT\\subsetneq Q\\) would then strictly\n  increase prime height, contradicting that both have height one.  Hence\n  \\(aT=Q\\), contradicting that \\(Q\\) is not principal.\n", "lean_source": "theorem extendedPrincipal_not_prime_of_generator_data\n    (A : Type u) [CommRing A] (ι : A →+* nodeRing) (q : Ideal A) (a : A)\n    (hBot : Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥)\n    (hqComap : q = Ideal.comap ι nodePrime)\n    (hqNonzero : q ≠ ⊥)\n    (hqPrincipal : q = Ideal.span ({a} : Set A)) :\n    ¬ (Ideal.span ({ι a} : Set nodeRing)).IsPrime := by\n  have hMapPrincipal :\n      Ideal.map ι q = Ideal.span ({ι a} : Set nodeRing) := by\n    calc\n      Ideal.map ι q = Ideal.map ι (Ideal.span ({a} : Set A)) := by\n        rw [hqPrincipal]\n      _ = Ideal.span (ι '' ({a} : Set A)) := Ideal.map_span ι ({a} : Set A)\n      _ = Ideal.span ({ι a} : Set nodeRing) := by simp\n  have hMapLeNodePrime : Ideal.map ι q ≤ nodePrime := by\n    rw [hqComap]\n    exact Ideal.map_comap_le\n  have hPrincipalLeNodePrime : Ideal.span ({ι a} : Set nodeRing) ≤ nodePrime := by\n    simpa [hMapPrincipal] using hMapLeNodePrime\n  intro hPrincipalPrime\n  have hNodePrime : nodePrime.IsPrime := nodePrime_prime_height.1\n  have hNodeHeight : nodePrime.height = 1 := nodePrime_prime_height.2.2\n  have hNodeNotPrincipal :\n      ¬ ∃ b : nodeRing, nodePrime = Ideal.span ({b} : Set nodeRing) :=\n    nodePrime_not_principal\n  haveI : IsDomain nodeRing := nodeRing_isDomain\n  haveI : IsNoetherianRing nodeRing := node_complete_cm_dim.1\n  have hInjective : Function.Injective ι := by\n    rw [RingHom.injective_iff_ker_eq_bot, RingHom.ker_eq_comap_bot]\n    exact hBot\n  have hMapNonzero : Ideal.map ι q ≠ ⊥ := by\n    intro hMapBot\n    exact hqNonzero ((Ideal.map_eq_bot_iff_of_injective hInjective).mp hMapBot)\n  have hPrincipalNonzero :\n      Ideal.span ({ι a} : Set nodeRing) ≠ ⊥ := by\n    simpa [hMapPrincipal] using hMapNonzero\n  have hPrincipalProper :\n      Ideal.span ({ι a} : Set nodeRing) ≠ ⊤ := by\n    intro hTop\n    exact hNodePrime.ne_top\n      (top_le_iff.mp (by simpa [hTop] using hPrincipalLeNodePrime))\n  have hPrincipalHeightLe :\n      (Ideal.span ({ι a} : Set nodeRing)).height ≤ 1 := by\n    have hRankLe :\n        Cardinal.toENat\n            (Submodule.spanRank (Ideal.span ({ι a} : Set nodeRing))) ≤\n          (1 : ℕ∞) := by\n      calc\n        Cardinal.toENat\n            (Submodule.spanRank (Ideal.span ({ι a} : Set nodeRing))) ≤\n            Cardinal.toENat (Cardinal.mk ({ι a} : Set nodeRing)) :=\n          Cardinal.toENat.monotone'\n            (Submodule.spanRank_span_le_card ({ι a} : Set nodeRing))\n        _ = (1 : ℕ∞) := by simp\n    exact (Ideal.height_le_spanRank_toENat\n      (Ideal.span ({ι a} : Set nodeRing)) hPrincipalProper).trans hRankLe\n  have hBotLtPrincipal :\n      (⊥ : Ideal nodeRing) < Ideal.span ({ι a} : Set nodeRing) := by\n    exact bot_lt_iff_ne_bot.mpr hPrincipalNonzero\n  have hPrincipalHeightPos :\n      0 < (Ideal.span ({ι a} : Set nodeRing)).height := by\n    have hStrict :\n        (⊥ : Ideal nodeRing).height <\n          (Ideal.span ({ι a} : Set nodeRing)).height :=\n      Ideal.height_strict_mono_of_is_prime hBotLtPrincipal\n    simpa [Ideal.height_bot] using hStrict\n  have hPrincipalHeightEq :\n      (Ideal.span ({ι a} : Set nodeRing)).height = 1 := by\n    refine le_antisymm hPrincipalHeightLe ?_\n    exact ENat.one_le_iff_ne_zero.mpr (ne_of_gt hPrincipalHeightPos)\n  have hPrincipalEqNode : Ideal.span ({ι a} : Set nodeRing) = nodePrime := by\n    by_contra hNe\n    have hLt : Ideal.span ({ι a} : Set nodeRing) < nodePrime :=\n      lt_of_le_of_ne hPrincipalLeNodePrime hNe\n    have hPrimeHeightLt :\n        (Ideal.span ({ι a} : Set nodeRing)).primeHeight < nodePrime.primeHeight :=\n      Ideal.primeHeight_strict_mono hLt\n    have hPrincipalPrimeHeight :\n        (Ideal.span ({ι a} : Set nodeRing)).primeHeight = 1 := by\n      simpa [Ideal.height_eq_primeHeight] using hPrincipalHeightEq\n    have hNodePrimeHeight : nodePrime.primeHeight = 1 := by\n      simpa [Ideal.height_eq_primeHeight] using hNodeHeight\n    rw [hPrincipalPrimeHeight, hNodePrimeHeight] at hPrimeHeightLt\n    exact (lt_irrefl (1 : ℕ∞)) hPrimeHeightLt\n  exact hNodeNotPrincipal ⟨ι a, hPrincipalEqNode.symm⟩", "proof_size_lean": 3996, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 2, "descendant_count": 5, "proof_size_tex": 481, "effort_local": 0, "proof_size_tex_total": 11765, "proof_size_lean_total": null, "effort_total": 130}, "lem:extended_principal_not_prime": {"id": "lem:extended_principal_not_prime", "type": "lemma", "title": "The extended principal ideal is not prime", "chapter": "The Anderson counterexample", "statement": "The ideal \\(aT\\) is a proper nonprime ideal of \\(T\\).", "uses": ["lem:extended_principal_specific_not_prime"], "lean_name": "Run202608192034.TODO.extendedPrincipal_not_prime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the existential form of\n  \\cref{lem:extended_principal_specific_not_prime}.\n", "lean_source": "theorem extendedPrincipal_not_prime :\n    primeGenerator →\n      ∃ (a : nodeRing), ¬ (Ideal.span ({a} : Set nodeRing)).IsPrime := by\n  intro hGen\n  rcases hGen with\n    ⟨A, instA, _𝔪, ι, q, a, _hCounter, _hNoeth, _hLocal, _hDomain, _hWeak,\n      hBot, _hNonzeroContraction, hqComap, _hqPrime, _hqNonzero,\n      hqPrincipal⟩\n  letI := instA\n  exact\n    ⟨ι a,\n      extendedPrincipal_not_prime_of_generator_data A ι q a hBot hqComap\n        _hqNonzero hqPrincipal⟩", "proof_size_lean": 462, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 83, "effort_local": 0, "proof_size_tex_total": 11848, "proof_size_lean_total": null, "effort_total": 130}, "def:bad_quotient": {"id": "def:bad_quotient", "type": "definition", "title": "The bad quotient", "chapter": "The Anderson counterexample", "statement": "Set \\(B=A/aA\\).", "uses": ["def:counterexample_ring", "def:prime_generator"], "lean_name": "Run202608192034.TODO.badQuotient", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition.\n", "lean_source": "def badQuotient : Prop :=\n  ∃ (A : Type) (_inst : CommRing A) (𝔪 : @Ideal A _inst.toSemiring)\n    (ι : A →+* nodeRing) (q : @Ideal A _inst.toSemiring) (a : A),\n    IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n      WeaklyQuasiComplete A 𝔪 ∧\n        Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n          q = Ideal.comap ι nodePrime ∧ q.IsPrime ∧ q ≠ ⊥ ∧\n            q = Ideal.span ({a} : Set A)", "proof_size_lean": 395, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 23, "proof_size_tex": 21, "effort_local": 0, "proof_size_tex_total": 11305, "proof_size_lean_total": null, "effort_total": 130}, "def:bad_quotient_source_data": {"id": "def:bad_quotient_source_data", "type": "definition", "title": "Bad quotient source data", "chapter": "The Anderson counterexample", "statement": "Package the source data for the bad quotient as one object:\n  \\(A\\), \\(\\mathfrak m_A\\), the map \\(A\\to T\\), the contracted prime\n  \\(q=Q\\cap A\\), its chosen generator \\(a\\), and the structural properties of\n  \\(A\\) and \\(q\\).", "uses": ["def:bad_quotient", "def:prime_generator"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a data structure organizing the hypotheses already present in\n  \\cref{def:bad_quotient}, together with the Jensen generic-fiber data needed\n  to recover the earlier contracted-prime and prime-generator nodes.\n", "lean_source": "structure BadQuotientSourceData where\n  A : Type\n  [instA : CommRing A]\n  𝔪 : Ideal A\n  ι : A →+* nodeRing\n  q : Ideal A\n  a : A\n  hCounter : counterexampleRing\n  hNoeth : IsNoetherianRing A\n  hLocal : IsLocalRing A\n  hDomain : IsDomain A\n  hWeak : WeaklyQuasiComplete A 𝔪\n  hBot : Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥\n  hNonzeroContraction :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥\n  hqComap : q = Ideal.comap ι nodePrime\n  hqPrime : q.IsPrime\n  hqNonzero : q ≠ ⊥\n  hqPrincipal : q = Ideal.span ({a} : Set A)\n\nattribute [instance] BadQuotientSourceData.instA", "proof_size_lean": 587, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 8, "descendant_count": 21, "proof_size_tex": 216, "effort_local": 0, "proof_size_tex_total": 11521, "proof_size_lean_total": null, "effort_total": 130}, "def:bad_quotient_quasi_criterion_field": {"id": "def:bad_quotient_quasi_criterion_field", "type": "definition", "title": "Quotient criterion field", "chapter": "The Anderson counterexample", "statement": "The source data carries the Anderson/Farley criterion saying that\n  \\(A\\) is quasi-complete exactly when all quotients \\(A/J\\) are weakly\n  quasi-complete.", "uses": ["def:bad_quotient_source_data", "lem:quotient_weak_characterization"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.QuasiCriterion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This field records the criterion in the notation of the chosen data package.\n", "lean_source": "def BadQuotientSourceData.QuasiCriterion\n    (d : BadQuotientSourceData) : Prop :=\n  QuasiComplete d.A d.𝔪 ↔\n    ∀ J : Ideal d.A,\n      WeaklyQuasiComplete (d.A ⧸ J) (Ideal.map (Ideal.Quotient.mk J) d.𝔪)", "proof_size_lean": 203, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 9, "proof_size_tex": 76, "effort_local": 0, "proof_size_tex_total": 12624, "proof_size_lean_total": null, "effort_total": 130}, "def:bad_quotient_dimension_criterion_field": {"id": "def:bad_quotient_dimension_criterion_field", "type": "definition", "title": "Dimension-one criterion field", "chapter": "The Anderson counterexample", "statement": "The source data carries the dimension-one criterion identifying weak\n  quasi-completeness of \\(A/q\\) with analytic irreducibility of the completed\n  quotient \\(T/aT\\).", "uses": ["def:bad_quotient_source_data", "lem:dimension_one_weak_criterion"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.DimensionCriterion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This field records the dimension-one criterion in the notation of the chosen\n  data package.\n", "lean_source": "def BadQuotientSourceData.DimensionCriterion\n    (d : BadQuotientSourceData) : Prop :=\n  WeaklyQuasiComplete (d.A ⧸ d.q)\n    (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ↔\n      AnalyticallyIrreducible (d.A ⧸ d.q)\n        (nodeRing ⧸ Ideal.span ({d.ι d.a} : Set nodeRing))", "proof_size_lean": 267, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 92, "effort_local": 0, "proof_size_tex_total": 13484, "proof_size_lean_total": null, "effort_total": 130}, "def:jensen_completion_witness": {"id": "def:jensen_completion_witness", "type": "definition", "title": "Jensen completion witness", "chapter": "The Anderson counterexample", "statement": "Record the stronger Jensen output needed later: an abstract completion\n  equivalence \\(\\widehat A^{\\,\\mathfrak m}\\cong T\\), compatibility with the\n  embedded map \\(A\\to T\\), and the weak quasi-completeness criterion expressed\n  through this completion.", "uses": ["lem:jensen_special_case", "lem:farley_completion_criterion"], "lean_name": "Run202608192034.TODO.JensenCompletionWitness", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a source data structure isolating the part of Jensen's construction\n  that identifies the completion of \\(A\\) with the chosen complete local ring\n  \\(T\\).  In Lean the completion is the standard Mathlib object\n  `AdicCompletion \\(\\mathfrak m\\) A`.\n", "lean_source": "structure JensenCompletionWitness\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing) where\n  completionEquiv : AdicCompletion 𝔪 A ≃+* nodeRing\n  map_compatible :\n    ι = completionEquiv.toRingHom.comp\n      (algebraMap A (AdicCompletion 𝔪 A))\n  weakCriterion :\n    WeaklyQuasiComplete A 𝔪 ↔\n      ∀ P : Ideal nodeRing, P.IsPrime → P ≠ ⊥ → Ideal.comap ι P ≠ ⊥", "proof_size_lean": 370, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 4, "descendant_count": 21, "proof_size_tex": 255, "effort_local": 0, "proof_size_tex_total": 11642, "proof_size_lean_total": null, "effort_total": 130}, "def:quotient_completion_witness": {"id": "def:quotient_completion_witness", "type": "definition", "title": "Quotient completion witness", "chapter": "The Anderson counterexample", "statement": "Record the completion bridge for the quotient \\(A/q=A/aA\\): its completion\n  target is equivalent to \\(T/aT\\), and the dimension-one analytic\n  irreducibility criterion applies to that completion target.", "uses": ["def:bad_quotient_source_data", "def:jensen_completion_witness", "lem:dimension_one_weak_criterion"], "lean_name": "Run202608192034.TODO.QuotientCompletionWitness", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the source interface for the theorem that completion commutes with\n  quotient by the principal ideal \\(aA\\), after transporting\n  \\(\\widehat A\\cong T\\).\n", "lean_source": "structure QuotientCompletionWitness (d : BadQuotientSourceData) where\n  Bhat : Type\n  [instBhat : CommRing Bhat]\n  quotientCompletionEquiv :\n    Bhat ≃+* (nodeRing ⧸ Ideal.span ({d.ι d.a} : Set nodeRing))\n  analyticCriterionOnBhat :\n    WeaklyQuasiComplete (d.A ⧸ d.q)\n      (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ↔\n        AnalyticallyIrreducible (d.A ⧸ d.q) Bhat\n\nattribute [instance] QuotientCompletionWitness.instBhat", "proof_size_lean": 422, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 3, "descendant_count": 11, "proof_size_tex": 160, "effort_local": 0, "proof_size_tex_total": 13807, "proof_size_lean_total": null, "effort_total": 130}, "lem:quotient_completion_dimension_criterion": {"id": "lem:quotient_completion_dimension_criterion", "type": "lemma", "title": "Transporting the dimension-one criterion", "chapter": "The Anderson counterexample", "statement": "If the quotient completion target is equivalent to \\(T/aT\\), then the\n  analytic irreducibility criterion may be stated directly with \\(T/aT\\) as\n  the target.", "uses": ["def:quotient_completion_witness", "def:bad_quotient_dimension_criterion_field"], "lean_name": "Run202608192034.TODO.QuotientCompletionWitness.dimensionCriterion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  In this formalization analytic irreducibility is represented by the target\n  being a domain.  Domainness is transported across the recorded ring\n  equivalence.\n", "lean_source": "theorem QuotientCompletionWitness.dimensionCriterion\n    {d : BadQuotientSourceData} (w : QuotientCompletionWitness d) :\n    d.DimensionCriterion := by\n  dsimp [BadQuotientSourceData.DimensionCriterion] at *\n  constructor\n  · intro hWeak\n    have hBhatDomain :\n        AnalyticallyIrreducible (d.A ⧸ d.q) w.Bhat :=\n      w.analyticCriterionOnBhat.1 hWeak\n    dsimp [AnalyticallyIrreducible] at hBhatDomain ⊢\n    haveI : IsDomain w.Bhat := hBhatDomain\n    exact MulEquiv.isDomain w.Bhat w.quotientCompletionEquiv.symm.toMulEquiv\n  · intro hNodeDomain\n    apply w.analyticCriterionOnBhat.2\n    dsimp [AnalyticallyIrreducible] at hNodeDomain ⊢\n    haveI : IsDomain\n        (nodeRing ⧸ Ideal.span ({d.ι d.a} : Set nodeRing)) := hNodeDomain\n    exact MulEquiv.isDomain\n      (nodeRing ⧸ Ideal.span ({d.ι d.a} : Set nodeRing))\n      w.quotientCompletionEquiv.toMulEquiv", "proof_size_lean": 863, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 7, "proof_size_tex": 159, "effort_local": 0, "proof_size_tex_total": 14058, "proof_size_lean_total": null, "effort_total": 130}, "def:bad_quotient_structured_source": {"id": "def:bad_quotient_structured_source", "type": "definition", "title": "Structured bad-quotient source", "chapter": "The Anderson counterexample", "statement": "Package the bad quotient data together with Jensen's completion witness, the\n  quotient-completion bridge, and the quotient criterion for quasi-completeness.", "uses": ["def:bad_quotient_source_data", "def:jensen_completion_witness", "def:quotient_completion_witness", "def:bad_quotient_quasi_criterion_field"], "lean_name": "Run202608192034.TODO.BadQuotientStructuredSource", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This structure separates the paper's order into three layers: construct the\n  ring \\(A\\), identify its completion with \\(T\\), and then identify the\n  completion of \\(A/aA\\) with \\(T/aT\\).\n", "lean_source": "structure BadQuotientStructuredSource where\n  data : BadQuotientSourceData\n  jensenCompletion :\n    JensenCompletionWitness data.A data.𝔪 data.ι\n  quotientCompletion : QuotientCompletionWitness data\n  quasiCriterion : data.QuasiCriterion", "proof_size_lean": 237, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 187, "effort_local": 0, "proof_size_tex_total": 14819, "proof_size_lean_total": null, "effort_total": 130}, "lem:source_data_to_contracted_prime": {"id": "lem:source_data_to_contracted_prime", "type": "lemma", "title": "Source data recovers the contracted prime", "chapter": "The Anderson counterexample", "statement": "The structured source data remembers the contracted prime\n  \\(q=Q\\cap A\\), so it recovers the contracted-prime node.", "uses": ["def:bad_quotient_source_data", "def:contracted_prime"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.to_contractedPrime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Return the stored counterexample-ring witness, the equality\n  \\(q=Q\\cap A\\), primality of \\(q\\), and nonzeroness of \\(q\\).\n", "lean_source": "theorem BadQuotientSourceData.to_contractedPrime\n    (d : BadQuotientSourceData) : contractedPrime := by\n  exact\n    ⟨d.A, d.instA, d.𝔪, d.ι, d.q, d.hCounter, d.hqComap, d.hqPrime,\n      d.hqNonzero⟩", "proof_size_lean": 199, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 122, "effort_local": 0, "proof_size_tex_total": 11643, "proof_size_lean_total": null, "effort_total": 130}, "lem:source_data_to_prime_generator": {"id": "lem:source_data_to_prime_generator", "type": "lemma", "title": "Source data recovers the prime generator", "chapter": "The Anderson counterexample", "statement": "The structured source data remembers the generator \\(q=aA\\), so it recovers\n  the prime-generator node used in the proof that \\(aT\\) is not prime.", "uses": ["def:bad_quotient_source_data", "def:prime_generator"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.to_primeGenerator", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Return the stored Jensen data, weak quasi-completeness, nonzero-contraction\n  condition, contracted-prime identity, and principal generator identity.\n", "lean_source": "theorem BadQuotientSourceData.to_primeGenerator\n    (d : BadQuotientSourceData) : primeGenerator := by\n  exact\n    ⟨d.A, d.instA, d.𝔪, d.ι, d.q, d.a, d.hCounter, d.hNoeth, d.hLocal,\n      d.hDomain, d.hWeak, d.hBot, d.hNonzeroContraction, d.hqComap,\n      d.hqPrime, d.hqNonzero, d.hqPrincipal⟩", "proof_size_lean": 294, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 149, "effort_local": 0, "proof_size_tex_total": 11670, "proof_size_lean_total": null, "effort_total": 130}, "lem:bad_quotient_source_data_from_jensen": {"id": "lem:bad_quotient_source_data_from_jensen", "type": "lemma", "title": "Bad-quotient source data from Jensen", "chapter": "The Anderson counterexample", "statement": "The prime-generator source theorem supplies the source data\n  \\(A,\\mathfrak m_A,q,a\\) used for the bad quotient.", "uses": ["lem:prime_generator_source", "def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.badQuotient_sourceData_from_jensen", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Destructure the prime-generator package and return the same data as a\n  `BadQuotientSourceData` object.\n", "lean_source": "theorem badQuotient_sourceData_from_jensen :\n    ∃ _ : BadQuotientSourceData, True := by\n  rcases primeGenerator_source with\n    ⟨A, instA, 𝔪, ι, q, a, hCounter, hNoeth, hLocal, hDomain, hWeak, hBot,\n      hNonzeroContraction, hqComap, hqPrime, hqNonzero, hqPrincipal⟩\n  letI := instA\n  exact\n    ⟨⟨A, 𝔪, ι, q, a, hCounter, hNoeth, hLocal, hDomain, hWeak, hBot,\n      hNonzeroContraction, hqComap, hqPrime, hqNonzero, hqPrincipal⟩,\n      trivial⟩", "proof_size_lean": 446, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 13, "proof_size_tex": 103, "effort_local": 0, "proof_size_tex_total": 15841, "proof_size_lean_total": null, "effort_total": 656}, "lem:jensen_completion_witness_source": {"id": "lem:jensen_completion_witness_source", "type": "lemma", "title": "Jensen completion equivalence source", "chapter": "The Anderson counterexample", "statement": "The Jensen construction identifies the completion of the selected ring\n  \\(A\\) with the prescribed complete local ring \\(T\\).", "uses": ["lem:bad_quotient_source_data_from_jensen", "lem:jensen_completion_criterion"], "lean_name": "Run202608192034.TODO.jensenCompletionWitness_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the strengthened form of Jensen's completion conclusion: besides\n  the embedded map \\(A\\to T\\), it records an equivalence from the standard\n  adic completion `AdicCompletion \\(\\mathfrak m\\) A` to \\(T\\), proves that\n  the embedded map is the transported completion map, and stores the transported\n  Farley weak-completeness criterion.\n", "lean_source": "noncomputable def jensenCompletionWitness_source\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing)\n    (_hNoeth : IsNoetherianRing A) (_hLocal : IsLocalRing A)\n    (_hDomain : IsDomain A)\n    (_hBot : Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥)\n    (_hNonzeroContraction :\n      ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥) :\n    JensenCompletionWitness A 𝔪 ι := by\n  sorry", "proof_size_lean": null, "has_sorry": true, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 13, "proof_size_tex": 341, "effort_local": 341, "proof_size_tex_total": 15841, "proof_size_lean_total": null, "effort_total": 656}, "lem:quotient_completion_witness_source": {"id": "lem:quotient_completion_witness_source", "type": "lemma", "title": "Quotient completion source", "chapter": "The Anderson counterexample", "statement": "Completion commutes with quotient by \\(q=aA\\), giving a completion target for\n  \\(A/q\\) equivalent to \\(T/aT\\).", "uses": ["lem:jensen_completion_witness_source", "def:quotient_completion_witness", "lem:dimension_one_weak_criterion"], "lean_name": "Run202608192034.TODO.quotientCompletionWitness_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use exactness of completion over the Noetherian local ring \\(A\\), then\n  transport the quotient of \\(\\widehat A\\) across the equivalence\n  \\(\\widehat A\\cong T\\).  The result is the completion target appearing in the\n  dimension-one analytic irreducibility criterion.\n", "lean_source": "noncomputable def quotientCompletionWitness_source\n    (d : BadQuotientSourceData)\n    (_w : JensenCompletionWitness d.A d.𝔪 d.ι) :\n    QuotientCompletionWitness d := by\n  sorry", "proof_size_lean": null, "has_sorry": true, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 266, "effort_local": 266, "proof_size_tex_total": 17075, "proof_size_lean_total": null, "effort_total": 922}, "lem:bad_quotient_quasi_criterion_source": {"id": "lem:bad_quotient_quasi_criterion_source", "type": "lemma", "title": "Bad-quotient quasi-completeness criterion source", "chapter": "The Anderson counterexample", "statement": "The selected ring \\(A\\) satisfies the Anderson/Farley criterion:\n  \\(A\\) is quasi-complete exactly when every quotient \\(A/J\\) is weakly\n  quasi-complete.", "uses": ["lem:bad_quotient_source_data_from_jensen", "lem:quotient_weak_characterization"], "lean_name": "Run202608192034.TODO.badQuotient_quasiCriterion_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the cited quotient characterization, specialized to the Jensen ring\n  \\(A\\) and its maximal ideal \\(\\mathfrak m_A\\).\n", "lean_source": "theorem badQuotient_quasiCriterion_source\n    (d : BadQuotientSourceData)\n    (_w : JensenCompletionWitness d.A d.𝔪 d.ι) :\n    d.QuasiCriterion := by\n  sorry", "proof_size_lean": null, "has_sorry": true, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 124, "effort_local": 124, "proof_size_tex_total": 16714, "proof_size_lean_total": null, "effort_total": 780}, "lem:bad_quotient_structured_source": {"id": "lem:bad_quotient_structured_source", "type": "lemma", "title": "Source theorem for the structured bad quotient", "chapter": "The Anderson counterexample", "statement": "The source construction supplies the complete structured package for the bad\n  quotient.", "uses": ["def:bad_quotient_structured_source", "lem:bad_quotient_source_data_from_jensen", "lem:jensen_completion_witness_source", "lem:quotient_completion_witness_source", "lem:bad_quotient_quasi_criterion_source", "lem:source_data_to_contracted_prime", "lem:source_data_to_prime_generator"], "lean_name": "Run202608192034.TODO.badQuotient_structured_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Choose the source data supplied by Jensen and the UFD generator step.  Attach\n  the Jensen completion witness, the quotient-completion witness, and the\n  quotient criterion.  The resulting tuple is the structured source package.\n", "lean_source": "theorem badQuotient_structured_source :\n    ∃ _ : BadQuotientStructuredSource, True := by\n  rcases badQuotient_sourceData_from_jensen with ⟨d, _hd⟩\n  let w : JensenCompletionWitness d.A d.𝔪 d.ι :=\n    jensenCompletionWitness_source d.A d.𝔪 d.ι d.hNoeth d.hLocal d.hDomain\n      d.hBot d.hNonzeroContraction\n  let qw : QuotientCompletionWitness d :=\n    quotientCompletionWitness_source d w\n  let hQuasi : d.QuasiCriterion :=\n    badQuotient_quasiCriterion_source d w\n  exact ⟨⟨d, w, qw, hQuasi⟩, trivial⟩", "proof_size_lean": 504, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 7, "rdep_count": 1, "descendant_count": 7, "proof_size_tex": 228, "effort_local": 0, "proof_size_tex_total": 18710, "proof_size_lean_total": null, "effort_total": 1046}, "lem:source_data_to_bad_quotient": {"id": "lem:source_data_to_bad_quotient", "type": "lemma", "title": "Source data gives a bad quotient", "chapter": "The Anderson counterexample", "statement": "Forgetting the two final criterion fields, the structured source data is\n  exactly the bad quotient data.", "uses": ["def:bad_quotient_source_data", "def:bad_quotient"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.to_badQuotient", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Return the fields of the source package in the order required by\n  \\cref{def:bad_quotient}.\n", "lean_source": "theorem BadQuotientSourceData.to_badQuotient\n    (d : BadQuotientSourceData) : badQuotient := by\n  exact\n    ⟨d.A, d.instA, d.𝔪, d.ι, d.q, d.a, d.hNoeth, d.hLocal, d.hDomain,\n      d.hWeak, d.hBot, d.hqComap, d.hqPrime, d.hqNonzero, d.hqPrincipal⟩", "proof_size_lean": 247, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 91, "effort_local": 0, "proof_size_tex_total": 11612, "proof_size_lean_total": null, "effort_total": 130}, "lem:bad_quotient_dimension_domain": {"id": "lem:bad_quotient_dimension_domain", "type": "lemma", "title": "Dimension and domain properties of the bad quotient", "chapter": "The Anderson counterexample", "statement": "The ring \\(B\\) is a one-dimensional Noetherian local domain.", "uses": ["def:bad_quotient", "def:prime_generator", "lem:contracted_prime_height", "lem:counterexample_ring_properties"], "lean_name": "Run202608192034.TODO.badQuotient_dimension_domain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The ideal \\(aA=q\\) is prime, so the quotient is a domain; quotients of\n  Noetherian local rings are Noetherian and local.  The chain\n  \\(q\\subsetneq\\mathfrak m_A\\) gives dimension at least one.  A longer prime\n  chain above \\(q\\), preceded by \\((0)\\subsetneq q\\), would have length above\n  two in \\(A\\), contrary to \\(\\dim A=2\\).  Hence \\(\\dim B=1\\).\n", "lean_source": "theorem badQuotient_dimension_domain :\n    badQuotient →\n      ∃ (B : Type) (_inst : CommRing B),\n        IsNoetherianRing B ∧ IsLocalRing B ∧ IsDomain B := by\n  intro hBad\n  rcases hBad with\n    ⟨A, instA, _𝔪, _ι, q, _a, hNoeth, hLocal, _hDomain, _hWeak, _hBot,\n      _hqComap, hqPrime, _hqNonzero, _hqPrincipal⟩\n  letI := instA\n  haveI : IsNoetherianRing A := hNoeth\n  haveI : IsLocalRing A := hLocal\n  haveI : q.IsPrime := hqPrime\n  haveI : Nontrivial (A ⧸ q) := Ideal.Quotient.nontrivial_iff.mpr hqPrime.ne_top\n  haveI : IsLocalHom (Ideal.Quotient.mk q) :=\n    IsLocalHom.of_surjective (Ideal.Quotient.mk q) Ideal.Quotient.mk_surjective\n  have hQuotientLocal : IsLocalRing (A ⧸ q) :=\n    IsLocalRing.of_surjective (Ideal.Quotient.mk q) Ideal.Quotient.mk_surjective\n  refine ⟨A ⧸ q, inferInstance, ?_, ?_, ?_⟩\n  · infer_instance\n  · exact hQuotientLocal\n  · infer_instance", "proof_size_lean": 875, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 2, "descendant_count": 3, "proof_size_tex": 350, "effort_local": 0, "proof_size_tex_total": 11655, "proof_size_lean_total": null, "effort_total": 130}, "lem:quotient_not_domain_of_not_prime": {"id": "lem:quotient_not_domain_of_not_prime", "type": "lemma", "title": "A quotient by a nonprime ideal is not a domain", "chapter": "The Anderson counterexample", "statement": "If an ideal \\(I\\) is not prime, then the quotient \\(R/I\\) is not a domain.", "uses": [], "lean_name": "Run202608192034.TODO.quotient_not_domain_of_not_prime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  If \\(R/I\\) were a domain, then the kernel of the quotient map\n  \\(R\\to R/I\\) would be prime.  This kernel is exactly \\(I\\), contradiction.\n", "lean_source": "theorem quotient_not_domain_of_not_prime\n    {R : Type u} [CommRing R] (I : Ideal R) (hI : ¬ I.IsPrime) :\n    ¬ IsDomain (R ⧸ I) := by\n  intro hDomain\n  haveI : IsDomain (R ⧸ I) := hDomain\n  exact hI (by simpa [Ideal.mk_ker] using\n    (RingHom.ker_isPrime (Ideal.Quotient.mk I)))", "proof_size_lean": 279, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 4, "proof_size_tex": 138, "effort_local": 0, "proof_size_tex_total": 138, "proof_size_lean_total": 279, "effort_total": 0}, "lem:bad_quotient_structured_criteria_source": {"id": "lem:bad_quotient_structured_criteria_source", "type": "lemma", "title": "Structured source criteria for the bad quotient", "chapter": "The Anderson counterexample", "statement": "The constructed data can be packaged as a source-ordered tuple containing\n  \\(A\\), \\(\\mathfrak m_A\\), the completion embedding \\(A\\to T\\), the contracted\n  prime \\(q=Q\\cap A\\), a generator \\(q=aA\\), and the two criteria needed for\n  the final bad quotient.", "uses": ["lem:bad_quotient_structured_source", "lem:quotient_completion_dimension_criterion"], "lean_name": "Run202608192034.TODO.badQuotient_structured_criteria_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Destructure the structured source theorem.  The quasi-completeness criterion\n  is stored directly, and the dimension-one criterion is transported from the\n  quotient completion target across its equivalence with \\(T/aT\\).\n", "lean_source": "theorem badQuotient_structured_criteria_source :\n    ∃ d : BadQuotientSourceData,\n      d.QuasiCriterion ∧ d.DimensionCriterion := by\n  rcases badQuotient_structured_source with ⟨s, _hs⟩\n  exact\n    ⟨s.data, s.quasiCriterion,\n      s.quotientCompletion.dimensionCriterion⟩", "proof_size_lean": 272, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 6, "proof_size_tex": 221, "effort_local": 0, "proof_size_tex_total": 19182, "proof_size_lean_total": null, "effort_total": 1046}, "lem:bad_quotient_criteria_source": {"id": "lem:bad_quotient_criteria_source", "type": "lemma", "title": "Expanded source criteria for the bad quotient", "chapter": "The Anderson counterexample", "statement": "Expandi
