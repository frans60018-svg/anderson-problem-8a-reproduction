y of the\n  completion.\n", "lean_source": "theorem BadQuotientSourceData.adicCompletion_quotient_hausdorff_source\n    (d : BadQuotientSourceData)\n    (P : Ideal (AdicCompletion d.𝔪 d.A)) :\n    IsHausdorff (adicCompletionPowerImage d.A d.𝔪 1)\n      (AdicCompletion d.𝔪 d.A ⧸ P) := by\n  letI : IsNoetherianRing d.A := d.hNoeth\n  letI : IsNoetherianRing (AdicCompletion d.𝔪 d.A) :=\n    d.adicCompletion_isNoetherianRing\n  exact adicCompletion_quotient_hausdorff_of_noetherian_completion\n    d.A d.𝔪 P", "proof_size_lean": 454, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 14, "proof_size_tex": 162, "effort_local": 0, "proof_size_tex_total": 17404, "proof_size_lean_total": 38862, "effort_total": 0}, "lem:bad_quotient_source_data_adic_completion_neighborhood_iinf_le_prime_source": {"id": "lem:bad_quotient_source_data_adic_completion_neighborhood_iinf_le_prime_source", "type": "lemma", "title": "Project-specific completion-neighborhood intersection", "chapter": "The Anderson counterexample", "statement": "For the Jensen source data,\n  \\(\\bigcap_n(P+\\mathfrak m^n\\widehat A)\\subseteq P\\).", "uses": ["lem:bad_quotient_source_data_adic_completion_quotient_hausdorff_source", "lem:adic_completion_neighborhood_iinf_le_prime_of_hausdorff"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.adicCompletion_neighborhood_iInf_le_prime_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Install the project-specific quotient-Hausdorff instance and apply the\n  checked Basic-level Hausdorff-to-intersection lemma.\n", "lean_source": "theorem BadQuotientSourceData.adicCompletion_neighborhood_iInf_le_prime_source\n    (d : BadQuotientSourceData)\n    (P : Ideal (AdicCompletion d.𝔪 d.A)) :\n    (⨅ n, P ⊔ adicCompletionPowerImage d.A d.𝔪 n) ≤ P := by\n  letI : IsNoetherianRing d.A := d.hNoeth\n  letI : IsLocalRing d.A := d.hLocal\n  letI : IsDomain d.A := d.hDomain\n  letI :\n      IsHausdorff (adicCompletionPowerImage d.A d.𝔪 1)\n        (AdicCompletion d.𝔪 d.A ⧸ P) :=\n    d.adicCompletion_quotient_hausdorff_source P\n  exact adicCompletion_neighborhood_iInf_le_prime_of_hausdorff d.A d.𝔪 P", "proof_size_lean": 553, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 13, "proof_size_tex": 125, "effort_local": 0, "proof_size_tex_total": 19835, "proof_size_lean_total": 46759, "effort_total": 0}, "lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_le_comap_source": {"id": "lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_le_comap_source", "type": "lemma", "title": "Project-specific contracted-chain intersection containment", "chapter": "The Anderson counterexample", "statement": "For the Jensen source data,\n  \\(\\bigcap_n I_n\\subseteq P\\cap A\\) for Farley's contraction chain.", "uses": ["lem:mem_bad_prime_contraction_chain", "lem:bad_quotient_source_data_adic_completion_neighborhood_iinf_le_prime_source"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.badPrimeContractionChain_iInf_le_comap_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Send an element of \\(\\bigcap I_n\\) into \\(\\widehat A\\), use the membership\n  characterization of \\(I_n\\), and then apply the project-specific\n  completion-neighborhood intersection containment.\n", "lean_source": "theorem BadQuotientSourceData.badPrimeContractionChain_iInf_le_comap_source\n    (d : BadQuotientSourceData)\n    (P : Ideal (AdicCompletion d.𝔪 d.A)) :\n    (⨅ n, badPrimeContractionChain d.A d.𝔪 P n) ≤\n      Ideal.comap (algebraMap d.A (AdicCompletion d.𝔪 d.A)) P := by\n  intro x hx\n  have hxhat :\n      algebraMap d.A (AdicCompletion d.𝔪 d.A) x ∈\n        ⨅ n, P ⊔ adicCompletionPowerImage d.A d.𝔪 n := by\n    rw [Ideal.mem_iInf]\n    intro n\n    exact (mem_badPrimeContractionChain d.A d.𝔪 P n x).mp\n      ((Ideal.mem_iInf.mp hx) n)\n  exact d.adicCompletion_neighborhood_iInf_le_prime_source P hxhat", "proof_size_lean": 598, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 12, "proof_size_tex": 193, "effort_local": 0, "proof_size_tex_total": 20207, "proof_size_lean_total": 47877, "effort_total": 0}, "lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_eq_comap_source": {"id": "lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_eq_comap_source", "type": "lemma", "title": "Project-specific contracted-chain intersection equality", "chapter": "The Anderson counterexample", "statement": "For the Jensen source data, Farley's contraction chain satisfies\n  \\(\\bigcap_n I_n=P\\cap A\\).", "uses": ["lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_le_comap_source", "lem:comap_le_bad_prime_contraction_chain_iinf"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.badPrimeContractionChain_iInf_eq_comap_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine the project-specific containment with the previously checked\n  general reverse containment.\n", "lean_source": "theorem BadQuotientSourceData.badPrimeContractionChain_iInf_eq_comap_source\n    (d : BadQuotientSourceData)\n    (P : Ideal (AdicCompletion d.𝔪 d.A)) :\n    (⨅ n, badPrimeContractionChain d.A d.𝔪 P n) =\n      Ideal.comap (algebraMap d.A (AdicCompletion d.𝔪 d.A)) P := by\n  exact le_antisymm\n    (d.badPrimeContractionChain_iInf_le_comap_source P)\n    (comap_le_badPrimeContractionChain_iInf d.A d.𝔪 P)", "proof_size_lean": 399, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 11, "proof_size_tex": 99, "effort_local": 0, "proof_size_tex_total": 20490, "proof_size_lean_total": 48848, "effort_total": 0}, "lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_eq_bot_source": {"id": "lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_eq_bot_source", "type": "lemma", "title": "Project-specific contracted-chain intersection is zero", "chapter": "The Anderson counterexample", "statement": "If a completion prime \\(P\\) has zero contraction, then Farley's contraction\n  chain has zero intersection.", "uses": ["lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_eq_comap_source"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.badPrimeContractionChain_iInf_eq_bot_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Rewrite the project-specific chain intersection as \\(P\\cap A\\), then use the\n  zero-contraction hypothesis.\n", "lean_source": "theorem BadQuotientSourceData.badPrimeContractionChain_iInf_eq_bot_source\n    (d : BadQuotientSourceData)\n    (P : Ideal (AdicCompletion d.𝔪 d.A))\n    (hPzero :\n      Ideal.comap (algebraMap d.A (AdicCompletion d.𝔪 d.A)) P = ⊥) :\n    (⨅ n, badPrimeContractionChain d.A d.𝔪 P n) = ⊥ := by\n  rw [d.badPrimeContractionChain_iInf_eq_comap_source P, hPzero]", "proof_size_lean": 352, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 10, "proof_size_tex": 107, "effort_local": 0, "proof_size_tex_total": 20597, "proof_size_lean_total": 49200, "effort_total": 0}, "lem:bad_quotient_source_data_adic_completion_bad_prime_to_bad_chain_source": {"id": "lem:bad_quotient_source_data_adic_completion_bad_prime_to_bad_chain_source", "type": "lemma", "title": "Project-specific bad completion prime gives a bad chain", "chapter": "The Anderson counterexample", "statement": "For the selected Jensen source data, a bad completion prime produces\n  Farley's forbidden descending chain.", "uses": ["lem:bad_quotient_source_data_bad_prime_contraction_chain_iinf_eq_bot_source", "lem:bad_prime_contraction_chain_antitone", "lem:bad_prime_contraction_chain_avoids_fixed_power", "lem:bad_quotient_source_data_adic_ideal_eq_maximal_ideal_source"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.adicCompletion_badPrime_to_badChain_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use the same explicit chain \\(I_n=(P+\\mathfrak m^n\\widehat A)\\cap A\\).\n  The antitonicity and fixed-power avoidance are the checked Basic lemmas; the\n  zero-intersection part now uses the project-specific Hausdorff quotient\n  route instead of the remaining generic source theorem.\n", "lean_source": "theorem BadQuotientSourceData.adicCompletion_badPrime_to_badChain_source\n    (d : BadQuotientSourceData) :\n    AdicCompletionBadPrime d.A d.𝔪 →\n      WeaklyQuasiCompleteBadChain d.A d.𝔪 := by\n  intro hBad\n  letI : IsNoetherianRing d.A := d.hNoeth\n  letI : IsLocalRing d.A := d.hLocal\n  letI : IsDomain d.A := d.hDomain\n  rcases hBad with ⟨P, hPprime, hPne, hPzero⟩\n  refine ⟨badPrimeContractionChain d.A d.𝔪 P, ?_, ?_, ?_⟩\n  · exact badPrimeContractionChain_antitone d.A d.𝔪 P\n  · exact d.badPrimeContractionChain_iInf_eq_bot_source P hPzero\n  · exact\n      badPrimeContractionChain_avoids_fixed_power_source d.A d.𝔪\n        d.adicIdeal_eq_maximalIdeal_source P hPprime hPne hPzero", "proof_size_lean": 681, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 1, "descendant_count": 9, "proof_size_tex": 280, "effort_local": 0, "proof_size_tex_total": 22884, "proof_size_lean_total": 55607, "effort_total": 0}, "lem:bad_quotient_source_data_weakly_quasi_complete_to_adic_completion_prime_contraction_source": {"id": "lem:bad_quotient_source_data_weakly_quasi_complete_to_adic_completion_prime_contraction_source", "type": "lemma", "title": "Project-specific weak completeness gives prime contraction", "chapter": "The Anderson counterexample", "statement": "For the selected Jensen source data, weak quasi-completeness implies the\n  adic-completion prime-contraction condition.", "uses": ["lem:bad_quotient_source_data_adic_completion_bad_prime_to_bad_chain_source", "lem:not_weakly_quasi_complete_iff_bad_chain", "lem:not_adic_completion_prime_contraction_condition_iff_bad_prime"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.weaklyQuasiComplete_to_adicCompletionPrimeContraction_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Argue by contradiction.  Failure of prime contraction gives a bad completion\n  prime; the project-specific previous lemma gives a bad descending chain; the\n  checked negation lemma says this contradicts the stored weak\n  quasi-completeness of \\(A\\).\n", "lean_source": "theorem BadQuotientSourceData.weaklyQuasiComplete_to_adicCompletionPrimeContraction_source\n    (d : BadQuotientSourceData) :\n    AdicCompletionPrimeContractionCondition d.A d.𝔪 := by\n  classical\n  by_contra hNot\n  have hBadPrime :\n      AdicCompletionBadPrime d.A d.𝔪 :=\n    (not_adicCompletionPrimeContractionCondition_iff_badPrime d.A d.𝔪).1 hNot\n  have hBadChain :\n      WeaklyQuasiCompleteBadChain d.A d.𝔪 :=\n    d.adicCompletion_badPrime_to_badChain_source hBadPrime\n  exact (not_weaklyQuasiComplete_iff_badChain d.A d.𝔪).2 hBadChain d.hWeak", "proof_size_lean": 546, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 249, "effort_local": 0, "proof_size_tex_total": 23643, "proof_size_lean_total": 56931, "effort_total": 0}, "lem:bad_quotient_source_data_quotient_adic_ideal_eq_maximal_ideal_of_source": {"id": "lem:bad_quotient_source_data_quotient_adic_ideal_eq_maximal_ideal_of_source", "type": "lemma", "title": "Maximal ideals map to maximal ideals under the quotient map", "chapter": "The Anderson counterexample", "statement": "If \\(\\mathfrak m\\) is the maximal ideal of \\(A\\), then its image in \\(A/q\\)\n  is the maximal ideal of the quotient local ring.", "uses": ["lem:bad_quotient_source_data_adic_ideal_eq_maximal_ideal_source", "lem:bad_quotient_source_data_quotient_is_local"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.quotient_adicIdeal_eq_maximalIdeal_of_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The quotient map \\(A\\to A/q\\) is a surjective local homomorphism.  Apply\n  Mathlib's `IsLocalRing.map_maximalIdeal_of_surjective`, then rewrite the\n  source maximal ideal by the supplied equality.\n", "lean_source": "theorem BadQuotientSourceData.quotient_adicIdeal_eq_maximalIdeal_of_source\n    (d : BadQuotientSourceData)\n    [IsLocalRing (d.A ⧸ d.q)]\n    (hMax : d.𝔪 = @IsLocalRing.maximalIdeal d.A inferInstance d.hLocal) :\n    Ideal.map (Ideal.Quotient.mk d.q) d.𝔪 =\n      IsLocalRing.maximalIdeal (d.A ⧸ d.q) := by\n  letI : IsLocalRing d.A := d.hLocal\n  letI : Nontrivial (d.A ⧸ d.q) := d.quotient_nontrivial\n  letI : IsLocalHom (Ideal.Quotient.mk d.q) := d.quotient_mk_isLocalHom\n  have hmap :\n      Ideal.map (Ideal.Quotient.mk d.q) (IsLocalRing.maximalIdeal d.A) =\n        IsLocalRing.maximalIdeal (d.A ⧸ d.q) :=\n    IsLocalRing.map_maximalIdeal_of_surjective\n      (Ideal.Quotient.mk d.q) Ideal.Quotient.mk_surjective\n  simpa [hMax] using hmap", "proof_size_lean": 736, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 13, "proof_size_tex": 196, "effort_local": 0, "proof_size_tex_total": 13319, "proof_size_lean_total": 24205, "effort_total": 0}, "lem:bad_quotient_source_data_quotient_adic_ideal_eq_maximal_ideal_source": {"id": "lem:bad_quotient_source_data_quotient_adic_ideal_eq_maximal_ideal_source", "type": "lemma", "title": "The quotient adic ideal is the quotient maximal ideal", "chapter": "The Anderson counterexample", "statement": "The ideal \\(\\mathfrak m(A/q)\\) used for the adic completion of \\(A/q\\) is\n  the maximal ideal of the quotient local ring.", "uses": ["lem:bad_quotient_source_data_adic_ideal_eq_maximal_ideal_source", "lem:bad_quotient_source_data_quotient_adic_ideal_eq_maximal_ideal_of_source"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.quotient_adicIdeal_eq_maximalIdeal_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply the checked quotient transport lemma to the recorded source equality\n  \\(\\mathfrak m=\\operatorname{maximalIdeal}(A)\\).\n", "lean_source": "theorem BadQuotientSourceData.quotient_adicIdeal_eq_maximalIdeal_source\n    (d : BadQuotientSourceData)\n    [IsLocalRing (d.A ⧸ d.q)] :\n    Ideal.map (Ideal.Quotient.mk d.q) d.𝔪 =\n      IsLocalRing.maximalIdeal (d.A ⧸ d.q) := by\n  exact\n    d.quotient_adicIdeal_eq_maximalIdeal_of_source\n      d.adicIdeal_eq_maximalIdeal_source", "proof_size_lean": 328, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 12, "proof_size_tex": 124, "effort_local": 0, "proof_size_tex_total": 13443, "proof_size_lean_total": 24533, "effort_total": 0}, "lem:quotient_map_sup_power": {"id": "lem:quotient_map_sup_power", "type": "lemma", "title": "Powers of the quotient maximal ideal", "chapter": "The Anderson counterexample", "statement": "For every \\(n\\), the image of \\(q+\\mathfrak m^n\\) in \\(A/q\\) is the\n  \\(n\\)-th power of the image of \\(\\mathfrak m\\).", "uses": ["def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.quotient_map_sup_power", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use `Ideal.map_sup`, the fact that \\(q\\) maps to zero in \\(A/q\\), and\n  `Ideal.map_pow`.\n", "lean_source": "theorem quotient_map_sup_power\n    (d : BadQuotientSourceData) (n : ℕ) :\n    Ideal.map (Ideal.Quotient.mk d.q) (d.q ⊔ d.𝔪 ^ n) =\n      (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n := by\n  rw [Ideal.map_sup, Ideal.map_quotient_self, bot_sup_eq, Ideal.map_pow]", "proof_size_lean": 257, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 38, "proof_size_tex": 88, "effort_local": 0, "proof_size_tex_total": 12865, "proof_size_lean_total": 22624, "effort_total": 0}, "def:quotient_power_quotient_equiv": {"id": "def:quotient_power_quotient_equiv", "type": "definition", "title": "Finite-level quotient equivalence for \\(q+\\mathfrak m^n\\)", "chapter": "The Anderson counterexample", "statement": "For every \\(n\\), there is a natural equivalence\n  \\[\n    A/(q+\\mathfrak m^n)\\cong\n      (A/q)/(\\mathfrak m(A/q))^n.\n  \\]", "uses": ["lem:quotient_sup_quotient_equiv", "lem:quotient_map_sup_power"], "lean_name": "Run202608192034.TODO.quotientPowerQuotientEquiv", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply the general quotient-by-sum equivalence to \\(I=q\\) and\n  \\(J=\\mathfrak m^n\\), then rewrite the image of \\(\\mathfrak m^n\\) as the\n  \\(n\\)-th power of the image of \\(\\mathfrak m\\).\n", "lean_source": "noncomputable def quotientPowerQuotientEquiv\n    (d : BadQuotientSourceData) (n : ℕ) :\n    d.A ⧸ (d.q ⊔ d.𝔪 ^ n) ≃+*\n      (d.A ⧸ d.q) ⧸\n        (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n :=\n  (quotientSupQuotientEquiv d.A d.q (d.𝔪 ^ n)).trans\n    (Ideal.quotEquivOfEq (by rw [Ideal.map_pow]))", "proof_size_lean": 294, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 37, "proof_size_tex": 184, "effort_local": 0, "proof_size_tex_total": 13339, "proof_size_lean_total": 23976, "effort_total": 0}, "lem:quotient_power_quotient_equiv_mk": {"id": "lem:quotient_power_quotient_equiv_mk", "type": "lemma", "title": "Finite-level equivalence on representatives", "chapter": "The Anderson counterexample", "statement": "The finite-level equivalence sends the class of \\(x\\in A\\) modulo\n  \\(q+\\mathfrak m^n\\) to the class of the class of \\(x\\) in \\(A/q\\).", "uses": ["def:quotient_power_quotient_equiv"], "lean_name": "Run202608192034.TODO.quotientPowerQuotientEquiv_mk", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the representative formula for the general quotient-by-sum\n  equivalence, followed by the power rewrite.\n", "lean_source": "@[simp]\ntheorem quotientPowerQuotientEquiv_mk\n    (d : BadQuotientSourceData) (n : ℕ) (x : d.A) :\n    quotientPowerQuotientEquiv d n (Ideal.Quotient.mk (d.q ⊔ d.𝔪 ^ n) x) =\n      Ideal.Quotient.mk ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n)\n        (Ideal.Quotient.mk d.q x) := by\n  simp [quotientPowerQuotientEquiv]", "proof_size_lean": 318, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 112, "effort_local": 0, "proof_size_tex_total": 13451, "proof_size_lean_total": 24294, "effort_total": 0}, "def:completed_ring_to_quotient_finite": {"id": "def:completed_ring_to_quotient_finite", "type": "definition", "title": "Finite components of the map to the quotient completion", "chapter": "The Anderson counterexample", "statement": "For every \\(n\\), the completed ring \\(\\widehat A\\) maps naturally to\n  \\((A/q)/(\\mathfrak m(A/q))^n\\).", "uses": ["def:quotient_power_quotient_equiv"], "lean_name": "Run202608192034.TODO.completedRingToQuotientFinite", "proved": false, "mathlib_ok": false, "proof_tex": "\n  First evaluate \\(\\widehat A\\) modulo \\(\\mathfrak m^n\\), then pass from\n  \\(A/\\mathfrak m^n\\) to \\(A/(q+\\mathfrak m^n)\\), and finally use the\n  finite-level quotient equivalence.\n", "lean_source": "noncomputable def completedRingToQuotientFinite\n    (d : BadQuotientSourceData) (n : ℕ) :\n    AdicCompletion d.𝔪 d.A →+*\n      (d.A ⧸ d.q) ⧸ (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n :=\n  (quotientPowerQuotientEquiv d n).toRingHom.comp\n    ((Ideal.Quotient.factor\n      (show d.𝔪 ^ n ≤ d.q ⊔ d.𝔪 ^ n by exact le_sup_right)).comp\n        (AdicCompletion.evalₐ d.𝔪 n).toRingHom)", "proof_size_lean": 378, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 4, "descendant_count": 35, "proof_size_tex": 177, "effort_local": 0, "proof_size_tex_total": 13516, "proof_size_lean_total": 24354, "effort_total": 0}, "lem:completed_ring_to_quotient_finite_of": {"id": "lem:completed_ring_to_quotient_finite_of", "type": "lemma", "title": "Finite components on representatives", "chapter": "The Anderson counterexample", "statement": "The finite component sends the image of \\(x\\in A\\) in \\(\\widehat A\\) to the\n  class of \\(x\\) in \\((A/q)/(\\mathfrak m(A/q))^n\\).", "uses": ["def:completed_ring_to_quotient_finite"], "lean_name": "Run202608192034.TODO.completedRingToQuotientFinite_of", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This follows from the representative formula for `AdicCompletion.evalₐ` and\n  the finite-level quotient equivalence.\n", "lean_source": "@[simp]\ntheorem completedRingToQuotientFinite_of\n    (d : BadQuotientSourceData) (n : ℕ) (x : d.A) :\n    completedRingToQuotientFinite d n (AdicCompletion.of d.𝔪 d.A x) =\n      Ideal.Quotient.mk ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n)\n        (Ideal.Quotient.mk d.q x) := by\n  simp [completedRingToQuotientFinite]", "proof_size_lean": 319, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 24, "proof_size_tex": 116, "effort_local": 0, "proof_size_tex_total": 13632, "proof_size_lean_total": 24673, "effort_total": 0}, "lem:quotient_module_level_to_ring_level_equiv_eval_map_of": {"id": "lem:quotient_module_level_to_ring_level_equiv_eval_map_of", "type": "lemma", "title": "Finite comparison on elements from \\(A\\)", "chapter": "The Anderson counterexample", "statement": "For an element \\(x\\in A\\), evaluating the completed module map and then\n  applying the finite comparison gives the same finite quotient class as\n  `completedRingToQuotientFinite`.", "uses": ["lem:completed_ring_to_quotient_finite_of", "lem:quotient_module_level_equiv_mk"], "lean_name": "Run202608192034.TODO.quotientModuleLevelToRingLevelEquiv_eval_map_of", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Rewrite the completion map and evaluation on elements from \\(A\\), then use\n  the representative formulas for the finite-level comparison and finite map.\n", "lean_source": "theorem quotientModuleLevelToRingLevelEquiv_eval_map_of\n    (d : BadQuotientSourceData) (n : ℕ) (x : d.A) :\n    quotientModuleLevelToRingLevelEquiv d n\n        (AdicCompletion.eval d.𝔪 (d.A ⧸ d.q) n\n          (AdicCompletion.map d.𝔪 (quotientLinearMap d)\n            (AdicCompletion.of d.𝔪 d.A x))) =\n      completedRingToQuotientFinite d n (AdicCompletion.of d.𝔪 d.A x) := by\n  rw [AdicCompletion.map_of]\n  rw [AdicCompletion.eval_of]\n  change quotientModuleLevelEquiv d n\n      (Submodule.Quotient.mk\n        (p := d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))\n        ((quotientLinearMap d) x)) =\n    completedRingToQuotientFinite d n (AdicCompletion.of d.𝔪 d.A x)\n  rw [quotientModuleLevelEquiv_mk]\n  rw [completedRingToQuotientFinite_of]\n  rfl", "proof_size_lean": 745, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 152, "effort_local": 0, "proof_size_tex_total": 14171, "proof_size_lean_total": 26680, "effort_total": 0}, "lem:quotient_module_level_to_ring_level_equiv_eval_map": {"id": "lem:quotient_module_level_to_ring_level_equiv_eval_map", "type": "lemma", "title": "Finite comparison for all completed elements", "chapter": "The Anderson counterexample", "statement": "For every element of \\(\\widehat A\\), evaluating the completed module quotient\n  map and applying the finite comparison agrees with\n  `completedRingToQuotientFinite`.", "uses": ["def:completed_ring_to_quotient_finite", "def:quotient_module_level_to_ring_level_equiv"], "lean_name": "Run202608192034.TODO.quotientModuleLevelToRingLevelEquiv_eval_map", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Prove the identity by induction on the Cauchy-sequence representative of an\n  element of the adic completion; the finite-level statement reduces to the\n  representative formula.\n", "lean_source": "theorem quotientModuleLevelToRingLevelEquiv_eval_map\n    (d : BadQuotientSourceData) (n : ℕ)\n    (x : AdicCompletion d.𝔪 d.A) :\n    quotientModuleLevelToRingLevelEquiv d n\n        (AdicCompletion.eval d.𝔪 (d.A ⧸ d.q) n\n          (AdicCompletion.map d.𝔪 (quotientLinearMap d) x)) =\n      completedRingToQuotientFinite d n x := by\n  induction x using AdicCompletion.induction_on with\n  | h a =>\n      simp only [AdicCompletion.map_mk, AdicCompletion.coe_eval,\n        AdicCompletion.mk_apply_coe, AdicCompletion.AdicCauchySequence.map_apply_coe,\n        Submodule.mkQ_apply]\n      change quotientModuleLevelEquiv d n\n          (Submodule.Quotient.mk\n            (p := d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))\n            (Ideal.Quotient.mk d.q (a n))) =\n        Ideal.Quotient.mk ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n)\n          (Ideal.Quotient.mk d.q (a n))\n      rw [quotientModuleLevelEquiv_mk]\n      rfl", "proof_size_lean": 914, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 23, "proof_size_tex": 177, "effort_local": 0, "proof_size_tex_total": 14083, "proof_size_lean_total": 26463, "effort_total": 0}, "lem:completed_ring_to_quotient_finite_surjective": {"id": "lem:completed_ring_to_quotient_finite_surjective", "type": "lemma", "title": "Finite components are surjective", "chapter": "The Anderson counterexample", "statement": "Each finite component\n  \\(\\widehat A\\to (A/q)/(\\mathfrak m(A/q))^n\\) is surjective.", "uses": ["def:completed_ring_to_quotient_finite", "def:quotient_power_quotient_equiv"], "lean_name": "Run202608192034.TODO.completedRingToQuotientFinite_surjective", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Pull a target element back along the finite quotient equivalence, lift it\n  through the quotient map, and then use the surjectivity of evaluation from\n  the adic completion at finite level.\n", "lean_source": "theorem completedRingToQuotientFinite_surjective\n    (d : BadQuotientSourceData) (n : ℕ) :\n    Function.Surjective (completedRingToQuotientFinite d n) := by\n  intro y\n  obtain ⟨z, hz⟩ := (quotientPowerQuotientEquiv d n).surjective y\n  obtain ⟨u, hu⟩ :=\n    Ideal.Quotient.factor_surjective\n      (show d.𝔪 ^ n ≤ d.q ⊔ d.𝔪 ^ n by exact le_sup_right) z\n  obtain ⟨x, hx⟩ := AdicCompletion.surjective_evalₐ d.𝔪 n u\n  refine ⟨x, ?_⟩\n  simp [completedRingToQuotientFinite, hx, hu, hz]", "proof_size_lean": 478, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 189, "effort_local": 0, "proof_size_tex_total": 13705, "proof_size_lean_total": 24832, "effort_total": 0}, "lem:completed_ring_to_quotient_finite_compatible": {"id": "lem:completed_ring_to_quotient_finite_compatible", "type": "lemma", "title": "Finite components are compatible", "chapter": "The Anderson counterexample", "statement": "The finite maps \\(\\widehat A\\to (A/q)/(\\mathfrak m(A/q))^n\\) commute with\n  the transition maps in the quotient completion inverse system.", "uses": ["def:completed_ring_to_quotient_finite"], "lean_name": "Run202608192034.TODO.completedRingToQuotientFinite_compatible", "proved": false, "mathlib_ok": false, "proof_tex": "\n  It suffices to check a Cauchy sequence representative of an element of\n  \\(\\widehat A\\).  The Cauchy condition says the \\(m\\)-th and \\(n\\)-th terms\n  differ by an element of \\(\\mathfrak m^m\\); mapping to \\(A/q\\) puts the\n  difference in \\((\\mathfrak m(A/q))^m\\).\n", "lean_source": "theorem completedRingToQuotientFinite_compatible\n    (d : BadQuotientSourceData) {m n : ℕ} (hmn : m ≤ n) :\n    (Ideal.Quotient.factorPow\n      (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) hmn).comp\n        (completedRingToQuotientFinite d n) =\n      completedRingToQuotientFinite d m := by\n  ext x\n  induction x using AdicCompletion.induction_on with\n  | h a =>\n      suffices\n          Ideal.Quotient.mk ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ m)\n              (Ideal.Quotient.mk d.q (a n)) =\n            Ideal.Quotient.mk ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ m)\n              (Ideal.Quotient.mk d.q (a m)) by\n        simpa [completedRingToQuotientFinite] using this\n      rw [Ideal.Quotient.eq]\n      change Ideal.Quotient.mk d.q (a n) - Ideal.Quotient.mk d.q (a m) ∈\n        (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ m\n      rw [← map_sub]\n      rw [← Ideal.map_pow]\n      have hmSub : a n - a m ∈ (d.𝔪 ^ m • ⊤ : Submodule d.A d.A) :=\n        SModEq.sub_mem.mp (a.property hmn).symm\n      have hmIdeal : a n - a m ∈ d.𝔪 ^ m := by\n        simpa using hmSub\n      exact Ideal.mem_map_of_mem (Ideal.Quotient.mk d.q) hmIdeal", "proof_size_lean": 1127, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 30, "proof_size_tex": 262, "effort_local": 0, "proof_size_tex_total": 13778, "proof_size_lean_total": 25481, "effort_total": 0}, "def:completed_ring_to_quotient_completion": {"id": "def:completed_ring_to_quotient_completion", "type": "definition", "title": "The natural map to the quotient completion", "chapter": "The Anderson counterexample", "statement": "The compatible finite components induce a natural ring homomorphism\n  \\[\n    \\widehat A\\to \\widehat{A/q}.\n  \\]", "uses": ["lem:completed_ring_to_quotient_finite_compatible"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply `AdicCompletion.liftRingHom` to the compatible family of finite-level\n  ring maps.\n", "lean_source": "noncomputable def completedRingToQuotientCompletion\n    (d : BadQuotientSourceData) :\n    AdicCompletion d.𝔪 d.A →+* quotientAdicCompletion d :=\n  AdicCompletion.liftRingHom\n    (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪)\n    (fun n => completedRingToQuotientFinite d n)\n    (fun hmn => completedRingToQuotientFinite_compatible d hmn)", "proof_size_lean": 330, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 29, "proof_size_tex": 88, "effort_local": 0, "proof_size_tex_total": 13866, "proof_size_lean_total": 25811, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_eval": {"id": "lem:completed_ring_to_quotient_completion_eval", "type": "lemma", "title": "Evaluating the natural map to the quotient completion", "chapter": "The Anderson counterexample", "statement": "Evaluation of the natural map \\(\\widehat A\\to\\widehat{A/q}\\) at level \\(n\\)\n  recovers the \\(n\\)-th finite component.", "uses": ["def:completed_ring_to_quotient_completion"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_eval", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the evaluation formula for `AdicCompletion.liftRingHom`.\n", "lean_source": "@[simp]\ntheorem completedRingToQuotientCompletion_eval\n    (d : BadQuotientSourceData) (n : ℕ)\n    (x : AdicCompletion d.𝔪 d.A) :\n    AdicCompletion.evalₐ (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) n\n        (completedRingToQuotientCompletion d x) =\n      completedRingToQuotientFinite d n x := by\n  exact AdicCompletion.evalₐ_liftRingHom\n    (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪)\n    (fun n => completedRingToQuotientFinite d n)\n    (fun hmn => completedRingToQuotientFinite_compatible d hmn) n x", "proof_size_lean": 496, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 28, "proof_size_tex": 64, "effort_local": 0, "proof_size_tex_total": 13930, "proof_size_lean_total": 26307, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_of_eval": {"id": "lem:completed_ring_to_quotient_completion_of_eval", "type": "lemma", "title": "The natural map on elements from \\(A\\)", "chapter": "The Anderson counterexample", "statement": "If \\(x\\in A\\), then the level-\\(n\\) evaluation of its image in\n  \\(\\widehat{A/q}\\) is the class of \\(x\\) modulo \\(q\\) and\n  \\((\\mathfrak m(A/q))^n\\).", "uses": ["lem:completed_ring_to_quotient_completion_eval", "lem:completed_ring_to_quotient_finite_of"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_of_eval", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine the evaluation formula with the finite-level representative formula.\n", "lean_source": "@[simp]\ntheorem completedRingToQuotientCompletion_of_eval\n    (d : BadQuotientSourceData) (n : ℕ) (x : d.A) :\n    AdicCompletion.evalₐ (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) n\n        (completedRingToQuotientCompletion d (AdicCompletion.of d.𝔪 d.A x)) =\n      Ideal.Quotient.mk ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n)\n        (Ideal.Quotient.mk d.q x) := by\n  simp [completedRingToQuotientCompletion_eval]", "proof_size_lean": 412, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 22, "proof_size_tex": 76, "effort_local": 0, "proof_size_tex_total": 14122, "proof_size_lean_total": 27038, "effort_total": 0}, "lem:quotient_module_completion_to_quotient_adic_completion_comp_map": {"id": "lem:quotient_module_completion_to_quotient_adic_completion_comp_map", "type": "lemma", "title": "The two completion maps agree", "chapter": "The Anderson counterexample", "statement": "The comparison map from module completion to intrinsic quotient completion,\n  composed with the completed quotient map, is the natural map\n  \\(\\widehat A\\to\\widehat{A/q}\\).", "uses": ["lem:quotient_module_level_to_adic_level_equiv_eq_factor_ring_level", "lem:quotient_module_level_to_ring_level_equiv_eval_map", "lem:completed_ring_to_quotient_completion_eval"], "lean_name": "Run202608192034.TODO.quotientModuleCompletionToQuotientAdicCompletion_comp_map", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use adic-completion extensionality.  At level \\(n\\), rewrite the adic-level\n  comparison through the ring-level factor map, use the finite comparison\n  identity, and identify the result with the evaluation of\n  `completedRingToQuotientCompletion`.\n", "lean_source": "theorem quotientModuleCompletionToQuotientAdicCompletion_comp_map\n    (d : BadQuotientSourceData)\n    (x : AdicCompletion d.𝔪 d.A) :\n    quotientModuleCompletionToQuotientAdicCompletion d\n        (AdicCompletion.map d.𝔪 (quotientLinearMap d) x) =\n      completedRingToQuotientCompletion d x := by\n  apply AdicCompletion.ext\n  intro n\n  change quotientModuleLevelToAdicLevelEquiv d n\n      ((AdicCompletion.map d.𝔪 (quotientLinearMap d) x).val n) =\n    (completedRingToQuotientCompletion d x).val n\n  rw [quotientModuleLevelToAdicLevelEquiv_eq_factor_ringLevel]\n  change Ideal.Quotient.factor\n      (show (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n ≤\n        ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n •\n          (⊤ : Ideal (d.A ⧸ d.q))) by\n        exact le_of_eq (by ext y; simp))\n      (quotientModuleLevelToRingLevelEquiv d n\n        (AdicCompletion.eval d.𝔪 (d.A ⧸ d.q) n\n          (AdicCompletion.map d.𝔪 (quotientLinearMap d) x))) =\n    (completedRingToQuotientCompletion d x).val n\n  rw [quotientModuleLevelToRingLevelEquiv_eval_map]\n  have h :=\n    AdicCompletion.factor_evalₐ_eq_eval\n      (I := Ideal.map (Ideal.Quotient.mk d.q) d.𝔪)\n      (x := completedRingToQuotientCompletion d x)\n      (n := n)\n      (show (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n ≤\n        (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n • ⊤ by\n        exact le_of_eq (by ext y; simp))\n  rw [completedRingToQuotientCompletion_eval] at h\n  simpa [AdicCompletion.eval_apply] using h.symm", "proof_size_lean": 1469, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 2, "descendant_count": 22, "proof_size_tex": 247, "effort_local": 0, "proof_size_tex_total": 15085, "proof_size_lean_total": 31431, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_surjective": {"id": "lem:completed_ring_to_quotient_completion_surjective", "type": "lemma", "title": "The natural map to the quotient completion is surjective", "chapter": "The Anderson counterexample", "statement": "The natural map \\(\\widehat A\\to\\widehat{A/q}\\) is surjective.", "uses": ["lem:quotient_completion_map_surjective", "lem:quotient_module_completion_to_quotient_adic_completion_surjective", "lem:quotient_module_completion_to_quotient_adic_completion_comp_map"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_surjective", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Given a point of the intrinsic quotient completion, lift it through the\n  comparison equivalence to the module completion, then lift that through the\n  completed quotient map \\( \\widehat A\\to\\widehat{A/q}\\) at the module level.\n", "lean_source": "theorem completedRingToQuotientCompletion_surjective\n    (d : BadQuotientSourceData) :\n    Function.Surjective (completedRingToQuotientCompletion d) := by\n  intro y\n  obtain ⟨z, hz⟩ :=\n    quotientModuleCompletionToQuotientAdicCompletion_surjective d y\n  obtain ⟨x, hx⟩ := quotient_completion_map_surjective d z\n  refine ⟨x, ?_⟩\n  rw [← quotientModuleCompletionToQuotientAdicCompletion_comp_map d x]\n  rw [hx, hz]", "proof_size_lean": 413, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 2, "descendant_count": 17, "proof_size_tex": 227, "effort_local": 0, "proof_size_tex_total": 16228, "proof_size_lean_total": 35172, "effort_total": 0}, "lem:quotient_completion_module_exact": {"id": "lem:quotient_completion_module_exact", "type": "lemma", "title": "Exactness after completing the quotient sequence", "chapter": "The Anderson counterexample", "statement": "Completing the exact sequence \\(q\\to A\\to A/q\\) remains exact at the completed\n  middle term.", "uses": ["lem:quotient_mk_linear_surjective", "def:quotient_linear_map"], "lean_name": "Run202608192034.TODO.quotient_completion_module_exact", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use `LinearMap.exact_subtype_mkQ` for the exactness of\n  \\(q\\to A\\to A/q\\), then apply Mathlib's\n  `AdicCompletion.map_exact` over the Noetherian ring \\(A\\).\n", "lean_source": "theorem quotient_completion_module_exact\n    (d : BadQuotientSourceData) :\n    Function.Exact\n      (AdicCompletion.map d.𝔪 (d.q.subtype : d.q →ₗ[d.A] d.A))\n      (AdicCompletion.map d.𝔪 (quotientLinearMap d)) := by\n  letI : IsNoetherianRing d.A := d.hNoeth\n  exact\n    AdicCompletion.map_exact\n      (I := d.𝔪)\n      (f := (d.q.subtype : d.q →ₗ[d.A] d.A))\n      (g := quotientLinearMap d)\n      (Submodule.injective_subtype d.q)\n      (by\n        simpa [quotientLinearMap, Ideal.Quotient.mkₐ_eq_mk] using\n          (LinearMap.exact_subtype_mkQ d.q))\n      (quotient_mk_linear_surjective d)", "proof_size_lean": 590, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 19, "proof_size_tex": 157, "effort_local": 0, "proof_size_tex_total": 13097, "proof_size_lean_total": 23344, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_ker_le_completed_submodule_range": {"id": "lem:completed_ring_to_quotient_completion_ker_le_completed_submodule_range", "type": "lemma", "title": "The kernel lies in the completed submodule image", "chapter": "The Anderson counterexample", "statement": "The kernel of the parent map\n  \\(\\widehat A\\to\\widehat{A/q}\\) is contained in the range of the completed\n  inclusion \\(\\widehat q\\to\\widehat A\\).", "uses": ["lem:quotient_completion_module_exact", "lem:quotient_module_completion_to_quotient_adic_completion_comp_map", "lem:quotient_module_completion_to_quotient_adic_completion_left_inverse"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_ker_le_completedSubmoduleRange", "proved": false, "mathlib_ok": false, "proof_tex": "\n  If an element maps to zero in the intrinsic quotient completion, use the\n  comparison equivalence to see that it maps to zero under the completed\n  \\(A\\)-module quotient map.  Exactness of the completed sequence then puts it\n  in the range of the completed inclusion of \\(q\\).\n", "lean_source": "theorem completedRingToQuotientCompletion_ker_le_completedSubmoduleRange\n    (d : BadQuotientSourceData) :\n    RingHom.ker (completedRingToQuotientCompletion d) ≤\n      LinearMap.range\n        (AdicCompletion.map d.𝔪 (d.q.subtype : d.q →ₗ[d.A] d.A)) := by\n  intro x hx\n  have hExact := quotient_completion_module_exact d\n  have hcomp :\n      quotientModuleCompletionToQuotientAdicCompletion d\n          (AdicCompletion.map d.𝔪 (quotientLinearMap d) x) = 0 := by\n    rw [quotientModuleCompletionToQuotientAdicCompletion_comp_map d x]\n    exact hx\n  have hzero :\n      quotientAdicCompletionToQuotientModuleCompletion d\n          (0 : quotientAdicCompletion d) = 0 := by\n    ext n\n    rfl\n  have hxmap :\n      AdicCompletion.map d.𝔪 (quotientLinearMap d) x = 0 := by\n    have h := congrArg (quotientAdicCompletionToQuotientModuleCompletion d) hcomp\n    rw [quotientModuleCompletionToQuotientAdicCompletion_leftInverse d\n      (AdicCompletion.map d.𝔪 (quotientLinearMap d) x)] at h\n    simpa [hzero] using h\n  simpa [LinearMap.mem_range] using (hExact x).mp hxmap", "proof_size_lean": 1060, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 1, "descendant_count": 18, "proof_size_tex": 276, "effort_local": 0, "proof_size_tex_total": 16292, "proof_size_lean_total": 35912, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_kernel_contains_completed_q": {"id": "lem:completed_ring_to_quotient_completion_kernel_contains_completed_q", "type": "lemma", "title": "\\(q\\widehat A\\) is in the kernel", "chapter": "The Anderson counterexample", "statement": "The extended ideal \\(q\\widehat A\\) is contained in the kernel of\n  \\(\\widehat A\\to\\widehat{A/q}\\).", "uses": ["lem:completed_ring_to_quotient_completion_of_eval"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_ker_contains_completed_q", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Check the claim on generators coming from \\(q\\).  At every finite level their\n  image in \\(A/q\\) is zero, hence the element is zero in the quotient\n  completion by extensionality of adic completions.\n", "lean_source": "theorem completedRingToQuotientCompletion_ker_contains_completed_q\n    (d : BadQuotientSourceData) :\n    Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q ≤\n      RingHom.ker (completedRingToQuotientCompletion d) := by\n  rw [Ideal.map_le_iff_le_comap]\n  intro x hx\n  change\n    completedRingToQuotientCompletion d\n      (algebraMap d.A (AdicCompletion d.𝔪 d.A) x) = 0\n  apply AdicCompletion.ext_evalₐ\n  intro n\n  rw [show algebraMap d.A (AdicCompletion d.𝔪 d.A) x =\n    AdicCompletion.of d.𝔪 d.A x by rfl]\n  rw [completedRingToQuotientCompletion_of_eval]\n  have hxmap : Ideal.Quotient.mk d.q x = 0 :=\n    Ideal.Quotient.eq_zero_iff_mem.mpr hx\n  simpa [hxmap] using\n    (map_zero\n      (AdicCompletion.evalₐ\n        (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) n)).symm", "proof_size_lean": 769, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 21, "proof_size_tex": 199, "effort_local": 0, "proof_size_tex_total": 14321, "proof_size_lean_total": 27807, "effort_total": 0}, "def:completed_quotient_to_quotient_completion": {"id": "def:completed_quotient_to_quotient_completion", "type": "definition", "title": "The descended map from the completed quotient", "chapter": "The Anderson counterexample", "statement": "The containment \\(q\\widehat A\\subseteq\\ker(\\widehat A\\to\\widehat{A/q})\\)\n  gives a descended map\n  \\[\n    \\widehat A/q\\widehat A\\to\\widehat{A/q}.\n  \\]", "uses": ["lem:completed_ring_to_quotient_completion_kernel_contains_completed_q"], "lean_name": "Run202608192034.TODO.completedQuotientToQuotientCompletion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply the universal property of quotient rings.\n", "lean_source": "noncomputable def completedQuotientToQuotientCompletion\n    (d : BadQuotientSourceData) :\n    (AdicCompletion d.𝔪 d.A ⧸\n      Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q)\n      →+* quotientAdicCompletion d :=\n  Ideal.Quotient.lift\n    (Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q)\n    (completedRingToQuotientCompletion d)\n    (fun _ hx =>\n      (completedRingToQuotientCompletion_ker_contains_completed_q d hx))", "proof_size_lean": 436, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 17, "proof_size_tex": 47, "effort_local": 0, "proof_size_tex_total": 14368, "proof_size_lean_total": 28243, "effort_total": 0}, "lem:completed_quotient_to_quotient_completion_mk": {"id": "lem:completed_quotient_to_quotient_completion_mk", "type": "lemma", "title": "The descended map on representatives", "chapter": "The Anderson counterexample", "statement": "On a representative \\(x\\in\\widehat A\\), the descended map is the natural map\n  \\(\\widehat A\\to\\widehat{A/q}\\).", "uses": ["def:completed_quotient_to_quotient_completion"], "lean_name": "Run202608192034.TODO.completedQuotientToQuotientCompletion_mk", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This follows by unfolding the quotient lift.\n", "lean_source": "@[simp]\ntheorem completedQuotientToQuotientCompletion_mk\n    (d : BadQuotientSourceData) (x : AdicCompletion d.𝔪 d.A) :\n    completedQuotientToQuotientCompletion d\n        (Ideal.Quotient.mk\n          (Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q) x) =\n      completedRingToQuotientCompletion d x := by\n  rfl", "proof_size_lean": 319, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 44, "effort_local": 0, "proof_size_tex_total": 14412, "proof_size_lean_total": 28562, "effort_total": 0}, "def:completed_quotient_map_source_facts": {"id": "def:completed_quotient_map_source_facts", "type": "definition", "title": "Source facts for the completion-quotient map", "chapter": "The Anderson counterexample", "statement": "Record the two exactness facts needed for completion commuting with quotient:\n  the natural map \\(\\widehat A\\to\\widehat{A/q}\\) is surjective, and its kernel\n  is contained in \\(q\\widehat A\\).", "uses": ["def:completed_ring_to_quotient_completion", "lem:completed_ring_to_quotient_completion_kernel_contains_completed_q"], "lean_name": "Run202608192034.TODO.CompletedQuotientMapSourceFacts", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This structure isolates the two nontrivial halves of the exactness theorem\n  before they are used to prove bijectivity of the descended map.\n", "lean_source": "structure CompletedQuotientMapSourceFacts\n    (d : BadQuotientSourceData) : Prop where\n  completedRing_surjective :\n    Function.Surjective (completedRingToQuotientCompletion d)\n  completedRing_ker_le_completed_q :\n    RingHom.ker (completedRingToQuotientCompletion d) ≤\n      Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q", "proof_size_lean": 332, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 1, "proof_size_tex": 140, "effort_local": 0, "proof_size_tex_total": 14461, "proof_size_lean_total": 28139, "effort_total": 0}, "lem:completed_quotient_map_source_facts_source": {"id": "lem:completed_quotient_map_source_facts_source", "type": "lemma", "title": "Completion-quotient source facts", "chapter": "The Anderson counterexample", "statement": "Package the now-checked surjectivity of\n  \\(\\widehat A\\to\\widehat{A/q}\\) with the remaining source kernel\n  containment.", "uses": ["def:completed_quotient_map_source_facts", "lem:completed_ring_to_quotient_completion_surjective", "lem:completed_ring_to_quotient_completion_ker_le_completed_q_source"], "lean_name": "Run202608192034.TODO.completedQuotientMapSourceFacts_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Fill the surjectivity field using\n  \\cref{lem:completed_ring_to_quotient_completion_surjective}; the only\n  remaining source input is the reverse kernel containment.\n", "lean_source": "theorem completedQuotientMapSourceFacts_source\n    (d : BadQuotientSourceData) :\n    CompletedQuotientMapSourceFacts d :=\n  { completedRing_surjective := completedRingToQuotientCompletion_surjective d\n    completedRing_ker_le_completed_q :=\n      completedRingToQuotientCompletion_ker_le_completed_q_source d }", "proof_size_lean": 310, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 165, "effort_local": 0, "proof_size_tex_total": 18193, "proof_size_lean_total": 42343, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_surjective_source": {"id": "lem:completed_ring_to_quotient_completion_surjective_source", "type": "lemma", "title": "The natural completion-to-quotient-completion map is surjective", "chapter": "The Anderson counterexample", "statement": "The natural map \\(\\widehat A\\to\\widehat{A/q}\\) is surjective.", "uses": ["lem:completed_ring_to_quotient_completion_surjective"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_surjective_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the checked surjectivity theorem, kept under the earlier source-name\n  interface for downstream compatibility.\n", "lean_source": "theorem completedRingToQuotientCompletion_surjective_source\n    (d : BadQuotientSourceData) :\n    Function.Surjective (completedRingToQuotientCompletion d) :=\n  completedRingToQuotientCompletion_surjective d", "proof_size_lean": 207, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 15, "proof_size_tex": 118, "effort_local": 0, "proof_size_tex_total": 16346, "proof_size_lean_total": 35379, "effort_total": 0}, "lem:completed_quotient_to_quotient_completion_surjective": {"id": "lem:completed_quotient_to_quotient_completion_surjective", "type": "lemma", "title": "The descended map is surjective", "chapter": "The Anderson counterexample", "statement": "The descended map\n  \\[\n    \\widehat A/q\\widehat A\\to\\widehat{A/q}\n  \\]\n  is surjective.", "uses": ["def:completed_quotient_to_quotient_completion", "lem:completed_ring_to_quotient_completion_surjective_source"], "lean_name": "Run202608192034.TODO.completedQuotientToQuotientCompletion_surjective", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Lift a preimage along \\(\\widehat A\\to\\widehat{A/q}\\), then pass it to the\n  quotient \\(\\widehat A/q\\widehat A\\).\n", "lean_source": "theorem completedQuotientToQuotientCompletion_surjective\n    (d : BadQuotientSourceData) :\n    Function.Surjective (completedQuotientToQuotientCompletion d) := by\n  intro y\n  rcases completedRingToQuotientCompletion_surjective_source d y with ⟨x, rfl⟩\n  exact\n    ⟨Ideal.Quotient.mk\n      (Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q) x,\n      rfl⟩", "proof_size_lean": 360, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 14, "proof_size_tex": 112, "effort_local": 0, "proof_size_tex_total": 16896, "proof_size_lean_total": 37675, "effort_total": 0}, "lem:completed_ideal_tensor_image_le_completed_q": {"id": "lem:completed_ideal_tensor_image_le_completed_q", "type": "lemma", "title": "The tensor image lies in the extended ideal", "chapter": "The Anderson counterexample", "statement": "The image of the tensor presentation\n  \\(\\widehat A\\otimes_A q\\to \\widehat A\\) lands in the extended ideal\n  \\(q\\widehat A\\).", "uses": ["def:quotient_linear_map"], "lean_name": "Run202608192034.TODO.completedIdealTensorImage_le_completed_q", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use tensor induction.  The pure tensor case is\n  \\(r\\otimes x\\mapsto r\\cdot x\\), which lies in the ideal generated by the\n  image of \\(q\\); zero and addition follow from the ideal laws and linearity.\n", "lean_source": "theorem completedIdealTensorImage_le_completed_q\n    (d : BadQuotientSourceData)\n    (t : TensorProduct d.A (AdicCompletion d.𝔪 d.A) d.q) :\n    AdicCompletion.ofTensorProduct d.𝔪 d.A\n        (TensorProduct.AlgebraTensorModule.map\n          (LinearMap.id :\n            AdicCompletion d.𝔪 d.A →ₗ[AdicCompletion d.𝔪 d.A]\n              AdicCompletion d.𝔪 d.A)\n          (d.q.subtype : d.q →ₗ[d.A] d.A) t) ∈\n      Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q := by\n  induction t using TensorProduct.induction_on with\n  | zero =>\n      exact Ideal.zero_mem _\n  | tmul r x =>\n      simp only [TensorProduct.AlgebraTensorModule.map_tmul,\n        LinearMap.id_coe, id_eq, AdicCompletion.ofTensorProduct_tmul]\n      change r * algebraMap d.A (AdicCompletion d.𝔪 d.A) (x : d.A) ∈\n        Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q\n      exact Ideal.mul_mem_left _ r (Ideal.mem_map_of_mem _ x.property)\n  | add x y hx hy =>\n      have hinner :\n          (TensorProduct.AlgebraTensorModule.map\n            (LinearMap.id :\n              AdicCompletion d.𝔪 d.A →ₗ[AdicCompletion d.𝔪 d.A]\n                AdicCompletion d.𝔪 d.A)\n            (d.q.subtype : d.q →ₗ[d.A] d.A)) (x + y) =\n          (TensorProduct.AlgebraTensorModule.map\n            (LinearMap.id :\n              AdicCompletion d.𝔪 d.A →ₗ[AdicCompletion d.𝔪 d.A]\n                AdicCompletion d.𝔪 d.A)\n            (d.q.subtype : d.q →ₗ[d.A] d.A)) x +\n          (TensorProduct.AlgebraTensorModule.map\n            (LinearMap.id :\n              AdicCompletion d.𝔪 d.A →ₗ[AdicCompletion d.𝔪 d.A]\n                AdicCompletion d.𝔪 d.A)\n            (d.q.subtype : d.q →ₗ[d.A] d.A)) y := by\n        exact map_add _ x y\n      rw [hinner]\n      rw [LinearMap.map_add]\n      exact Ideal.add_mem _ hx hy", "proof_size_lean": 1764, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 19, "proof_size_tex": 199, "effort_local": 0, "proof_size_tex_total": 13058, "proof_size_lean_total": 24254, "effort_total": 0}, "lem:completed_submodule_range_le_completed_q": {"id": "lem:completed_submodule_range_le_completed_q", "type": "lemma", "title": "The completed submodule image lies in the extended ideal", "chapter": "The Anderson counterexample", "statement": "The range of the completed inclusion\n  \\(\\widehat q\\to\\widehat A\\) is contained in \\(q\\widehat A\\).", "uses": ["lem:completed_ideal_tensor_image_le_completed_q"], "lean_name": "Run202608192034.TODO.completedSubmoduleRange_le_completed_q", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Since \\(q\\) is a finitely generated \\(A\\)-module over the Noetherian ring\n  \\(A\\), Mathlib's tensor presentation of adic completion is surjective on\n  \\(\\widehat q\\).  Naturality of that tensor presentation reduces the claim to\n  \\cref{lem:completed_ideal_tensor_image_le_completed_q}.\n", "lean_source": "theorem completedSubmoduleRange_le_completed_q\n    (d : BadQuotientSourceData) :\n    LinearMap.range\n        (AdicCompletion.map d.𝔪 (d.q.subtype : d.q →ₗ[d.A] d.A)) ≤\n      Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q := by\n  letI : IsNoetherianRing d.A := d.hNoeth\n  intro y hy\n  obtain ⟨z, rfl⟩ := (LinearMap.mem_range).mp hy\n  letI : Module.Finite d.A d.q := inferInstance\n  obtain ⟨t, ht⟩ :=\n    AdicCompletion.ofTensorProduct_surjective_of_finite d.𝔪 d.q z\n  rw [← ht]\n  have hnat :=\n    congrFun\n      (congrArg DFunLike.coe\n        (AdicCompletion.ofTensorProduct_naturality d.𝔪\n          (d.q.subtype : d.q →ₗ[d.A] d.A))) t\n  change\n      ((AdicCompletion.map d.𝔪 (d.q.subtype : d.q →ₗ[d.A] d.A)) ∘ₗ\n        AdicCompletion.ofTensorProduct d.𝔪 d.q) t ∈\n      Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q\n  rw [hnat]\n  exact completedIdealTensorImage_le_completed_q d t", "proof_size_lean": 898, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 18, "proof_size_tex": 285, "effort_local": 0, "proof_size_tex_total": 13343, "proof_size_lean_total": 25152, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_ker_le_completed_q_source": {"id": "lem:completed_ring_to_quotient_completion_ker_le_completed_q_source", "type": "lemma", "title": "The reverse kernel containment", "chapter": "The Anderson counterexample", "statement": "The kernel of \\(\\widehat A\\to\\widehat{A/q}\\) is contained in\n  \\(q\\widehat A\\).", "uses": ["lem:completed_ring_to_quotient_completion_ker_le_completed_submodule_range", "lem:completed_submodule_range_le_completed_q"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_ker_le_completed_q_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Exactness gives containment in the range of the completed inclusion\n  \\(\\widehat q\\to\\widehat A\\), and\n  \\cref{lem:completed_submodule_range_le_completed_q} identifies that range\n  with a subideal of the algebraic extended ideal \\(q\\widehat A\\).\n", "lean_source": "theorem completedRingToQuotientCompletion_ker_le_completed_q_source\n    (d : BadQuotientSourceData) :\n    RingHom.ker (completedRingToQuotientCompletion d) ≤\n      Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q := by\n  exact (completedRingToQuotientCompletion_ker_le_completedSubmoduleRange d).trans\n    (completedSubmoduleRange_le_completed_q d)", "proof_size_lean": 355, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 17, "proof_size_tex": 245, "effort_local": 0, "proof_size_tex_total": 17021, "proof_size_lean_total": 38929, "effort_total": 0}, "lem:completed_ring_to_quotient_completion_ker_eq_completed_q_source": {"id": "lem:completed_ring_to_quotient_completion_ker_eq_completed_q_source", "type": "lemma", "title": "The natural map has kernel exactly \\(q\\widehat A\\)", "chapter": "The Anderson counterexample", "statement": "The kernel of \\(\\widehat A\\to\\widehat{A/q}\\) is exactly\n  \\(q\\widehat A\\).", "uses": ["lem:completed_ring_to_quotient_completion_kernel_contains_completed_q", "lem:completed_ring_to_quotient_completion_ker_le_completed_q_source"], "lean_name": "Run202608192034.TODO.completedRingToQuotientCompletion_ker_eq_completed_q_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine th the target to be\n  \\(\\widehat A/q\\widehat A\\), uses the checked quotient equivalence to\n  \\(T/aT\\), and stores the remaining one-dimensional analytic criterion as a\n  separate source lemma.\n", "lean_source": "noncomputable def quotientCompletionWitness_source\n    (d : BadQuotientSourceData)\n    (w : JensenCompletionWitness d.A d.𝔪 d.ι) :\n    QuotientCompletionWitness d := by\n  exact\n    { Bhat :=\n        AdicCompletion d.𝔪 d.A ⧸\n          Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q\n      instBhat := inferInstance\n      quotientCompletionEquiv := completedQuotientTargetEquivNode d w\n      analyticCriterionOnBhat :=\n        quotient_analyticCriterionOnCompletedQuotient_source d }", "proof_size_lean": 489, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 216, "effort_local": 0, "proof_size_tex_total": 22974, "proof_size_lean_total": 56852, "effort_total": 0}, "lem:bad_quotient_quasi_criterion_source": {"id": "lem:bad_quotient_quasi_criterion_source", "type": "lemma", "title": "Bad-quotient quasi-completeness criterion source", "chapter": "The Anderson counterexample", "statement": "The selected ring \\(A\\) satisfies the Anderson/Farley criterion:\n  \\(A\\) is quasi-complete exactly when every quotient \\(A/J\\) is weakly\n  quasi-complete.", "uses": ["lem:bad_quotient_source_data_from_jensen", "lem:all_quotients_weak_criterion_source"], "lean_name": "Run202608192034.TODO.badQuotient_quasiCriterion_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply the project-level wrapper for the cited quotient characterization to\n  the specialized criterion.\n", "lean_source": "theorem badQuotient_quasiCriterion_source\n    (d : BadQuotientSourceData)\n    (_w : JensenCompletionWitness d.A d.𝔪 d.ι) :\n    d.QuasiCriterion := by\n  exact\n    quasiComplete_iff_all_quotients_weak d.A d.𝔪", "proof_size_lean": 206, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 8, "proof_size_tex": 103, "effort_local": 0, "proof_size_tex_total": 16469, "proof_size_lean_total": 35231, "effort_total": 0}, "lem:bad_quotient_structured_source": {"id": "lem:bad_quotient_structured_source", "type": "lemma", "title": "Source theorem for the structured bad quotient", "chapter": "The Anderson counterexample", "statement": "The source construction supplies the complete structured package for the bad\n  quotient.", "uses": ["def:bad_quotient_structured_source", "lem:bad_quotient_source_data_from_jensen", "lem:bad_quotient_source_data_jensen_completion_witness", "lem:quotient_completion_witness_source", "lem:bad_quotient_quasi_criterion_source", "lem:bad_quotient_source_data_weakly_quasi_complete_to_adic_completion_prime_contraction_source", "lem:source_data_to_contracted_prime", "lem:source_data_to_prime_generator"], "lean_name": "Run202608192034.TODO.badQuotient_structured_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Choose the source data supplied by Jensen and the UFD generator step.  Attach\n  the Jensen completion witness, the quotient-completion witness, and the\n  quotient criterion.  The selected source prime-contraction condition is\n  supplied by the project-specific Farley first-direction theorem.  The\n  resulting tuple is the structured source package.\n", "lean_source": "theorem badQuotient_structured_source :\n    ∃ _ : BadQuotientStructuredSource, True := by\n  rcases badQuotient_sourceData_from_jensen with ⟨d, _hd⟩\n  let w : JensenCompletionWitness d.A d.𝔪 d.ι :=\n    d.jensenCompletionWitness\n  let qw : QuotientCompletionWitness d :=\n    quotientCompletionWitness_source d w\n  let hQuasi : d.QuasiCriterion :=\n    badQuotient_quasiCriterion_source d w\n  let hPrimeContraction :\n      AdicCompletionPrimeContractionCondition d.A d.𝔪 :=\n    d.weaklyQuasiComplete_to_adicCompletionPrimeContraction_source\n  exact ⟨⟨d, w, qw, hQuasi, hPrimeContraction⟩, trivial⟩", "proof_size_lean": 593, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 8, "rdep_count": 1, "descendant_count": 7, "proof_size_tex": 349, "effort_local": 0, "proof_size_tex_total": 38273, "proof_size_lean_total": 105516, "effort_total": 0}, "lem:source_data_to_bad_quotient": {"id": "lem:source_data_to_bad_quotient", "type": "lemma", "title": "Source data gives a bad quotient", "chapter": "The Anderson counterexample", "statement": "Forgetting the two final criterion fields, the structured source data is\n  exactly the bad quotient data.", "uses": ["def:bad_quotient_source_data", "def:bad_quotient"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.to_badQuotient", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Return the fields of the source package in the order required by\n  \\cref{def:bad_quotient}.\n", "lean_source": "theorem BadQuotientSourceData.to_badQuotient\n    (d : BadQuotientSourceData) : badQuotient := by\n  exact\n    ⟨d.A, d.instA, d.𝔪, d.ι, d.q, d.a, d.hNoeth, d.hLocal, d.hDomain,\n      d.hWeak, d.hBot, d.hqComap, d.hqPrime, d.hqNonzero, d.hqPrincipal⟩", "proof_size_lean": 247, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 91, "effort_local": 0, "proof_size_tex_total": 12868, "proof_size_lean_total": 22614, "effort_total": 0}, "lem:bad_quotient_dimension_domain": {"id": "lem:bad_quotient_dimension_domain", "type": "lemma", "title": "Dimension and domain properties of the bad quotient", "chapter": "The Anderson counterexample", "statement": "The ring \\(B\\) is a one-dimensional Noetherian local domain.", "uses": ["def:bad_quotient", "def:prime_generator", "lem:contracted_prime_height", "lem:counterexample_ring_properties"], "lean_name": "Run202608192034.TODO.badQuotient_dimension_domain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The ideal \\(aA=q\\) is prime, so the quotient is a domain; quotients of\n  Noetherian local rings are Noetherian and local.  The chain\n  \\(q\\subsetneq\\mathfrak m_A\\) gives dimension at least one.  A longer prime\n  chain above \\(q\\), preceded by \\((0)\\subsetneq q\\), would have length above\n  two in \\(A\\), contrary to \\(\\dim A=2\\).  Hence \\(\\dim B=1\\).\n", "lean_source": "theorem badQuotient_dimension_domain :\n    badQuotient →\n      ∃ (B : Type) (_inst : CommRing B),\n        IsNoetherianRing B ∧ IsLocalRing B ∧ IsDomain B := by\n  intro hBad\n  rcases hBad with\n    ⟨A, instA, _𝔪, _ι, q, _a, hNoeth, hLocal, _hDomain, _hWeak, _hBot,\n      _hqComap, hqPrime, _hqNonzero, _hqPrincipal⟩\n  letI := instA\n  haveI : IsNoetherianRing A := hNoeth\n  haveI : IsLocalRing A := hLocal\n  haveI : q.IsPrime := hqPrime\n  haveI : Nontrivial (A ⧸ q) := Ideal.Quotient.nontrivial_iff.mpr hqPrime.ne_top\n  haveI : IsLocalHom (Ideal.Quotient.mk q) :=\n    IsLocalHom.of_surjective (Ideal.Quotient.mk q) Ideal.Quotient.mk_surjective\n  have hQuotientLocal : IsLocalRing (A ⧸ q) :=\n    IsLocalRing.of_surjective (Ideal.Quotient.mk q) Ideal.Quotient.mk_surjective\n  refine ⟨A ⧸ q, inferInstance, ?_, ?_, ?_⟩\n  · infer_instance\n  · exact hQuotientLocal\n  · infer_instance", "proof_size_lean": 875, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 2, "descendant_count": 3, "proof_size_tex": 350, "effort_local": 0, "proof_size_tex_total": 12911, "proof_size_lean_total": 22604, "effort_total": 0}, "lem:quotient_not_domain_of_not_prime": {"id": "lem:quotient_not_domain_of_not_prime", "type": "lemma", "title": "A quotient by a nonprime ideal is not a domain", "chapter": "The Anderson counterexample", "statement": "If an ideal \\(I\\) is not prime, then the quotient \\(R/I\\) is not a domain.", "uses": [], "lean_name": "Run202608192034.TODO.quotient_not_domain_of_not_prime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  If \\(R/I\\) were a domain, then the kernel of the quotient map\n  \\(R\\to R/I\\) would be prime.  This kernel is exactly \\(I\\), contradiction.\n", "lean_source": "theorem quotient_not_domain_of_not_prime\n    {R : Type u} [CommRing R] (I : Ideal R) (hI : ¬ I.IsPrime) :\n    ¬ IsDomain (R ⧸ I) := by\n  intro hDomain\n  haveI : IsDomain (R ⧸ I) := hDomain\n  exact hI (by simpa [Ideal.mk_ker] using\n    (RingHom.ker_isPrime (Ideal.Quotient.mk I)))", "proof_size_lean": 279, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 4, "proof_size_tex": 138, "effort_local": 0, "proof_size_tex_total": 138, "proof_size_lean_total": 279, "effort_total": 0}, "lem:bad_quotient_structured_criteria_source": {"id": "lem:bad_quotient_structured_criteria_source", "type": "lemma", "title": "Structured source criteria for the bad quotient", "chapter": "The Anderson counterexample", "statement": "The constructed data can be packaged as a source-ordered tuple containing\n  \\(A\\), \\(\\mathfrak m_A\\), the completion embedding \\(A\\to T\\), the contracted\n  prime \\(q=Q\\cap A\\), a generator \\(q=aA\\), and the two criteria needed for\n  the final bad quotient.", "uses": ["lem:bad_quotient_structured_source", "lem:quotient_completion_dimension_criterion"], "lean_name": "Run202608192034.TODO.badQuotient_structured_criteria_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Destructure the structured source theorem.  The quasi-completeness criterion\n  is stored directly, and the dimension-one criterion is transported from the\n  quotient completion target across its equivalence with \\(T/aT\\).\n", "lean_source": "theorem badQuotient_structured_criteria_source :\n    ∃ d : BadQuotientSourceData,\n      d.QuasiCriterion ∧ d.DimensionCriterion := by\n  rcases badQuotient_structured_source with ⟨s, _hs⟩\n  exact\n    ⟨s.data, s.quasiCriterion,\n      s.quotientCompletion.dimensionCriterion⟩", "proof_size_lean": 272, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 6, "proof_size_tex": 221, "effort_local": 0, "proof_size_tex_total": 38745, "proof_size_lean_total": 106918, "effort_total": 0}, "lem:bad_quotient_criteria_source": {"id": "lem:bad_quotient_criteria_source", "type": "lemma", "title": "Expanded source criteria for the bad quotient", "chapter": "The Anderson counterexample", "statement": "Expanding the structured source package gives the explicit existential\n  statement used by the downstream Lean proof.", "uses": ["lem:bad_quotient_structured_criteria_source"], "lean_name": "Run202608192034.TODO.badQuotient_criteria_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Destructure the source package and return its fields in the order expected by\n  the public bad-quotient interface.\n", "lean_source": "theorem badQuotient_criteria_source :\n    ∃ (A : Type) (_inst : CommRing A) (𝔪 : @Ideal A _inst.toSemiring)\n      (ι : A →+* nodeRing) (q : @Ideal A _inst.toSemiring) (a : A),\n      IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n        WeaklyQuasiComplete A 𝔪 ∧\n          Ideal.comap ι (⊥ : Ideal nodeRing) = ⊥ ∧\n            q = Ideal.comap ι nodePrime ∧ q.IsPrime ∧ q ≠ ⊥ ∧\n              q = Ideal.span ({a} : Set A) ∧\n                (QuasiComplete A 𝔪 ↔\n                  ∀ J : Ideal A,\n                    WeaklyQuasiComplete (A ⧸ J)\n                      (Ideal.map (Ideal.Quotient.mk J) 𝔪)) ∧\n                  (WeaklyQuasiComplete (A ⧸ q)\n                    (Ideal.map (Ideal.Quotient.mk q) 𝔪) ↔\n                      AnalyticallyIrreducible (A ⧸ q)\n                        (nodeRing ⧸ Ideal.span ({ι a} : Set nodeRing))) := by\n  rcases badQuotient_s // ── Graph structure: adjacency, degree, components ──────────────────────────

const succ = {}, pred = {}, deg = {};
for (const id in allNodes) { succ[id] = []; pred[id] = []; deg[id] = 0; }
for (const e of graphData.edges) {
  if (succ[e.from]) succ[e.from].push(e.to);
  if (pred[e.to])   pred[e.to].push(e.from);
  deg[e.from] = (deg[e.from] || 0) + 1;
  deg[e.to]   = (deg[e.to]   || 0) + 1;

const isOrphan = id => !(deg[id] > 0);

// weakly-connected components via union-find (orphans excluded)

function find(x) { while (parent[x] !== x) x = parent[x] = parent[parent[x]]; return x; }
for (const id in allNodes) parent[id] = id;
for (const e of graphData.edges)
  if (parent[e.from] !== undefined && parent[e.to] !== undefined)
    parent[find(e.from)] = find(e.to);

const compMembers = {};
for (const id in allNodes) {

  (compMembers[r] = compMembers[r] || []).push(id);

function compRepr(members) {
  let best = members[0];
  for (const id of members) if ((deg[id] || 0) > (deg[best] || 0)) best = id;
  return best.split(":").pop();
}

const state = { showOrphans: false, focus: null, component: null, chapter: null,
                nodeset: "union", fileview: "off" };

// Which universe a node belongs to. A node "has Lean" if it carries Lean source
// (lean_aux nodes always do; blueprint nodes do once their \lean{} resolved).
const hasLean    = n => n.type === "lean_aux" || !!(n.lean_source && n.lean_source.length);
const inBlueprint = n => n.type !== "lean_aux";
function inNodeset(id) {
  const n = allNodes[id];
  if (state.nodeset === "blueprint") return inBlueprint(n);
  if (state.nodeset === "lean")      return hasLean(n);
  return true;                                   // union
}

function coneOf(id) {
  const out = new Set([id]);
  const walk = (adj, start) => {
    const st = [start];
    while (st.length) {
      const x = st.pop();
      for (const y of (adj[x] || [])) if (!out.has(y)) { out.add(y); st.push(y); }
    }
  };
  walk(pred, id);   // everything this node (transitively) depends on
  walk(succ, id);   // everything that (transitively) depends on it
  return out;
}

// all transitive predecessors of id (its full upstream dependency set)
function ancestorsOf(id) {
  const out = new Set();
  const st = [...(pred[id] || [])];
  while (st.length) {
    const x = st.pop();
    if (!out.has(x)) { out.add(x); for (const y of (pred[x] || [])) st.push(y); }
  }
  return out;
}

function visibleSet() {
  if (state.focus && allNodes[state.focus]) {
    return new Set([...coneOf(state.focus)].filter(inNodeset));
  }
  let ids = Object.keys(allNodes).filter(inNodeset);
  if (!state.showOrphans)      ids = ids.filter(id => !isOrphan(id));
  if (state.component !== null) ids = ids.filter(id => compOf[id] === state.component);
  if (state.chapter)            ids = ids.filter(id => allNodes[id].chapter === state.chapter);
  return new Set(ids);
}

// Once a settle finishes, freeze the simulation (so the view is stable and

network.on("stabilizationIterationsDone", () => {

  fitFloored();

// ── Isolated-node layout ──────────────────────────────────────────────────────
// Isolated nodes (no edges) are excluded from the force simulation — under pure
// repulsion they'd drift to the far edges and vanish at fit-zoom. Instead they
// are parked on a tidy grid beside the connected graph so they stay visible.

function layoutOrphans() {
  if (state.focus || !state.showOrphans) return;
  const ids = nodesDS.getIds().filter(id => isOrphan(id));
  if (!ids.length) return;
  const pos  = network.getPositions();
  const conn = nodesDS.getIds().filter(id => !isOrphan(id));
  const spacing = 46;
  const cols = Math.max(1, Math.ceil(Math.sqrt(ids.length)));
  const gridW = (cols - 1) * spacing;
  let centerX, topY;
  if (conn.length) {
    const xs = conn.map(id => pos[id].x), ys = conn.map(id => pos[id].y);
    centerX = (Math.min(...xs) + Math.max(...xs)) / 2;
    topY    = Math.max(...ys) + 120;     // a tidy block just below the cluster
  } else { centerX = 0; topY = 0; }
  const startX = centerX - gridW / 2;    // centred, so a full fit frames it all
  ids.sort();
  ids.forEach((id, i) =>
    network.moveNode(id, startX + (i % cols) * spacing,
                         topY + Math.floor(i / cols) * spacing));
}

// ── File-view background ──────────────────────────────────────────────────────
