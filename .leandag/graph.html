es\n  \\[\n    \\dim(A/q)+1=2.\n  \\]", "uses": ["lem:bad_quotient_source_data_quotient_span_generator_dimension_add_one", "lem:bad_quotient_source_data_source_ring_krull_dim_eq_two"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.quotient_dimension_add_one_eq_two_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Rewrite \\(q=(a)\\) in the previous dimension-drop lemma, then use\n  \\(\\dim A=2\\).\n", "lean_source": "theorem BadQuotientSourceData.quotient_dimension_add_one_eq_two_source\n    (d : BadQuotientSourceData) :\n    ringKrullDim (d.A ⧸ d.q) + 1 = 2 := by\n  have h := d.quotient_span_generator_dimension_add_one\n  rw [← d.hqPrincipal] at h\n  exact h.trans d.source_ringKrullDim_eq_two", "proof_size_lean": 276, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 17, "proof_size_tex": 80, "effort_local": 0, "proof_size_tex_total": 13548, "proof_size_lean_total": 24298, "effort_total": 0}, "lem:with_bot_enat_eq_one_of_add_one_eq_two": {"id": "lem:with_bot_enat_eq_one_of_add_one_eq_two", "type": "lemma", "title": "WithBot ENat cancellation at two", "chapter": "The Anderson counterexample", "statement": "If \\(x+1=2\\) in \\(\\bot\\)-extended \\(\\mathbb N_\\infty\\), then \\(x=1\\).", "uses": [], "lean_name": "Run202608192034.TODO.withBotENat_eq_one_of_add_one_eq_two", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Rewrite \\(2\\) as \\(1+1\\) and use the order-theoretic cancellation lemma for\n  adding one on both sides.\n", "lean_source": "theorem withBotENat_eq_one_of_add_one_eq_two\n    {x : WithBot ℕ∞} (h : x + 1 = 2) :\n    x = 1 := by\n  rw [← one_add_one_eq_two] at h\n  apply le_antisymm\n  · exact ENat.WithBot.add_le_add_one_right_iff.mp (le_of_eq h)\n  · exact ENat.WithBot.add_le_add_one_right_iff.mp (ge_of_eq h)", "proof_size_lean": 280, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 17, "proof_size_tex": 103, "effort_local": 0, "proof_size_tex_total": 103, "proof_size_lean_total": 280, "effort_total": 0}, "lem:bad_quotient_source_data_quotient_ring_krull_dim_eq_one_source": {"id": "lem:bad_quotient_source_data_quotient_ring_krull_dim_eq_one_source", "type": "lemma", "title": "The bad quotient has dimension one", "chapter": "The Anderson counterexample", "statement": "The quotient \\(A/q\\) has Krull dimension one.", "uses": ["lem:bad_quotient_source_data_quotient_dimension_add_one_eq_two_source", "lem:with_bot_enat_eq_one_of_add_one_eq_two"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.quotient_ringKrullDim_eq_one_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply the extended-natural-number cancellation lemma to\n  \\(\\dim(A/q)+1=2\\).\n", "lean_source": "theorem BadQuotientSourceData.quotient_ringKrullDim_eq_one_source\n    (d : BadQuotientSourceData) :\n    ringKrullDim (d.A ⧸ d.q) = 1 :=\n  withBotENat_eq_one_of_add_one_eq_two\n    d.quotient_dimension_add_one_eq_two_source", "proof_size_lean": 221, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 16, "proof_size_tex": 76, "effort_local": 0, "proof_size_tex_total": 13727, "proof_size_lean_total": 24799, "effort_total": 0}, "def:quotient_dimension_one_facts": {"id": "def:quotient_dimension_one_facts", "type": "definition", "title": "Dimension-one facts for the bad quotient", "chapter": "The Anderson counterexample", "statement": "Record the exact hypotheses needed before applying the one-dimensional\n  quotient criterion: \\(A/q\\) is Noetherian, local, a domain, and has Krull\n  dimension one.", "uses": ["lem:bad_quotient_source_data_quotient_noetherian_local_domain", "lem:bad_quotient_source_data_quotient_ring_krull_dim_eq_one_source"], "lean_name": "Run202608192034.TODO.QuotientDimensionOneFacts", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a structure definition isolating the local algebra facts used by the\n  one-dimensional criterion.\n", "lean_source": "structure QuotientDimensionOneFacts (d : BadQuotientSourceData) : Prop where\n  quotient_isNoetherian : IsNoetherianRing (d.A ⧸ d.q)\n  quotient_isLocal : IsLocalRing (d.A ⧸ d.q)\n  quotient_isDomain : IsDomain (d.A ⧸ d.q)\n  quotient_ringKrullDim_eq_one : ringKrullDim (d.A ⧸ d.q) = 1", "proof_size_lean": 281, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 15, "proof_size_tex": 105, "effort_local": 0, "proof_size_tex_total": 14250, "proof_size_lean_total": 26561, "effort_total": 0}, "lem:bad_quotient_source_data_quotient_dimension_one_facts_of_dim": {"id": "lem:bad_quotient_source_data_quotient_dimension_one_facts_of_dim", "type": "lemma", "title": "Dimension-one facts from the dimension calculation", "chapter": "The Anderson counterexample", "statement": "Once the source proof gives \\(\\dim(A/q)=1\\), all one-dimensional quotient\n  facts are available.", "uses": ["def:quotient_dimension_one_facts", "lem:bad_quotient_source_data_quotient_noetherian_local_domain", "lem:bad_quotient_source_data_quotient_ring_krull_dim_eq_one_source"], "lean_name": "Run202608192034.TODO.BadQuotientSourceData.quotientDimensionOneFacts_of_dim", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Fill the structure using the checked Noetherian, local, and domain facts,\n  and the supplied dimension equality.\n", "lean_source": "theorem BadQuotientSourceData.quotientDimensionOneFacts_of_dim\n    (d : BadQuotientSourceData)\n    (hDim : ringKrullDim (d.A ⧸ d.q) = 1) :\n    QuotientDimensionOneFacts d :=\n  { quotient_isNoetherian := d.quotient_isNoetherian\n    quotient_isLocal := d.quotient_isLocal\n    quotient_isDomain := d.quotient_isDomain\n    quotient_ringKrullDim_eq_one := hDim }", "proof_size_lean": 357, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 1, "descendant_count": 13, "proof_size_tex": 112, "effort_local": 0, "proof_size_tex_total": 14362, "proof_size_lean_total": 26918, "effort_total": 0}, "def:jensen_completion_witness": {"id": "def:jensen_completion_witness", "type": "definition", "title": "Jensen completion witness", "chapter": "The Anderson counterexample", "statement": "Record the stronger Jensen output needed later: an abstract completion\n  equivalence \\(\\widehat A^{\\,\\mathfrak m}\\cong T\\), compatibility with the\n  embedded map \\(A\\to T\\), the UFD property of the selected source ring, the\n  fact that the chosen adic ideal is the maximal ideal of the local ring \\(A\\),\n  and the weak quasi-completeness criterion expressed through this completion.", "uses": ["lem:farley_completion_criterion"], "lean_name": "Run202608192034.TODO.JensenCompletionWitness", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a source data structure isolating the part of Jensen's construction\n  that identifies the completion of \\(A\\) with the chosen complete local ring\n  \\(T\\).  In Lean the completion is the standard Mathlib object\n  `AdicCompletion \\(\\mathfrak m\\) A`; the maximal-ideal equality records the\n  paper's implicit notation \\((A,\\mathfrak m)\\).\n", "lean_source": "structure JensenCompletionWitness\n    (A : Type) [CommRing A] (𝔪 : Ideal A) (ι : A →+* nodeRing) where\n  completionEquiv : AdicCompletion 𝔪 A ≃+* nodeRing\n  map_compatible :\n    ι = completionEquiv.toRingHom.comp\n      (algebraMap A (AdicCompletion 𝔪 A))\n  sourceIsUFD : UniqueFactorizationMonoid A\n  adicIdeal_eq_maximalIdeal :\n    ∀ hLocal : IsLocalRing A,\n      𝔪 = @IsLocalRing.maximalIdeal A inferInstance hLocal\n  sourceRingKrullDim_eq_two : ringKrullDim A = 2\n  weakCriterion :\n    WeaklyQuasiComplete A 𝔪 ↔\n      ∀ P : Ideal nodeRing, P.IsPrime → P ≠ ⊥ → Ideal.comap ι P ≠ ⊥", "proof_size_lean": 582, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 13, "descendant_count": 134, "proof_size_tex": 343, "effort_local": 0, "proof_size_tex_total": 1677, "proof_size_lean_total": 1473, "effort_total": 0}, "def:quotient_completion_witness": {"id": "def:quotient_completion_witness", "type": "definition", "title": "Quotient completion witness", "chapter": "The Anderson counterexample", "statement": "Record the completion bridge for the quotient \\(A/q=A/aA\\): its completion\n  target is equivalent to \\(T/aT\\), and the dimension-one analytic\n  irreducibility criterion applies to that completion target.", "uses": ["def:bad_quotient_source_data", "def:jensen_completion_witness", "lem:dimension_one_weak_criterion"], "lean_name": "Run202608192034.TODO.QuotientCompletionWitness", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the source interface for the theorem that completion commutes with\n  quotient by the principal ideal \\(aA\\), after transporting\n  \\(\\widehat A\\cong T\\).\n", "lean_source": "structure QuotientCompletionWitness (d : BadQuotientSourceData) where\n  Bhat : Type\n  [instBhat : CommRing Bhat]\n  quotientCompletionEquiv :\n    Bhat ≃+* (nodeRing ⧸ Ideal.span ({d.ι d.a} : Set nodeRing))\n  analyticCriterionOnBhat :\n    WeaklyQuasiComplete (d.A ⧸ d.q)\n      (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ↔\n        AnalyticallyIrreducible (d.A ⧸ d.q) Bhat\n\nattribute [instance] QuotientCompletionWitness.instBhat", "proof_size_lean": 422, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 3, "descendant_count": 11, "proof_size_tex": 160, "effort_local": 0, "proof_size_tex_total": 13430, "proof_size_lean_total": 23539, "effort_total": 0}, "def:quotient_linear_map": {"id": "def:quotient_linear_map", "type": "definition", "title": "The quotient map as a linear map", "chapter": "The Anderson counterexample", "statement": "View the canonical quotient map \\(A\\to A/q\\) as an \\(A\\)-linear map, so that\n  Mathlib's module-level adic-completion functoriality can be applied.", "uses": ["def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.quotientLinearMap", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the linear map underlying the algebra homomorphism\n  `Ideal.Quotient.mkₐ`.\n", "lean_source": "def quotientLinearMap (d : BadQuotientSourceData) :\n    d.A →ₗ[d.A] d.A ⧸ d.q :=\n  (Ideal.Quotient.mkₐ d.A d.q).toLinearMap", "proof_size_lean": 123, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 4, "descendant_count": 27, "proof_size_tex": 82, "effort_local": 0, "proof_size_tex_total": 12859, "proof_size_lean_total": 22490, "effort_total": 0}, "lem:quotient_mk_linear_surjective": {"id": "lem:quotient_mk_linear_surjective", "type": "lemma", "title": "The quotient map is surjective", "chapter": "The Anderson counterexample", "statement": "The linear version of the quotient map \\(A\\to A/q\\) is surjective.", "uses": ["def:quotient_linear_map"], "lean_name": "Run202608192034.TODO.quotient_mk_linear_surjective", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is exactly `Ideal.Quotient.mk_surjective`, after unfolding the linear\n  map.\n", "lean_source": "theorem quotient_mk_linear_surjective\n    (d : BadQuotientSourceData) :\n    Function.Surjective (quotientLinearMap d) := by\n  simpa [quotientLinearMap, Ideal.Quotient.mkₐ_eq_mk] using\n    (Ideal.Quotient.mk_surjective : Function.Surjective (Ideal.Quotient.mk d.q))", "proof_size_lean": 264, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 24, "proof_size_tex": 81, "effort_local": 0, "proof_size_tex_total": 12940, "proof_size_lean_total": 22754, "effort_total": 0}, "lem:quotient_completion_map_surjective": {"id": "lem:quotient_completion_map_surjective", "type": "lemma", "title": "Completion preserves the quotient-map surjection", "chapter": "The Anderson counterexample", "statement": "The completed map induced by \\(A\\to A/q\\) is surjective.", "uses": ["def:quotient_linear_map", "lem:quotient_mk_linear_surjective"], "lean_name": "Run202608192034.TODO.quotient_completion_map_surjective", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply Mathlib's `AdicCompletion.map_surjective` to the surjective quotient\n  linear map.\n", "lean_source": "theorem quotient_completion_map_surjective\n    (d : BadQuotientSourceData) :\n    Function.Surjective\n      (AdicCompletion.map d.𝔪 (quotientLinearMap d)) := by\n  exact AdicCompletion.map_surjective d.𝔪 (quotient_mk_linear_surjective d)", "proof_size_lean": 235, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 18, "proof_size_tex": 88, "effort_local": 0, "proof_size_tex_total": 13028, "proof_size_lean_total": 22989, "effort_total": 0}, "lem:quotient_module_filtration_eq_restrict_scalars": {"id": "lem:quotient_module_filtration_eq_restrict_scalars", "type": "lemma", "title": "The two quotient filtrations agree", "chapter": "The Anderson counterexample", "statement": "The \\(A\\)-module filtration on \\(A/q\\) induced by \\(\\mathfrak m^n\\) agrees\n  with the restriction of scalars of the ideal\n  \\((\\mathfrak m(A/q))^n\\).", "uses": ["def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.quotient_module_filtration_eq_restrictScalars", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Rewrite the scalar action of an ideal on the top submodule as ideal image,\n  identify the algebra map \\(A\\to A/q\\) with the quotient map, and use\n  `Ideal.map_pow`.\n", "lean_source": "theorem quotient_module_filtration_eq_restrictScalars\n    (d : BadQuotientSourceData) (n : ℕ) :\n    (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q))) =\n      ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n).restrictScalars d.A := by\n  rw [Ideal.smul_top_eq_map]\n  rw [show algebraMap d.A (d.A ⧸ d.q) = Ideal.Quotient.mk d.q by\n    exact Ideal.Quotient.algebraMap_eq d.q]\n  rw [Ideal.map_pow]", "proof_size_lean": 382, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 37, "proof_size_tex": 164, "effort_local": 0, "proof_size_tex_total": 12941, "proof_size_lean_total": 22749, "effort_total": 0}, "def:quotient_module_level_equiv": {"id": "def:quotient_module_level_equiv", "type": "definition", "title": "Finite-level module-to-ring quotient equivalence", "chapter": "The Anderson counterexample", "statement": "At each finite level, quotienting \\(A/q\\) by the \\(A\\)-module filtration\n  \\(\\mathfrak m^n(A/q)\\) is linearly equivalent to quotienting by the same\n  ideal viewed after restriction of scalars from \\(A/q\\).", "uses": ["lem:quotient_module_filtration_eq_restrict_scalars"], "lean_name": "Run202608192034.TODO.quotientModuleLevelEquiv", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply `Submodule.Quotient.equiv` to the equality of submodules from\n  \\cref{lem:quotient_module_filtration_eq_restrict_scalars}.\n", "lean_source": "noncomputable def quotientModuleLevelEquiv\n    (d : BadQuotientSourceData) (n : ℕ) :\n    ((d.A ⧸ d.q) ⧸\n        (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))) ≃ₗ[d.A]\n      ((d.A ⧸ d.q) ⧸\n        (((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n).restrictScalars d.A)) :=\n  Submodule.Quotient.equiv\n    (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))\n    (((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n).restrictScalars d.A)\n    (LinearEquiv.refl d.A (d.A ⧸ d.q))\n    (by\n      simpa using quotient_module_filtration_eq_restrictScalars d n)", "proof_size_lean": 528, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 28, "proof_size_tex": 128, "effort_local": 0, "proof_size_tex_total": 13069, "proof_size_lean_total": 23277, "effort_total": 0}, "lem:quotient_module_level_equiv_mk": {"id": "lem:quotient_module_level_equiv_mk", "type": "lemma", "title": "The finite-level equivalence on representatives", "chapter": "The Anderson counterexample", "statement": "The finite-level equivalence sends the class of \\(x\\in A/q\\) to the class of\n  the same representative \\(x\\).", "uses": ["def:quotient_module_level_equiv"], "lean_name": "Run202608192034.TODO.quotientModuleLevelEquiv_mk", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is definitional for the quotient equivalence built from the identity\n  linear equivalence.\n", "lean_source": "@[simp]\ntheorem quotientModuleLevelEquiv_mk\n    (d : BadQuotientSourceData) (n : ℕ) (x : d.A ⧸ d.q) :\n    quotientModuleLevelEquiv d n\n        (Submodule.Quotient.mk\n          (p := d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q))) x) =\n      Submodule.Quotient.mk\n        (p := ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n).restrictScalars d.A) x := by\n  rfl", "proof_size_lean": 352, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 1, "proof_size_tex": 95, "effort_local": 0, "proof_size_tex_total": 13164, "proof_size_lean_total": 23629, "effort_total": 0}, "def:quotient_module_level_to_ring_level_equiv": {"id": "def:quotient_module_level_to_ring_level_equiv", "type": "definition", "title": "Finite-level comparison to the ring quotient", "chapter": "The Anderson counterexample", "statement": "This is the same finite-level comparison, with the target written as the\n  ordinary ideal quotient over the ring \\(A/q\\).", "uses": ["def:quotient_module_level_equiv"], "lean_name": "Run202608192034.TODO.quotientModuleLevelToRingLevelEquiv", "proved": false, "mathlib_ok": false, "proof_tex": "\n  It is the previous equivalence after Lean unfolds ideals as submodules of\n  their underlying ring.\n", "lean_source": "noncomputable def quotientModuleLevelToRingLevelEquiv\n    (d : BadQuotientSourceData) (n : ℕ) :\n    ((d.A ⧸ d.q) ⧸\n        (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))) ≃ₗ[d.A]\n      ((d.A ⧸ d.q) ⧸\n        ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n)) :=\n  quotientModuleLevelEquiv d n", "proof_size_lean": 285, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 25, "proof_size_tex": 98, "effort_local": 0, "proof_size_tex_total": 13167, "proof_size_lean_total": 23562, "effort_total": 0}, "lem:quotient_module_filtration_eq_adic_restrict_scalars": {"id": "lem:quotient_module_filtration_eq_adic_restrict_scalars", "type": "lemma", "title": "The module filtration agrees with the adic filtration", "chapter": "The Anderson counterexample", "statement": "The \\(A\\)-module filtration on \\(A/q\\) agrees with the restricted scalar\n  version of the \\(A/q\\)-adic filtration.", "uses": ["lem:quotient_module_filtration_eq_restrict_scalars"], "lean_name": "Run202608192034.TODO.quotient_module_filtration_eq_adic_restrictScalars", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Combine the already established filtration equality with the fact that an\n  ideal acting on the top submodule of its own ring gives the ideal itself.\n", "lean_source": "theorem quotient_module_filtration_eq_adic_restrictScalars\n    (d : BadQuotientSourceData) (n : ℕ) :\n    (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q))) =\n      ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n •\n        (⊤ : Submodule (d.A ⧸ d.q) (d.A ⧸ d.q))).restrictScalars d.A := by\n  rw [quotient_module_filtration_eq_restrictScalars]\n  simp", "proof_size_lean": 338, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 31, "proof_size_tex": 149, "effort_local": 0, "proof_size_tex_total": 13090, "proof_size_lean_total": 23087, "effort_total": 0}, "def:quotient_module_level_to_adic_level_equiv": {"id": "def:quotient_module_level_to_adic_level_equiv", "type": "definition", "title": "Finite-level comparison to adic levels", "chapter": "The Anderson counterexample", "statement": "At finite level \\(n\\), the \\(A\\)-module completion quotient of \\(A/q\\) is\n  linearly equivalent to the \\(n\\)-th quotient used in the intrinsic\n  \\(A/q\\)-adic completion.", "uses": ["lem:quotient_module_filtration_eq_adic_restrict_scalars"], "lean_name": "Run202608192034.TODO.quotientModuleLevelToAdicLevelEquiv", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply `Submodule.Quotient.equiv` to the equality of restricted scalar\n  submodules.\n", "lean_source": "noncomputable def quotientModuleLevelToAdicLevelEquiv\n    (d : BadQuotientSourceData) (n : ℕ) :\n    ((d.A ⧸ d.q) ⧸\n        (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))) ≃ₗ[d.A]\n      ((d.A ⧸ d.q) ⧸\n        ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n •\n          (⊤ : Submodule (d.A ⧸ d.q) (d.A ⧸ d.q)))) :=\n  Submodule.Quotient.equiv\n    (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))\n    (((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n •\n      (⊤ : Submodule (d.A ⧸ d.q) (d.A ⧸ d.q))).restrictScalars d.A)\n    (LinearEquiv.refl d.A (d.A ⧸ d.q))\n    (by\n      rw [quotient_module_filtration_eq_restrictScalars]\n      simp)", "proof_size_lean": 617, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 30, "proof_size_tex": 83, "effort_local": 0, "proof_size_tex_total": 13173, "proof_size_lean_total": 23704, "effort_total": 0}, "lem:quotient_module_level_to_adic_level_equiv_eq_factor_ring_level": {"id": "lem:quotient_module_level_to_adic_level_equiv_eq_factor_ring_level", "type": "lemma", "title": "Compatibility with the ring-level factor map", "chapter": "The Anderson counterexample", "statement": "The finite-level comparison to adic levels agrees with first passing through\n  the ring-level quotient and then applying the canonical factor map.", "uses": ["def:quotient_module_level_to_adic_level_equiv", "def:quotient_module_level_to_ring_level_equiv"], "lean_name": "Run202608192034.TODO.quotientModuleLevelToAdicLevelEquiv_eq_factor_ringLevel", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Prove the statement by quotient induction on representatives; both sides\n  reduce to the same quotient class.\n", "lean_source": "theorem quotientModuleLevelToAdicLevelEquiv_eq_factor_ringLevel\n    (d : BadQuotientSourceData) (n : ℕ)\n    (v : (d.A ⧸ d.q) ⧸\n      (d.𝔪 ^ n • (⊤ : Submodule d.A (d.A ⧸ d.q)))) :\n    quotientModuleLevelToAdicLevelEquiv d n v =\n      Ideal.Quotient.factor\n        (show (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n ≤\n          ((Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ n •\n            (⊤ : Ideal (d.A ⧸ d.q))) by\n          exact le_of_eq (by ext x; simp))\n        (quotientModuleLevelToRingLevelEquiv d n v) := by\n  induction v using Submodule.Quotient.induction_on with\n  | H z =>\n      rfl", "proof_size_lean": 591, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 23, "proof_size_tex": 109, "effort_local": 0, "proof_size_tex_total": 13508, "proof_size_lean_total": 25108, "effort_total": 0}, "lem:completed_q_eq_span_a": {"id": "lem:completed_q_eq_span_a", "type": "lemma", "title": "The completed contracted prime is principal", "chapter": "The Anderson counterexample", "statement": "Since \\(q=aA\\), its extension to \\(\\widehat A\\) is generated by the image of\n  \\(a\\).", "uses": ["def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.completed_q_eq_span_a", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Rewrite by the stored equality \\(q=(a)\\), then use `Ideal.map_span` and the\n  singleton image simplification.\n", "lean_source": "theorem completed_q_eq_span_a\n    (d : BadQuotientSourceData) :\n    Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q =\n      Ideal.span\n        ({algebraMap d.A (AdicCompletion d.𝔪 d.A) d.a} :\n          Set (AdicCompletion d.𝔪 d.A)) := by\n  rw [d.hqPrincipal, Ideal.map_span]\n  simp", "proof_size_lean": 289, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 12, "proof_size_tex": 109, "effort_local": 0, "proof_size_tex_total": 12886, "proof_size_lean_total": 22656, "effort_total": 0}, "lem:completion_equiv_maps_completed_q": {"id": "lem:completion_equiv_maps_completed_q", "type": "lemma", "title": "Transporting the completed principal ideal to \\(T\\)", "chapter": "The Anderson counterexample", "statement": "The Jensen completion equivalence sends \\(q\\widehat A\\) to the principal\n  ideal \\(aT\\subseteq T\\).", "uses": ["def:jensen_completion_witness", "lem:completed_q_eq_span_a"], "lean_name": "Run202608192034.TODO.completionEquiv_maps_completed_q", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Use `completed_q_eq_span_a` and the compatibility equation recorded in the\n  Jensen completion witness, namely that the selected embedding \\(A\\to T\\) is\n  the standard completion map followed by \\(\\widehat A\\cong T\\).\n", "lean_source": "theorem completionEquiv_maps_completed_q\n    (d : BadQuotientSourceData)\n    (w : JensenCompletionWitness d.A d.𝔪 d.ι) :\n    Ideal.map (w.completionEquiv : AdicCompletion d.𝔪 d.A →+* nodeRing)\n        (Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q) =\n      Ideal.span ({d.ι d.a} : Set nodeRing) := by\n  rw [completed_q_eq_span_a d, Ideal.map_span]\n  simp [w.map_compatible]", "proof_size_lean": 383, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 11, "proof_size_tex": 217, "effort_local": 0, "proof_size_tex_total": 13103, "proof_size_lean_total": 23039, "effort_total": 0}, "def:completed_quotient_target_equiv_node": {"id": "def:completed_quotient_target_equiv_node", "type": "definition", "title": "The quotient target transported to \\(T/aT\\)", "chapter": "The Anderson counterexample", "statement": "The completion equivalence \\(\\widehat A\\cong T\\) induces a quotient\n  equivalence \\(\\widehat A/q\\widehat A\\cong T/aT\\).", "uses": ["def:jensen_completion_witness", "lem:completion_equiv_maps_completed_q"], "lean_name": "Run202608192034.TODO.completedQuotientTargetEquivNode", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply Mathlib's quotient equivalence attached to a ring equivalence and an\n  equality of mapped ideals.\n", "lean_source": "noncomputable def completedQuotientTargetEquivNode\n    (d : BadQuotientSourceData)\n    (w : JensenCompletionWitness d.A d.𝔪 d.ι) :\n    (AdicCompletion d.𝔪 d.A ⧸\n      Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q)\n      ≃+*\n    (nodeRing ⧸ Ideal.span ({d.ι d.a} : Set nodeRing)) :=\n  Ideal.quotientEquiv\n    (Ideal.map (algebraMap d.A (AdicCompletion d.𝔪 d.A)) d.q)\n    (Ideal.span ({d.ι d.a} : Set nodeRing))\n    w.completionEquiv\n    (completionEquiv_maps_completed_q d w).symm", "proof_size_lean": 489, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 10, "proof_size_tex": 103, "effort_local": 0, "proof_size_tex_total": 13206, "proof_size_lean_total": 23528, "effort_total": 0}, "def:quotient_adic_completion": {"id": "def:quotient_adic_completion", "type": "definition", "title": "The actual quotient adic completion", "chapter": "The Anderson counterexample", "statement": "The completion of \\(B=A/q\\) is represented as the adic completion over the\n  quotient ring \\(A/q\\) itself, with respect to the ideal induced by\n  \\(\\mathfrak m\\).", "uses": ["def:bad_quotient_source_data"], "lean_name": "Run202608192034.TODO.quotientAdicCompletion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The Lean definition fixes the hidden base-ring and module parameters of\n  `AdicCompletion` explicitly, avoiding confusion with the completion of\n  \\(A/q\\) merely as an \\(A\\)-module.\n", "lean_source": "abbrev quotientAdicCompletion (d : BadQuotientSourceData) : Type :=\n  @AdicCompletion (d.A ⧸ d.q) inferInstance\n    (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪)\n    (d.A ⧸ d.q) inferInstance inferInstance", "proof_size_lean": 199, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 5, "descendant_count": 32, "proof_size_tex": 181, "effort_local": 0, "proof_size_tex_total": 12958, "proof_size_lean_total": 22566, "effort_total": 0}, "lem:quotient_adic_completion_comm_ring": {"id": "lem:quotient_adic_completion_comm_ring", "type": "lemma", "title": "The quotient adic completion is a ring", "chapter": "The Anderson counterexample", "statement": "The quotient completion \\( \\widehat{A/q}\\) has its natural commutative ring\n  structure.", "uses": ["def:quotient_adic_completion"], "lean_name": "Run202608192034.TODO.quotientAdicCompletion.instCommRing", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is Mathlib's `AdicCompletion.instCommRing`, applied with \\(A/q\\) as the\n  base ring.\n", "lean_source": "noncomputable instance quotientAdicCompletion.instCommRing\n    (d : BadQuotientSourceData) :\n    CommRing (quotientAdicCompletion d) :=\n  @AdicCompletion.instCommRing (d.A ⧸ d.q) inferInstance\n    (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪)", "proof_size_lean": 236, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 89, "effort_local": 0, "proof_size_tex_total": 13047, "proof_size_lean_total": 22802, "effort_total": 0}, "def:quotient_module_completion_to_quotient_adic_completion": {"id": "def:quotient_module_completion_to_quotient_adic_completion", "type": "definition", "title": "From module completion to quotient adic completion", "chapter": "The Anderson counterexample", "statement": "The finite-level comparison maps assemble into a map from the completion of\n  \\(A/q\\) as an \\(A\\)-module to the intrinsic adic completion of \\(A/q\\).", "uses": ["def:quotient_adic_completion", "def:quotient_module_level_to_adic_level_equiv"], "lean_name": "Run202608192034.TODO.quotientModuleCompletionToQuotientAdicCompletion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Send a compatible family levelwise through\n  \\cref{def:quotient_module_level_to_adic_level_equiv}; compatibility follows\n  by reducing the transition-map identity to representatives.\n", "lean_source": "noncomputable def quotientModuleCompletionToQuotientAdicCompletion\n    (d : BadQuotientSourceData) :\n    AdicCompletion d.𝔪 (d.A ⧸ d.q) → quotientAdicCompletion d :=\n  fun x =>\n    ⟨fun n => quotientModuleLevelToAdicLevelEquiv d n (x.val n),\n      by\n        intro m n hmn\n        change\n          AdicCompletion.transitionMap\n              (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) (d.A ⧸ d.q) hmn\n              (quotientModuleLevelToAdicLevelEquiv d n (x.val n)) =\n            quotientModuleLevelToAdicLevelEquiv d m (x.val m)\n        rw [← x.property hmn]\n        induction x.val n using Submodule.Quotient.induction_on with\n        | H z =>\n            change\n              Submodule.Quotient.mk\n                  (p := (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ m •\n                    (⊤ : Submodule (d.A ⧸ d.q) (d.A ⧸ d.q))) z =\n                Submodule.Quotient.mk\n                  (p := (Ideal.map (Ideal.Quotient.mk d.q) d.𝔪) ^ m •\n                    (⊤ : Submodule (d.A ⧸ d.q) (d.A ⧸ d.q))) z\n            rfl⟩", "proof_size_lean": 1020, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 26, "proof_size_tex": 182, "effort_local": 0, "proof_size_tex_total": 13536, "proof_size_lean_total": 24923, "effort_total": 0}, "def:quotient_adic_completion_to_quotient_module_completion": {"id": "def:quotient_adic_completion_to_quotient_module_completion", "type": "definition", "title": "From quotient adic completion to module completion", "chapter": "The Anderson counterexample", "statement": "The inverse levelwise comparison maps assemble into a map from the intrinsic\n  quotient adic completion back to the \\(A\\)-module completion.", "uses": ["def:quotient_adic_completion", "def:quotient_module_level_to_adic_level_equiv"], "lean_name": "Run202608192034.TODO.quotientAdicCompletionToQuotientModuleCompletion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Send a compatible family levelwise through the inverse finite-level\n  equivalence; the transition-map check again reduces to representatives.\n", "lean_source": "noncomputable def quotientAdicCompletionToQuotientModuleCompletion\n    (d : BadQuotientSourceData) :\n    quotientAdicCompletion d → AdicCompletion d.𝔪 (d.A ⧸ d.q) :=\n  fun x =>\n    ⟨fun n => (quotientModuleLevelToAdicLevelEquiv d n).symm (x.val n),\n      by\n        intro m n hmn\n        change\n          AdicCompletion.transitionMap d.𝔪 (d.A ⧸ d.q) hmn\n              ((quotientModuleLevelToAdicLevelEquiv d n).symm (x.val n)) =\n            (quotientModuleLevelToAdicLevelEquiv d m).symm (x.val m)\n        rw [← x.property hmn]\n        induction x.val n using Submodule.Quotient.induction_on with\n        | H z =>\n            change\n              Submodule.Quotient.mk\n                  (p := d.𝔪 ^ m • (⊤ : Submodule d.A (d.A ⧸ d
