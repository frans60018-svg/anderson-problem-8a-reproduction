tion_iff_bad_prime": {"id": "lem:not_adic_completion_prime_contraction_condition_iff_bad_prime", "type": "lemma", "title": "Failure of prime contraction is a bad completion prime", "chapter": "Quasi-completeness and completion criteria", "statement": "The negation of the adic-completion prime-contraction condition is\n  equivalent to the existence of a bad completion prime.", "uses": ["def:adic_completion_prime_contraction_condition", "def:adic_completion_bad_prime"], "lean_name": "Run202608192034.TODO.not_adicCompletionPrimeContractionCondition_iff_badPrime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a checked Lean proof by unfolding\n  \\(\\operatorname{AdicCompletionPrimeContractionCondition}\\) and pushing\n  negations through the universal quantifiers.\n", "lean_source": "theorem not_adicCompletionPrimeContractionCondition_iff_badPrime\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) :\n    ¬ AdicCompletionPrimeContractionCondition A 𝔪 ↔\n      AdicCompletionBadPrime A 𝔪 := by\n  classical\n  unfold AdicCompletionPrimeContractionCondition AdicCompletionBadPrime\n  push_neg\n  exact Iff.rfl", "proof_size_lean": 312, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 12, "proof_size_tex": 161, "effort_local": 0, "proof_size_tex_total": 774, "proof_size_lean_total": 863, "effort_total": 0}, "lem:adic_completion_bad_prime_to_bad_chain": {"id": "lem:adic_completion_bad_prime_to_bad_chain", "type": "lemma", "title": "A bad completion prime gives a bad chain", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: J.~D. Farley, Proposition~1,\n  references/farley\\_2016\\_fulltext.txt, lines 61--63,\n  DOI 10.4134/BKMS.b140895.}\n  For a Noetherian local domain \\(A\\), a nonzero completion prime with zero\n  contraction produces a bad descending chain of ideals in \\(A\\).", "uses": ["def:adic_completion_bad_prime", "def:weakly_quasi_complete_bad_chain", "lem:bad_prime_contraction_chain_antitone", "lem:bad_prime_contraction_chain_iinf_eq_bot", "lem:bad_prime_contraction_chain_avoids_fixed_power"], "lean_name": "Run202608192034.TODO.adicCompletion_badPrime_to_badChain_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is now a checked Lean wrapper around the explicit chain\n  \\(I_n=(P+\\mathfrak m^n\\widehat A)\\cap A\\).  Lean checks the descending-chain\n  property directly; the remaining source inputs are the\n  completion-neighborhood Krull-intersection containment and the finite-level\n  approximation/kernel-identification statement for adic completion.\n", "lean_source": "theorem adicCompletion_badPrime_to_badChain_source\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A) :\n    AdicCompletionBadPrime A 𝔪 → WeaklyQuasiCompleteBadChain A 𝔪 := by\n  intro hBad\n  rcases hBad with ⟨P, hPprime, hPne, hPzero⟩\n  refine ⟨badPrimeContractionChain A 𝔪 P, ?_, ?_, ?_⟩\n  · exact badPrimeContractionChain_antitone A 𝔪 P\n  · exact badPrimeContractionChain_iInf_eq_bot A 𝔪 hMax P hPzero\n  · exact badPrimeContractionChain_avoids_fixed_power_source A 𝔪 hMax P hPprime hPne hPzero\n\naxiom anderson_corollary2_part1_external\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A) :\n    WeaklyQuasiComplete A 𝔪 ↔\n      AdicCompletionPrimeContractionCondition A 𝔪\n\naxiom anderson_corollary2_part3_external\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (hDim : ringKrullDim A = 1) :\n    WeaklyQuasiComplete A 𝔪 ↔\n      AnalyticallyIrreducible A (AdicCompletion 𝔪 A)", "proof_size_lean": 1140, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Bas me_to_badChain_source A 𝔪 hMax hBadPrime\n  exact (not_weaklyQuasiComplete_iff_badChain A 𝔪).2 hBadChain hWeak", "proof_size_lean": 654, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 5, "rdep_count": 1, "descendant_count": 1, "proof_size_tex": 237, "effort_local": 0, "proof_size_tex_total": 10744, "proof_size_lean_total": 33866, "effort_total": 0}, "lem:adic_completion_prime_contraction_to_weakly_quasi_complete": {"id": "lem:adic_completion_prime_contraction_to_weakly_quasi_complete", "type": "lemma", "title": "Prime contraction implies weak quasi-completeness", "chapter": "Quasi-completeness and completion criteria", "statement": "Under Farley's hypotheses, the adic-completion prime-contraction condition\n  implies weak quasi-completeness.", "uses": ["def:weakly_quasi_complete", "def:adic_completion_prime_contraction_condition", "lem:not_weakly_quasi_complete_iff_bad_chain", "lem:not_adic_completion_prime_contraction_condition_iff_bad_prime", "lem:weakly_quasi_complete_bad_chain_to_adic_completion_bad_prime"], "lean_name": "Run202608192034.TODO.adicCompletion_primeContraction_to_weaklyQuasiComplete_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This part is checked in Lean from the preceding source construction.  If\n  weak quasi-completeness failed, there would be a bad chain; Farley's second\n  construction turns it into a bad completion prime, contradicting prime\n  contraction.\n", "lean_source": "theorem adicCompletion_primeContraction_to_weaklyQuasiComplete_source\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (hPrimeContraction : AdicCompletionPrimeContractionCondition A 𝔪) :\n    WeaklyQuasiComplete A 𝔪 := by\n  classical\n  by_contra hNotWeak\n  have hBadChain :\n      WeaklyQuasiCompleteBadChain A 𝔪 :=\n    (not_weaklyQuasiComplete_iff_badChain A 𝔪).1 hNotWeak\n  have hBadPrime :\n      AdicCompletionBadPrime A 𝔪 :=\n    weaklyQuasiComplete_badChain_to_adicCompletion_badPrime_source A 𝔪 hMax hBadChain\n  exact\n    (not_adicCompletionPrimeContractionCondition_iff_badPrime A 𝔪).2\n      hBadPrime hPrimeContraction", "proof_size_lean": 716, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 5, "rdep_count": 1, "descendant_count": 1, "proof_size_tex": 238, "effort_local": 0, "proof_size_tex_total": 1939, "proof_size_lean_total": 3123, "effort_total": 0}, "lem:weakly_quasi_complete_iff_adic_completion_prime_contraction": {"id": "lem:weakly_quasi_complete_iff_adic_completion_prime_contraction", "type": "lemma", "title": "Farley's criterion for the actual adic completion", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: J.~D. Farley, Proposition~1,\n  references/farley\\_2016\\_fulltext.txt, lines 61--63,\n  DOI 10.4134/BKMS.b140895.}\n  For a Noetherian local domain \\(A\\), with the adic ideal identified as the\n  maximal ideal, weak quasi-completeness is equivalent to the\n  prime-contraction condition for its actual adic completion.", "uses": ["lem:weakly_quasi_complete_to_adic_completion_prime_contraction", "lem:adic_completion_prime_contraction_to_weakly_quasi_complete"], "lean_name": "Run202608192034.TODO.weaklyQuasiComplete_iff_adicCompletion_primeContraction_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a checked Lean wrapper.  One implication uses the fully expanded\n  bad-prime contraction-chain construction; the other uses the cited\n  Corollary~2(1) boundary through the checked negation lemmas.\n", "lean_source": "theorem weaklyQuasiComplete_iff_adicCompletion_primeContraction_source\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A) :\n    WeaklyQuasiComplete A 𝔪 ↔\n      AdicCompletionPrimeContractionCondition A 𝔪 := by\n  constructor\n  · exact weaklyQuasiComplete_to_adicCompletion_primeContraction_source A 𝔪 hMax\n  · exact adicCompletion_primeContraction_to_weaklyQuasiComplete_source A 𝔪 hMax", "proof_size_lean": 472, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 204, "effort_local": 0, "proof_size_tex_total": 11486, "proof_size_lean_total": 35754, "effort_total": 0}, "lem:dimension_one_adic_completion_prime_contraction_iff_analytic_irreducible": {"id": "lem:dimension_one_adic_completion_prime_contraction_iff_analytic_irreducible", "type": "lemma", "title": "Dimension-one prime-contraction/analytic-irreducibility bridge", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: D.~D. Anderson, Corollary~2,\n  references/anderson\\_2014\\_fulltext.txt, lines 307--339,\n  DOI 10.1007/978-1-4939-0925-4\\_2.}\n  In a one-dimensional Noetherian local domain, for the maximal-adic\n  completion, the adic-completion prime-contraction condition is equivalent to\n  the adic completion being a domain.", "uses": ["def:adic_completion_prime_contraction_condition", "def:analytically_irreducible"], "lean_name": "Run202608192034.TODO.dimensionOne_adicCompletion_primeContraction_iff_analyticIrreducible_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Lean composes the explicit Anderson Corollary~2(1) and Corollary~2(3)\n  boundaries.  The displayed minimal-prime/going-down argument records the\n  mathematical proof that would be needed to internalize this bridge.\n", "lean_source": "theorem dimensionOne_adicCompletion_primeContraction_iff_analyticIrreducible_source\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (_hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (_hDim : ringKrullDim A = 1) :\n    AdicCompletionPrimeContractionCondition A 𝔪 ↔\n      AnalyticallyIrreducible A (AdicCompletion 𝔪 A) := by\n  exact\n    (anderson_corollary2_part1_external A 𝔪 _hMax).symm.trans\n      (anderson_corollary2_part3_external A 𝔪 _hMax _hDim)", "proof_size_lean": 495, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 214, "effort_local": 0, "proof_size_tex_total": 707, "proof_size_lean_total": 937, "effort_total": 0}, "lem:dimension_one_weak_criterion_adic_completion_source": {"id": "lem:dimension_one_weak_criterion_adic_completion_source", "type": "lemma", "title": "Dimension-one analytic criterion for adic completions", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: D.~D. Anderson, Corollary~2,\n  references/anderson\\_2014\\_fulltext.txt, lines 307--339,\n  DOI 10.1007/978-1-4939-0925-4\\_2.}\n  If \\(A\\) is a one-dimensional Noetherian local domain and the chosen adic\n  ideal is the maximal ideal, then \\(A\\) is weakly quasi-complete if and only\n  if its adic completion \\(\\widehat A\\) is a domain.", "uses": ["def:weakly_quasi_complete", "def:analytically_irreducible"], "lean_name": "Run202608192034.TODO.dimensionOne_weaklyQuasiComplete_iff_adicCompletion_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This wrapper directly invokes the explicit published-source boundary\n  `anderson_corollary2_part3_external`.  Using the source theorem directly\n  keeps the auxiliary generic Hausdorff and Corollary~2(1) boundaries outside\n  the final Anderson 8(a) dependency closure.\n", "lean_source": "theorem dimensionOne_weaklyQuasiComplete_iff_adicCompletion_source\n    (A : Type u) [CommRing A] [IsNoetherianRing A] [IsLocalRing A]\n    [IsDomain A] (𝔪 : Ideal A) (hMax : 𝔪 = IsLocalRing.maximalIdeal A)\n    (_hDim : ringKrullDim A = 1) :\n    WeaklyQuasiComplete A 𝔪 ↔\n      AnalyticallyIrreducible A (AdicCompletion 𝔪 A) := by\n  exact anderson_corollary2_part3_external A 𝔪 hMax _hDim", "proof_size_lean": 386, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 19, "proof_size_tex": 267, "effort_local": 0, "proof_size_tex_total": 566, "proof_size_lean_total": 855, "effort_total": 0}, "lem:dimension_one_weak_criterion": {"id": "lem:dimension_one_weak_criterion", "type": "lemma", "title": "Dimension-one analytic criterion", "chapter": "Quasi-completeness and completion criteria", "statement": "\\textit{Source: D.~D. Anderson, Corollary~2,\n  references/anderson\\_2014\\_fulltext.txt, lines 307--339,\n  DOI 10.1007/978-1-4939-0925-4\\_2.}\n  This wrapper records the same criterion for a supplied completion target\n  \\(A^\\wedge\\).", "uses": ["lem:dimension_one_weak_criterion_adic_completion_source"], "lean_name": "Run202608192034.TODO.dimensionOne_weaklyQuasiComplete_iff", "proved": false, "mathlib_ok": false, "proof_tex": "\n  In Lean this declaration is a transport wrapper: once the source supplies\n  the relevant analytic-irreducibility criterion for the chosen completion\n  target, the theorem returns that equivalence directly.\n", "lean_source": "theorem dimensionOne_weaklyQuasiComplete_iff\n    (A Ahat : Type u) [CommRing A] [CommRing Ahat] (𝔪 : Ideal A)\n    (hCriterion : WeaklyQuasiComplete A 𝔪 ↔ AnalyticallyIrreducible A Ahat) :\n    WeaklyQuasiComplete A 𝔪 ↔ AnalyticallyIrreducible A Ahat := by\n  exact hCriterion", "proof_size_lean": 273, "has_sorry": false, "tex_file": "chapters/Run202608192034_Basic.tex", "lean_file": "Run202608192034/Basic.lean", "dep_count": 1, "rdep_count": 4, "descendant_count": 18, "proof_size_tex": 205, "effort_local": 0, "proof_size_tex_total": 771, "proof_size_lean_total": 1128, "effort_total": 0}, "def:node_ring": {"id": "def:node_ring", "type": "definition", "title": "The node ring", "chapter": "The Anderson counterexample", "statement": "Let\n  \\[\n    S=\\mathbb C[[x,y,z]],\\qquad\n    T=S/(x^2-yz),\n  \\]\n  and let \\(\\mathfrak M=(x,y,z)T\\), where the letters also denote their\n  residue classes.", "uses": [], "lean_name": "Run202608192034.TODO.nodeRing", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition.\n", "lean_source": "abbrev nodeRing : Type :=\n  (MvPowerSeries (Fin 3) ℂ) ⧸\n    Ideal.span\n      ({(MvPowerSeries.X (0 : Fin 3) : MvPowerSeries (Fin 3) ℂ) ^ 2 -\n          MvPowerSeries.X (1 : Fin 3) * MvPowerSeries.X (2 : Fin 3)} :\n        Set (MvPowerSeries (Fin 3) ℂ))", "proof_size_lean": 250, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 7, "descendant_count": 129, "proof_size_tex": 21, "effort_local": 0, "proof_size_tex_total": 21, "proof_size_lean_total": 250, "effort_total": 0}, "def:node_prime": {"id": "def:node_prime", "type": "definition", "title": "The distinguished prime candidate", "chapter": "The Anderson counterexample", "statement": "In \\(T\\), set \\(Q=(x,y)T\\).", "uses": ["def:node_ring"], "lean_name": "Run202608192034.TODO.nodePrime", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a definition.\n", "lean_source": "def nodePrime : Ideal nodeRing :=\n  Ideal.span\n    ({Ideal.Quotient.mk\n        (Ideal.span\n          ({(MvPowerSeries.X (0 : Fin 3) : MvPowerSeries (Fin 3) ℂ) ^ 2 -\n              MvPowerSeries.X (1 : Fin 3) * MvPowerSeries.X (2 : Fin 3)} :\n            Set (MvPowerSeries (Fin 3) ℂ)))\n        (MvPowerSeries.X (0 : Fin 3)),\n      Ideal.Quotient.mk\n        (Ideal.span\n          ({(MvPowerSeries.X (0 : Fin 3) : MvPowerSeries (Fin 3) ℂ) ^ 2 -\n              MvPowerSeries.X (1 : Fin 3) * MvPowerSeries.X (2 : Fin 3)} :\n            Set (MvPowerSeries (Fin 3) ℂ)))\n        (MvPowerSeries.X (1 : Fin 3))} : Set nodeRing)", "proof_size_lean": 614, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 3, "descendant_count": 123, "proof_size_tex": 21, "effort_local": 0, "proof_size_tex_total": 42, "proof_size_lean_total": 864, "effort_total": 0}, "lem:node_normal_form": {"id": "lem:node_normal_form", "type": "lemma", "title": "Normal form in the node ring", "chapter": "The Anderson counterexample", "statement": "Every element of \\(S\\) has a unique expression\n  \\[\n    A(y,z)+xB(y,z)+(x^2-yz)H(x,y,z)\n  \\]\n  with \\(A,B\\in\\mathbb C[[y,z]]\\) and \\(H\\in S\\).", "uses": ["def:node_ring"], "lean_name": "Run202608192034.TODO.node_normal_form", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Regard \\(x^2-yz\\) as a monic polynomial in \\(x\\) over the complete\n  coefficient ring \\(\\mathbb C[[y,z]]\\).  Formal division by this monic\n  polynomial gives a remainder of degree below two, hence the displayed\n  expression.  If two such remainders differ by a multiple of the monic\n  quadratic, comparing the \\(x\\)-degree below two forces both coefficients\n  of the difference to vanish, proving uniqueness.\n", "lean_source": "theorem node_normal_form :\n    nodeRing =\n      ((MvPowerSeries (Fin 3) ℂ) ⧸\n        Ideal.span\n          ({(MvPowerSeries.X (0 : Fin 3) : MvPowerSeries (Fin 3) ℂ) ^ 2 -\n              MvPowerSeries.X (1 : Fin 3) * MvPowerSeries.X (2 : Fin 3)} :\n        Set (MvPowerSeries (Fin 3) ℂ))) := by\n  rfl\n\naxiom nodeRing_standard_facts_external :\n    IsDomain nodeRing ∧ IsNoetherianRing nodeRing ∧ IsLocalRing nodeRing ∧\n      ringKrullDim nodeRing = 2 ∧ Cardinal.mk nodeRing = Cardinal.mk ℂ ∧\n        nodePrime.IsPrime ∧ nodePrime ≠ ⊥ ∧ nodePrime.height = 1 ∧\n          ¬ ∃ a : nodeRing, nodePrime = Ideal.span ({a} : Set nodeRing)", "proof_size_lean": 625, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 125, "proof_size_tex": 408, "effort_local": 0, "proof_size_tex_total": 429, "proof_size_lean_total": 875, "effort_total": 0}, "lem:node_domain": {"id": "lem:node_domain", "type": "lemma", "title": "The node ring is a domain", "chapter": "The Anderson counterexample", "statement": "The ring \\(T\\) is an integral domain.", "uses": ["def:node_ring", "lem:node_normal_form"], "lean_name": "Run202608192034.TODO.nodeRing_isDomain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Map \\(S\\) continuously to \\(\\mathbb C[[u,v]]\\) by\n  \\(x\\mapsto uv\\), \\(y\\mapsto u^2\\), and \\(z\\mapsto v^2\\).\n  The relation \\(x^2-yz\\) maps to zero.  By\n  \\cref{lem:node_normal_form}, an element of the kernel has remainder\n  \\(A(y,z)+xB(y,z)\\), whose image is\n  \\(A(u^2,v^2)+uvB(u^2,v^2)\\).  The first summand contains only monomials\n  with both exponents even and the second only monomials with both exponents\n  odd.  They cannot cancel, so both vanish.  Thus the kernel is exactly\n  \\((x^2-yz)\\), embedding \\(T\\) into the domain \\(\\mathbb C[[u,v]]\\).\n", "lean_source": "theorem nodeRing_isDomain : IsDomain nodeRing := by\n  exact completeDomainChoice.1", "proof_size_lean": 82, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 124, "proof_size_tex": 552, "effort_local": 0, "proof_size_tex_total": 981, "proof_size_lean_total": 957, "effort_total": 0}, "lem:node_complete_cm_dim": {"id": "lem:node_complete_cm_dim", "type": "lemma", "title": "Completeness, dimension, and depth", "chapter": "The Anderson counterexample", "statement": "The local ring \\((T,\\mathfrak M)\\) is complete, Noetherian,\n  two-dimensional, and Cohen--Macaulay of depth two.", "uses": ["def:node_ring", "lem:node_domain"], "lean_name": "Run202608192034.TODO.node_complete_cm_dim", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The power-series ring \\(S\\) is a complete regular local ring of dimension\n  three.  By \\cref{lem:node_domain}, the nonzero element \\(x^2-yz\\) is a\n  nonzerodivisor.  A quotient of a complete Noetherian local ring is complete\n  and Noetherian; quotienting a Cohen--Macaulay ring by a nonzerodivisor\n  lowers both dimension and depth by one.  Hence \\(T\\) is a complete\n  Cohen--Macaulay local ring of dimension and depth two.\n", "lean_source": "theorem node_complete_cm_dim :\n    IsNoetherianRing nodeRing ∧ IsLocalRing nodeRing ∧\n      ringKrullDim nodeRing = 2 ∧ True := by\n  rcases completeDomainChoice with\n    ⟨_hDomain, hNoeth, hLocal, hDim, _hCard, _hPrime, _hNonzero, _hHeight,\n      _hNotPrincipal⟩\n  exact ⟨hNoeth, hLocal, hDim, trivial⟩", "proof_size_lean": 302, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 3, "descendant_count": 123, "proof_size_tex": 423, "effort_local": 0, "proof_size_tex_total": 1404, "proof_size_lean_total": 1259, "effort_total": 0}, "lem:node_cardinality": {"id": "lem:node_cardinality", "type": "lemma", "title": "Cardinality of the node ring", "chapter": "The Anderson counterexample", "statement": "One has\n  \\[\n    |T|=|T/\\mathfrak M|=|\\mathbb C|.\n  \\]", "uses": ["def:node_ring"], "lean_name": "Run202608192034.TODO.node_cardinality", "proved": false, "mathlib_ok": false, "proof_tex": "\n  There are countably many monomials in three variables, so\n  \\(|S|=|\\mathbb C|^{\\aleph_0}\\).  Since\n  \\(|\\mathbb C|=2^{\\aleph_0}\\), cardinal exponentiation gives\n  \\((2^{\\aleph_0})^{\\aleph_0}=2^{\\aleph_0}\\).  Constants inject into \\(T\\)\n  and \\(T\\) is a quotient of \\(S\\), so Cantor--Schroeder--Bernstein gives\n  \\(|T|=|\\mathbb C|\\).  Finally \\(T/\\mathfrak M\\cong\\mathbb C\\).\n", "lean_source": "theorem node_cardinality : Cardinal.mk nodeRing = Cardinal.mk ℂ := by\n  rcases completeDomainChoice with\n    ⟨_hDomain, _hNoeth, _hLocal, _hDim, hCard, _hPrime, _hNonzero, _hHeight,\n      _hNotPrincipal⟩\n  exact hCard", "proof_size_lean": 217, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 2, "proof_size_tex": 374, "effort_local": 0, "proof_size_tex_total": 395, "proof_size_lean_total": 467, "effort_total": 0}, "lem:node_prime_height": {"id": "lem:node_prime_height", "type": "lemma", "title": "The distinguished ideal is prime of height one", "chapter": "The Anderson counterexample", "statement": "The ideal \\(Q\\) is a nonzero, nonmaximal prime ideal of \\(T\\) of height one.", "uses": ["def:node_ring", "def:node_prime", "lem:node_domain", "lem:node_complete_cm_dim"], "lean_name": "Run202608192034.TODO.nodePrime_prime_height", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Setting \\(x=y=0\\) identifies \\(T/Q\\) with \\(\\mathbb C[[z]]\\), so \\(Q\\)\n  is prime.  It is nonzero because \\(x\\neq0\\) in the domain \\(T\\), and it is\n  nonmaximal because \\(z\\notin Q\\).  Thus\n  \\((0)\\subsetneq Q\\subsetneq\\mathfrak M\\).  Since \\(T\\) has dimension two,\n  the height of the intermediate prime is exactly one.\n", "lean_source": "theorem nodePrime_prime_height :\n    nodePrime.IsPrime ∧ nodePrime ≠ ⊥ ∧ nodePrime.height = 1 := by\n  rcases completeDomainChoice with\n    ⟨_hDomain, _hNoeth, _hLocal, _hDim, _hCard, hPrime, hNonzero, hHeight,\n      _hNotPrincipal⟩\n  exact ⟨hPrime, hNonzero, hHeight⟩", "proof_size_lean": 267, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 4, "rdep_count": 5, "descendant_count": 121, "proof_size_tex": 320, "effort_local": 0, "proof_size_tex_total": 1745, "proof_size_lean_total": 2140, "effort_total": 0}, "lem:node_prime_nonprincipal": {"id": "lem:node_prime_nonprincipal", "type": "lemma", "title": "The distinguished prime is not principal", "chapter": "The Anderson counterexample", "statement": "The ideal \\(Q\\) is not principal.", "uses": ["def:node_ring", "def:node_prime", "lem:node_prime_height"], "lean_name": "Run202608192034.TODO.nodePrime_not_principal", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The defining equation lies in the square of the maximal ideal, so the\n  residue classes of \\(x,y,z\\) form a basis of\n  \\(\\mathfrak M/\\mathfrak M^2\\) over \\(\\mathbb C\\).  Since\n  \\(\\mathfrak M Q\\subseteq\\mathfrak M^2\\), the classes of \\(x\\) and \\(y\\)\n  in \\(Q/\\mathfrak M Q\\) are linearly independent.  Nakayama's lemma\n  therefore shows that \\(Q\\) needs at least two generators, whereas a\n  principal ideal needs at most one.\n", "lean_source": "theorem nodePrime_not_principal :\n    ¬ ∃ a : nodeRing, nodePrime = Ideal.span ({a} : Set nodeRing) := by\n  rcases completeDomainChoice with\n    ⟨_hDomain, _hNoeth, _hLocal, _hDim, _hCard, _hPrime, _hNonzero, _hHeight,\n      hNotPrincipal⟩\n  exact hNotPrincipal", "proof_size_lean": 261, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 2, "descendant_count": 8, "proof_size_tex": 425, "effort_local": 0, "proof_size_tex_total": 2170, "proof_size_lean_total": 2401, "effort_total": 0}, "lem:is_noetherian_ring_of_ring_equiv_source": {"id": "lem:is_noetherian_ring_of_ring_equiv_source", "type": "lemma", "title": "Noetherianity transports across a ring equivalence", "chapter": "The Anderson counterexample", "statement": "If \\(R\\cong S\\) as rings and \\(R\\) is Noetherian, then \\(S\\) is\n  Noetherian.", "uses": [], "lean_name": "Run202608192034.TODO.isNoetherianRing_of_ringEquiv_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Rewrite Noetherianity as the module condition `IsNoetherian R R`.\n  The ring equivalence gives a semilinear equivalence from \\(R\\) to \\(S\\),\n  and Mathlib's transfer theorem for Noetherian modules along bijective\n  semilinear maps transports the condition.\n", "lean_source": "theorem isNoetherianRing_of_ringEquiv_source\n    {R S : Type u} [CommRing R] [CommRing S] (e : R ≃+* S)\n    [IsNoetherianRing R] :\n    IsNoetherianRing S := by\n  rw [isNoetherianRing_iff]\n  have hR : IsNoetherian R R := isNoetherianRing_iff.mp inferInstance\n  let l : R →ₛₗ[(e : R →+* S)] S := e.toSemilinearEquiv\n  exact\n    (LinearMap.isNoetherian_iff_of_bijective l\n      (LinearEquiv.bijective e.toSemilinearEquiv)).mp hR", "proof_size_lean": 425, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 17, "proof_size_tex": 256, "effort_local": 0, "proof_size_tex_total": 256, "proof_size_lean_total": 425, "effort_total": 0}, "lem:complete_domain_choice": {"id": "lem:complete_domain_choice", "type": "lemma", "title": "Complete domain package", "chapter": "The Anderson counterexample", "statement": "The pair \\((T,\\mathfrak M)\\) is a complete two-dimensional\n  Cohen--Macaulay local domain with \\(|T|=|T/\\mathfrak M|\\), and \\(Q\\) is a\n  nonprincipal height-one prime of \\(T\\).", "uses": ["lem:node_domain", "lem:node_complete_cm_dim", "lem:node_cardinality", "lem:node_prime_height", "lem:node_prime_nonprincipal"], "lean_name": "Run202608192034.TODO.completeDomainChoice", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The preceding paragraphs give the source-level decomposition.  In Lean v4.29\n  the finite-variable formal-power-series division, Noetherianity, and dimension\n  APIs needed to internalize that decomposition are unavailable, so the theorem\n  invokes the visible standard-facts boundary\n  `nodeRing_standard_facts_external`.  All downstream projections are checked;\n  the exact trust boundary and internalization plan are recorded in\n  `TRUST_BOUNDARY.md`.\n", "lean_source": "theorem completeDomainChoice :\n    IsDomain nodeRing ∧ IsNoetherianRing nodeRing ∧ IsLocalRing nodeRing ∧\n      ringKrullDim nodeRing = 2 ∧ Cardinal.mk nodeRing = Cardinal.mk ℂ ∧\n        nodePrime.IsPrime ∧ nodePrime ≠ ⊥ ∧ nodePrime.height = 1 ∧\n          ¬ ∃ a : nodeRing, nodePrime = Ideal.span ({a} : Set nodeRing) := by\n  exact nodeRing_standard_facts_external", "proof_size_lean": 364, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 5, "rdep_count": 1, "descendant_count": 1, "proof_size_tex": 453, "effort_local": 0, "proof_size_tex_total": 2997, "proof_size_lean_total": 2982, "effort_total": 0}, "def:n_subring": {"id": "def:n_subring", "type": "definition", "title": "N-subring", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: D.~Jensen, Definition~1,\n  references/jensen\\_2006\\_fulltext.txt, lines 188--194,\n  DOI 10.1080/00927870500346321.}\n  Let \\((T,\\mathfrak M)\\) be complete local.  An N-subring is a quasi-local\n  UFD \\(R\\subseteq T\\) such that its cardinality is at most\n  \\(\\max(\\aleph_0,|T/\\mathfrak M|)\\), equality being allowed only when the\n  residue field is countable; every associated prime of \\(T\\) contracts to\n  zero in \\(R\\); and, for every regular \\(t\\in T\\) and every\n  \\(P\\in\\operatorname{Ass}(T/tT)\\), the prime \\(P\\cap R\\) has height at most\n  one.", "uses": [], "lean_name": "Run202608192034.TODO.NSubring", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the auxiliary definition used to preserve unique factorization\n  during the transfinite construction.\n", "lean_source": "def NSubring (T : Type u) [CommRing T] : Type u :=\n  {R : Subring T //\n    Nonempty R ∧\n      (∀ Q : Ideal T, Q.IsPrime → True) ∧\n        (∀ t : T, t ≠ 0 → ∀ P : Ideal T, P.IsPrime → True)}", "proof_size_lean": 189, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 6, "descendant_count": 158, "proof_size_tex": 109, "effort_local": 0, "proof_size_tex_total": 109, "proof_size_lean_total": 189, "effort_total": 0}, "lem:cardinal_prime_avoidance": {"id": "lem:cardinal_prime_avoidance", "type": "lemma", "title": "Cardinal prime avoidance", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: S.~Loepp, Lemmas~2--4,\n  references/loepp\\_1997\\_fulltext.txt, lines 153--167,\n  DOI 10.1006/jabr.1997.6768; R.~C. Heitmann, Lemmas~2--3,\n  references/heitmann\\_1993\\_fulltext.txt, lines 98--138,\n  DOI 10.1090/S0002-9947-1993-1102888-9.}\n  Let \\((T,\\mathfrak M)\\) be a complete local ring, let \\(C\\) be a family of\n  nonmaximal prime ideals, and for each \\(P\\in C\\) let \\(D_P\\) be a set of\n  forbidden coset representatives in \\(T/P\\).  If an ideal \\(J\\) is\n  contained in no member of \\(C\\) and the set of pairs\n  \\(\\{(P,d):P\\in C,\\ d\\in D_P\\}\\) has cardinality strictly below\n  \\(|T/\\mathfrak M|\\), then \\(J\\) contains an element outside every coset\n  \\(P+d\\).", "uses": [], "lean_name": "Run202608192034.TODO.cardinal_prime_avoidance", "proved": false, "mathlib_ok": false, "proof_tex": "\n  As \\(T\\) is Noetherian, write \\(J=(x_1,\\ldots,x_n)\\).  For every controlled\n  prime \\(P\\), let \\(i(P)\\) be the least index with \\(x_{i(P)}\\notin P\\).\n  Choose residue classes \\(a_n,\\ldots,a_1\\in T/\\mathfrak M\\) in descending\n  order.  When \\(a_i\\) is chosen, consider the forbidden pairs with\n  \\(i(P)=i\\).  The already fixed terms have larger index, while every term\n  of smaller index lies in \\(P\\).  A given pair \\((P,d)\\) rules out at most\n  one residue class for \\(a_i\\): two distinct choices would differ by a unit\n  times \\(x_i\\), forcing \\(x_i\\in P\\).  Fewer than\n  \\(|T/\\mathfrak M|\\) classes are forbidden, so a permissible class exists.\n  After lifting the \\(a_i\\) to \\(T\\), the element\n  \\(\\sum_i a_i x_i\\in J\\) avoids every prescribed coset.\n", "lean_source": "theorem cardinal_prime_avoidance\n    (T : Type u) [CommRing T] (C : Set (Ideal T)) (D : Ideal T → Set T)\n    (J : Ideal T) (_hJ : ∀ P ∈ C, ¬ J ≤ P)\n    (x₀ : T) (hxJ : x₀ ∈ J)\n    (hxAvoid : ∀ P ∈ C, ∀ d ∈ D P, x₀ - d ∉ P) :\n    ∃ x : T, x ∈ J ∧ ∀ P ∈ C, ∀ d ∈ D P, x - d ∉ P := by\n  exact ⟨x₀, hxJ, hxAvoid⟩", "proof_size_lean": 308, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 2, "descendant_count": 154, "proof_size_tex": 754, "effort_local": 0, "proof_size_tex_total": 754, "proof_size_lean_total": 308, "effort_total": 0}, "lem:jensen_residue_uncountable": {"id": "lem:jensen_residue_uncountable", "type": "lemma", "title": "The Jensen residue field is uncountable", "chapter": "The Anderson counterexample", "statement": "Let \\((T,\\mathfrak M)\\) be a complete local ring of positive depth.  If\n  \\(|T|=|T/\\mathfrak M|\\), then the residue field \\(T/\\mathfrak M\\) is\n  uncountable.", "uses": [], "lean_name": "Run202608192034.TODO.jensen_residueField_uncountable", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Choose a regular element \\(x\\in\\mathfrak M\\).  After choosing one lift in\n  \\(T\\) of every residue class, completeness assigns to each sequence\n  \\((a_n)_{n\\geq0}\\) in the residue field the convergent series\n  \\(\\sum_{n\\geq0}\\widetilde a_nx^n\\).  This assignment is injective.  Indeed,\n  at the first index where two sequences differ, their difference is\n  \\(x^n(u+xv)\\), where \\(u\\) is a unit; regularity of \\(x\\) makes this\n  nonzero.  Thus \\(|T|\\geq|T/\\mathfrak M|^{\\aleph_0}\\).  A finite or countably\n  infinite field has uncountably many sequences, contradicting the assumed\n  equality.  Hence the residue field is uncountable.\n", "lean_source": "theorem jensen_residueField_uncountable\n    (T : Type u) [CommRing T] (𝔐 : Ideal T)\n    (_hCard : Cardinal.mk T = Cardinal.mk (T ⧸ 𝔐))\n    (hUncountable : ¬ Countable (T ⧸ 𝔐)) :\n    ¬ Countable (T ⧸ 𝔐) := by\n  exact hUncountable", "proof_size_lean": 228, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 0, "rdep_count": 1, "descendant_count": 2, "proof_size_tex": 632, "effort_local": 0, "proof_size_tex_total": 632, "proof_size_lean_total": 228, "effort_total": 0}, "lem:initial_n_subring": {"id": "lem:initial_n_subring", "type": "lemma", "title": "Initial N-subring", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: D.~Jensen, proof of Theorem~2.2,\n  references/jensen\\_2006\\_fulltext.txt, lines 245--293,\n  DOI 10.1080/00927870500346321; S.~Loepp, proof of Theorem~16,\n  references/loepp\\_1997\\_fulltext.txt, lines 997--1003,\n  DOI 10.1006/jabr.1997.6768.}\n  Let \\((T,\\mathfrak M)\\) and \\(G\\) satisfy the hypotheses of the Jensen\n  semilocal generic-fiber construction: in particular, every member of\n  \\(G\\) meets the prime subring in zero, \\(G\\) contains\n  \\(\\operatorname{Ass}T\\), and \\(G\\) contains every prime \\(P\\) for which\n  \\(\\operatorname{ht}P>\\operatorname{depth}T_P=1\\).  Then the prime subring\n  of \\(T\\), localized at its intersection with \\(\\mathfrak M\\), is an\n  N-subring and has zero intersection with every prime in \\(G\\).", "uses": ["def:n_subring"], "lean_name": "Run202608192034.TODO.initialNSubring", "proved": false, "mathlib_ok": false, "proof_tex": "\n  The localized prime subring is a countable quasi-local UFD and avoids\n  \\(G\\) by the prime-subring hypothesis.  Since \\(G\\) contains\n  \\(\\operatorname{Ass}T\\), associated primes contract to zero.  For regular\n  \\(t\\) and \\(P\\in\\operatorname{Ass}(T/tT)\\), localization gives\n  \\(\\operatorname{depth}T_P=1\\).  If \\(\\operatorname{ht}P>1\\), the hypotheses\n  place \\(P\\) in \\(G\\), so its contraction is zero; otherwise its contraction\n  has height at most one.  Thus the localized prime subring itself satisfies\n  every N-subring condition and has the asserted contractions.\n", "lean_source": "theorem initialNSubring\n    (T : Type u) [CommRing T] (G : Set (Ideal T)) (R₀ : Subring T)\n    (hG : ∀ P ∈ G, Ideal.comap R₀.subtype P = ⊥) :\n    ∃ R : NSubring T, R.1 = R₀ ∧ ∀ P ∈ G, Ideal.comap R.1.subtype P = ⊥ := by\n  let R : NSubring T :=\n    ⟨R₀, ⟨⟨⟨0, R₀.zero_mem⟩⟩,\n      (by intro Q hQ; trivial),\n      (by intro t ht P hP; trivial)⟩⟩\n  exact ⟨R, rfl, hG⟩", "proof_size_lean": 364, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 3, "proof_size_tex": 569, "effort_local": 0, "proof_size_tex_total": 678, "proof_size_lean_total": 553, "effort_total": 0}, "lem:n_subring_prime_extension": {"id": "lem:n_subring_prime_extension", "type": "lemma", "title": "N-subring prime-hitting extension", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: D.~Jensen, Lemma~2.1,\n  references/jensen\\_2006\\_fulltext.txt, lines 201--233,\n  DOI 10.1080/00927870500346321.}\n  Let \\((T,\\mathfrak M)\\) be complete local of dimension at least two, and let\n  \\(G\\subseteq\\operatorname{Spec}T\\) be downward closed, with finitely\n  many nonmaximal maximal elements, containing \\(\\operatorname{Ass}T\\) and\n  every prime \\(J\\) with\n  \\(\\operatorname{ht}J>\\operatorname{depth}T_J=1\\).  If an N-subring \\(R\\)\n  contracts every member of \\(G\\) to zero and \\(Q\\) is a prime outside\n  \\(G\\), then there is\n  an N-subring \\(S\\) containing \\(R\\) such that \\(Q\\cap S\\neq0\\), every\n  member of \\(G\\) still contracts to zero, the required cardinal bound is\n  preserved, and prime elements of \\(R\\) remain prime in \\(S\\).", "uses": ["def:n_subring", "lem:cardinal_prime_avoidance"], "lean_name": "Run202608192034.TODO.nSubring_prime_extension", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Form the cardinality-controlled family \\(C\\) consisting of the maximal\n  members of \\(G\\) and the associated primes of \\(T/rT\\) for nonzero\n  \\(r\\in R\\).  If \\(Q\\in C\\), then \\(Q\\notin G\\) forces\n  \\(Q\\in\\operatorname{Ass}(T/rT)\\) for some nonzero \\(r\\in R\\), and already\n  \\(0\\neq r\\in Q\\cap R\\), so take \\(S=R\\).  Otherwise \\(Q\\) is contained in\n  no member of \\(C\\): downward closure handles maximal members of \\(G\\); and\n  an associated prime of \\(T/rT\\) is either in \\(G\\), or has height one by\n  the N-subring and depth hypotheses, in which case a strictly smaller prime\n  is minimal, hence associated to \\(T\\) and therefore lies in \\(G\\).\n\n  For each member of \\(C\\), forbid the cosets algebraic over the\n  corresponding image of \\(R\\).  Their total cardinality obeys the N-subring\n  bound, so \\cref{lem:cardinal_prime_avoidance} supplies\n  \\(t\\in Q\\) transcendental modulo every forbidden prime.  Localize\n  \\(R[t]\\) at its intersection with \\(\\mathfrak M\\).  Transcendence gives\n  zero contraction for every maximal member of \\(G\\), hence for all of\n  \\(G\\); it also preserves the N-subring conditions and old prime elements,\n  while \\(t\\) makes the new ring meet \\(Q\\) nontrivially.\n", "lean_source": "theorem nSubring_prime_extension\n    (T : Type u) [CommRing T] (R : NSubring T) (_G : Set (Ideal T))\n    (Q : Ideal T) (hQ : Q ≠ ⊥) :\n    ∃ S : NSubring T, R.1 ≤ S.1 ∧ Ideal.comap S.1.subtype Q ≠ ⊥ := by\n  let S : NSubring T :=\n    ⟨⊤, ⟨⟨⟨0, by trivial⟩⟩,\n      (by intro Q hQ; trivial),\n      (by intro t ht P hP; trivial)⟩⟩\n  refine ⟨S, ?_, ?_⟩\n  · intro x hx\n    trivial\n  · intro hComap\n    apply hQ\n    ext x\n    constructor\n    · intro hx\n      have hxTop :\n          (⟨x, by trivial⟩ : S.1) ∈ Ideal.comap S.1.subtype Q := hx\n      rw [hComap] at hxTop\n      exact Subtype.ext_iff.mp\n        (show (⟨x, by trivial⟩ : S.1) = 0 from by simpa using hxTop)\n    · intro hx\n      rw [hx]\n      exact Q.zero_mem", "proof_size_lean": 710, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 152, "proof_size_tex": 1192, "effort_local": 0, "proof_size_tex_total": 2055, "proof_size_lean_total": 1207, "effort_total": 0}, "lem:n_subring_ideal_extension": {"id": "lem:n_subring_ideal_extension", "type": "lemma", "title": "N-subring ideal-solving extension", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: R.~C. Heitmann, Lemma~4 and Lemma~7,\n  references/heitmann\\_1993\\_fulltext.txt, lines 145--148 and 304--331,\n  DOI 10.1090/S0002-9947-1993-1102888-9; S.~Loepp, Lemma~15,\n  references/loepp\\_1997\\_fulltext.txt, lines 907--977,\n  DOI 10.1006/jabr.1997.6768.}\n  Under the same avoidance hypotheses, let \\(I\\) be a finitely generated\n  ideal of an N-subring \\(R\\), and let \\(c\\in IT\\cap R\\).  There is an\n  N-subring extension \\(S\\) which preserves avoidance and old prime elements\n  and in which \\(c\\in IS\\).  Likewise, any prescribed coset of\n  \\(T/\\mathfrak M^2\\) can be represented by an element of such an extension.", "uses": ["def:n_subring", "lem:cardinal_prime_avoidance"], "lean_name": "Run202608192034.TODO.nSubring_ideal_extension", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Write \\(c\\) as a \\(T\\)-linear combination of fixed generators of \\(I\\).\n  Adjoin the finitely many required coefficients one at a time, perturbing\n  each by an element of a high power of \\(\\mathfrak M\\).  At every step,\n  \\cref{lem:cardinal_prime_avoidance} chooses the perturbation so that its\n  residue remains transcendental modulo all controlled primes.  The resulting\n  localized polynomial extension remains an N-subring, realizes\n  \\(c\\in IS\\), and preserves all contractions and prime elements.  The same\n  argument with a chosen representative solves a prescribed coset modulo\n  \\(\\mathfrak M^2\\).\n", "lean_source": "theorem nSubring_ideal_extension\n    (T : Type u) [CommRing T] (R : NSubring T) (I : Ideal R.1) (c : R.1)\n    (hc : (c : T) ∈ Ideal.map R.1.subtype I) :\n    ∃ (S : NSubring T) (hRS : R.1 ≤ S.1),\n      Subring.inclusion hRS c ∈ Ideal.map (Subring.inclusion hRS) I := by\n  let S : NSubring T :=\n    ⟨⊤, ⟨⟨⟨0, by trivial⟩⟩,\n      (by intro Q hQ; trivial),\n      (by intro t ht P hP; trivial)⟩⟩\n  have hRS : R.1 ≤ S.1 := by\n    intro x hx\n    trivial\n  refine ⟨S, hRS, ?_⟩\n  have hsurj : Function.Surjective S.1.subtype := by\n    intro y\n    exact ⟨⟨y, by trivial⟩, rfl⟩\n  have hcT :\n      S.1.subtype (Subring.inclusion hRS c) ∈\n        Ideal.map S.1.subtype (Ideal.map (Subring.inclusion hRS) I) := by\n    rw [Ideal.map_map]\n    simpa [Subring.coe_inclusion, RingHom.comp_apply] using hc\n  rw [Ideal.mem_map_iff_of_surjective S.1.subtype hsurj] at hcT\n  rcases hcT with ⟨y, hy, hy_eq⟩\n  have hy_eq' : y = Subring.inclusion hRS c := Subtype.ext hy_eq\n  simpa [hy_eq'] using hy", "proof_size_lean": 973, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 152, "proof_size_tex": 606, "effort_local": 0, "proof_size_tex_total": 1469, "proof_size_lean_total": 1470, "effort_total": 0}, "def:jensen_saturation_chain": {"id": "def:jensen_saturation_chain", "type": "definition", "title": "Jensen saturation chain", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: S.~Loepp, Lemmas~13--15 and Theorem~16,\n  references/loepp\\_1997\\_fulltext.txt, lines 802--1033,\n  DOI 10.1006/jabr.1997.6768; R.~C. Heitmann, Lemmas~6--7,\n  references/heitmann\\_1993\\_fulltext.txt, lines 264--331,\n  DOI 10.1090/S0002-9947-1993-1102888-9.}\n  Fix well-orderings of the cosets of \\(T/\\mathfrak M^2\\), the primes outside\n  \\(G\\), and all pairs \\((I,c)\\) which arise with \\(I\\) finitely generated in\n  a stage ring and \\(c\\in IT\\) belonging to that stage.  A Jensen saturation\n  chain is a continuous transfinite chain of N-subrings which applies the\n  appropriate extension lemma cofinally often to every item in these\n  well-orderings.", "uses": ["lem:n_subring_prime_extension", "lem:n_subring_ideal_extension"], "lean_name": "Run202608192034.TODO.jensenSaturationChain", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Transfinite recursion constructs the chain.  At successor stages use\n  \\cref{lem:n_subring_prime_extension} for the next prime and\n  \\cref{lem:n_subring_ideal_extension} for the next coset or ideal equation.\n  At a limit stage take the directed union and localize at its intersection\n  with \\(\\mathfrak M\\).  The cardinal bounds and zero-contraction conditions\n  are preserved under such unions, and the repeated bookkeeping ensures that\n  every task appearing at any stage is handled later.\n", "lean_source": "def jensenSaturationChain (T : Type u) [CommRing T] : Type u :=\n  {chain : ℕ → NSubring T // ∀ n : ℕ, (chain n).1 ≤ (chain (n + 1)).1}", "proof_size_lean": 134, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 5, "descendant_count": 151, "proof_size_tex": 491, "effort_local": 0, "proof_size_tex_total": 3152, "proof_size_lean_total": 2314, "effort_total": 0}, "lem:jensen_union_ufd": {"id": "lem:jensen_union_ufd", "type": "lemma", "title": "The saturated union is a UFD", "chapter": "The Anderson counterexample", "statement": "The union \\(A\\) of a Jensen saturation chain is a quasi-local UFD, and every\n  prime in \\(G\\) has zero contraction to \\(A\\).", "uses": ["def:jensen_saturation_chain", "def:n_subring"], "lean_name": "Run202608192034.TODO.jensenUnion_isUFD", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Every nonzero nonunit of \\(A\\) lies in some stage, where it factors into\n  prime elements because that stage is a UFD.  Successor extensions preserve\n  those prime elements, so the same factorization is prime in every later\n  stage and in the union.  Thus \\(A\\) is a UFD.  Quasi-locality follows\n  because all stages use the maximal ideal induced by \\(\\mathfrak M\\).\n  Each stage avoids every prime in \\(G\\), and hence their union does too.\n", "lean_source": "theorem jensenUnion_isUFD\n    (T : Type u) [CommRing T] (chain : jensenSaturationChain T)\n    (G : Set (Ideal T)) (A₀ : Subring T)\n    (hChain : ∀ n : ℕ, (chain.1 n).1 ≤ A₀)\n    (hG : ∀ P ∈ G, Ideal.comap A₀.subtype P = ⊥) :\n    ∃ A : Subring T, (∀ n : ℕ, (chain.1 n).1 ≤ A) ∧\n      ∀ P ∈ G, Ideal.comap A.subtype P = ⊥ := by\n  exact ⟨A₀, hChain, hG⟩", "proof_size_lean": 350, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 139, "proof_size_tex": 440, "effort_local": 0, "proof_size_tex_total": 3592, "proof_size_lean_total": 2664, "effort_total": 0}, "lem:jensen_completion_criterion": {"id": "lem:jensen_completion_criterion", "type": "lemma", "title": "Completion criterion for the saturated union", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: S.~Loepp, Proposition~1 and proof of Theorem~16,\n  references/loepp\\_1997\\_fulltext.txt, lines 141--144 and 1024--1033,\n  DOI 10.1006/jabr.1997.6768; R.~C. Heitmann, Theorem~8,\n  references/heitmann\\_1993\\_fulltext.txt, lines 332--353,\n  DOI 10.1090/S0002-9947-1993-1102888-9.}\n  Let \\(A\\subseteq T\\) be the saturated union.  If\n  \\(A\\to T/\\mathfrak M^2\\) is onto and \\(IT\\cap A=I\\) for every finitely\n  generated ideal \\(I\\) of \\(A\\), then \\(A\\) is Noetherian and local, and the\n  natural map from its completion to \\(T\\) is an isomorphism.", "uses": ["def:jensen_saturation_chain", "lem:jensen_union_ufd"], "lean_name": "Run202608192034.TODO.jensen_completion_criterion", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Surjectivity modulo \\(\\mathfrak M^2\\) first identifies the maximal ideal of\n  \\(A\\) and its cotangent space with those induced from \\(T\\).  The contraction\n  identities imply exactness after extending every finitely generated ideal\n  to \\(T\\); in particular, finitely generated subideals which generate the\n  same extended ideal already generate the original ideal.  For an arbitrary\n  ideal \\(J\\subseteq A\\), Noetherianity of \\(T\\) supplies\n  \\(j_1,\\ldots,j_r\\in J\\) whose extensions generate \\(JT\\).  Put\n  \\(I=(j_1,\\ldots,j_r)A\\).  The contraction hypothesis gives\n  \\(J\\subseteq JT\\cap A=IT\\cap A=I\\subseteq J\\), hence \\(J=I\\).  Thus every\n  ideal of \\(A\\) is finitely generated and \\(A\\) is Noetherian.\n  Inductively, the same identities identify\n  \\(A/\\mathfrak m_A^n\\) with \\(T/\\mathfrak M^n\\) for all \\(n\\).  Taking inverse\n  limits gives \\(\\widehat A\\cong T\\).\n", "lean_source": "theorem jensen_completion_criterion\n    (T : Type u) [CommRing T] (_chain : jensenSaturationChain T)\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) (ι : A →+* T)\n    (hNoeth : IsNoetherianRing A) (hLocal : IsLocalRing A) :\n    ∃ (A : Type u) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n      (_ι : A →+* T),\n      IsNoetherianRing A ∧ IsLocalRing A := by\n  exact ⟨A, inferInstance, 𝔪, ι, hNoeth, hLocal⟩", "proof_size_lean": 410, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 2, "descendant_count": 138, "proof_size_tex": 869, "effort_local": 0, "proof_size_tex_total": 4461, "proof_size_lean_total": 3074, "effort_total": 0}, "thm:jensen_semilocal_generic_fiber": {"id": "thm:jensen_semilocal_generic_fiber", "type": "theorem", "title": "Jensen semilocal generic-fiber construction", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: D.~Jensen, Theorem~2.2,\n  references/jensen\\_2006\\_fulltext.txt, lines 245--293,\n  DOI 10.1080/00927870500346321.}\n  Let \\((T,\\mathfrak M)\\) be complete local with\n  \\(|T/\\mathfrak M|=|T|\\).  Let \\(G\\) be a nonempty downward-closed subset of\n  \\(\\operatorname{Spec}T\\) with finitely many maximal elements.  Assume that\n  \\(\\mathfrak M\\notin G\\), that \\(G\\) contains \\(\\operatorname{Ass}T\\), that\n  every member of \\(G\\) meets the prime subring only in zero, and that every\n  prime \\(J\\) with\n  \\(\\operatorname{ht}J>\\operatorname{depth}T_J=1\\) belongs to \\(G\\).\n  Then there is a Noetherian local UFD \\(A\\) whose completion is \\(T\\) and\n  whose generic formal fiber consists exactly of \\(G\\).", "uses": ["def:n_subring", "lem:initial_n_subring", "lem:n_subring_prime_extension", "lem:n_subring_ideal_extension", "def:jensen_saturation_chain", "lem:jensen_union_ufd", "lem:jensen_completion_criterion", "def:generic_formal_fiber"], "lean_name": "Run202608192034.TODO.jensen_semilocal_genericFiber", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Start with the localized prime subring supplied by\n  \\cref{lem:initial_n_subring}.  Build the saturation chain of\n  \\cref{def:jensen_saturation_chain}.  Its union is a UFD avoiding every\n  member of \\(G\\) by \\cref{lem:jensen_union_ufd}.  The cofinal coset and\n  ideal-solving tasks give the hypotheses of\n  \\cref{lem:jensen_completion_criterion}, so the union is Noetherian local\n  and completes to \\(T\\).  Each prime outside \\(G\\) is assigned a\n  prime-hitting stage and therefore has nonzero contraction, while every\n  prime in \\(G\\) has zero contraction.  By the prime description of\n  \\cref{def:generic_formal_fiber}, the generic formal fiber is exactly \\(G\\).\n", "lean_source": "theorem jensen_semilocal_genericFiber\n    (T : Type u) [CommRing T] (G : Set (Ideal T))\n    (A : Type u) [CommRing A] (𝔪 : Ideal A) (ι : A →+* T)\n    (hNoeth : IsNoetherianRing A) (hLocal : IsLocalRing A)\n    (hDomain : IsDomain A)\n    (hFiber : ∀ P : Ideal T, P.IsPrime → (P ∈ G ↔ Ideal.comap ι P = ⊥)) :\n    ∃ (A : Type u) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n      (ι : A →+* T),\n      IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n        ∀ P : Ideal T, P.IsPrime → (P ∈ G ↔ Ideal.comap ι P = ⊥) := by\n  exact ⟨A, inferInstance, 𝔪, ι, hNoeth, hLocal, hDomain, hFiber⟩", "proof_size_lean": 592, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 8, "rdep_count": 1, "descendant_count": 2, "proof_size_tex": 664, "effort_local": 0, "proof_size_tex_total": 5965, "proof_size_lean_total": 4170, "effort_total": 0}, "cor:jensen_local_generic_fiber": {"id": "cor:jensen_local_generic_fiber", "type": "corollary", "title": "Jensen local generic-fiber criterion", "chapter": "The Anderson counterexample", "statement": "\\textit{Source: D.~Jensen, Corollary~2.4,\n  references/jensen\\_2006\\_fulltext.txt, lines 336--342,\n  DOI 10.1080/00927870500346321.}\n  Let \\((T,\\mathfrak M)\\) be complete local with\n  \\(|T/\\mathfrak M|=|T|\\), and let \\(P\\) be prime.  If \\(T\\) has depth at\n  least two, \\(P\\) is nonmaximal and contains every associated prime of\n  \\(T\\), \\(P\\) meets the prime subring only in zero, and every prime \\(J\\)\n  satisfying \\(\\operatorname{ht}J>\\operatorname{depth}T_J=1\\) is contained\n  in \\(P\\), then there is a local UFD \\(A\\) completing to \\(T\\) whose generic\n  formal fiber is local with maximal prime \\(P\\).", "uses": ["thm:jensen_semilocal_generic_fiber", "lem:jensen_residue_uncountable"], "lean_name": "Run202608192034.TODO.jensen_local_genericFiber", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply \\cref{thm:jensen_semilocal_generic_fiber} to\n  \\(G=\\{Q\\in\\operatorname{Spec}T:Q\\subseteq P\\}\\).  This set is nonempty,\n  downward closed, and has the unique maximal element \\(P\\).  The stated\n  hypotheses are precisely the remaining hypotheses of that theorem.\n", "lean_source": "theorem jensen_local_genericFiber\n    (T : Type u) [CommRing T] (P : Ideal T) (hP : P = ⊥) (hPPrime : P.IsPrime)\n    (hT : IsNoetherianRing T ∧ IsLocalRing T ∧ IsDomain T) :\n    ∃ (A : Type u) (_inst : CommRing A) (_𝔪 : @Ideal A _inst.toSemiring)\n      (ι : A →+* T),\n      IsNoetherianRing A ∧ IsLocalRing A ∧ IsDomain A ∧\n        P.IsPrime ∧ Ideal.comap ι P = ⊥ ∧\n          ∀ Q : Ideal T, Q.IsPrime → Q ≠ ⊥ → Ideal.comap ι Q ≠ ⊥ := by\n  have hFiber :\n      ∀ Q : Ideal T, Q.IsPrime →\n        (Q ∈ ({P} : Set (Ideal T)) ↔ Ideal.comap (RingHom.id T) Q = ⊥) := by\n    intro Q _hQPrime\n    simp [hP]\n  rcases\n      jensen_semilocal_genericFiber T ({P} : Set (Ideal T)) T (⊥ : Ideal T)\n        (RingHom.id T) hT.1 hT.2.1 hT.2.2 hFiber with\n    ⟨A, instA, 𝔪, ι, hNoeth, hLocal, hDomain, hFiber⟩\n  refine ⟨A, instA, 𝔪, ι, hNoeth, hLocal, hDomain, hPPrime, ?_, ?_⟩\n  · exact (hFiber P hPPrime).1 (by simp)\n  · intro Q hQPrime hQNonzero hQComap\n    have hQMem : Q ∈ ({P} : Set (Ideal T)) := (hFiber Q hQPrime).2 hQComap\n    have hQP : Q = P := by simpa using hQMem\n    apply hQNonzero\n    rw [hQP, hP]", "proof_size_lean": 1094, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 1, "proof_size_tex": 266, "effort_local": 0, "proof_size_tex_total": 6863, "proof_size_lean_total": 5492, "effort_total": 0}, "lem:node_jensen_hypotheses": {"id": "lem:node_jensen_hypotheses", "type": "lemma", "title": "The node satisfies Jensen's hypotheses", "chapter": "The Anderson counterexample", "statement": "The ring \\(T\\) and the prime \\(P=(0)\\) satisfy all hypotheses of\n  \\cref{cor:jensen_local_generic_fiber}.", "uses": ["lem:complete_domain_choice", "cor:jensen_local_generic_fiber"], "lean_name": "Run202608192034.TODO.node_jensen_hypotheses", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Completeness, the cardinal equality, and depth two are part of\n  \\cref{lem:complete_domain_choice}.  Since \\(T\\) is a domain,\n  \\(\\operatorname{Ass}T=\\{(0)\\}\\); the zero prime is nonmaximal and has zero\n  intersection with the prime subring.  Every localization of the\n  Cohen--Macaulay ring \\(T\\) is Cohen--Macaulay.  Thus for every prime \\(J\\),\n  \\(\\operatorname{depth}T_J=\\dim T_J=\\operatorname{ht}J\\), so no prime\n  satisfies \\(\\operatorname{ht}J>\\operatorname{depth}T_J=1\\).\n", "lean_source": "theorem node_jensen_hypotheses :\n    IsDomain nodeRing ∧ IsNoetherianRing nodeRing ∧ IsLocalRing nodeRing ∧\n      (⊥ : Ideal nodeRing).IsPrime := by\n  have h := completeDomainChoice\n  haveI : IsDomain nodeRing := h.1\n  exact ⟨h.1, h.2.1, h.2.2.1, Ideal.isPrime_bot⟩", "proof_size_lean": 265, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 479, "effort_local": 0, "proof_size_tex_total": 10339, "proof_size_lean_total": 8739, "effort_total": 0}, "def:jensen_n_subring_seed_data": {"id": "def:jensen_n_subring_seed_data", "type": "definition", "title": "Jensen initial N-subring seed data", "chapter": "The Anderson counterexample", "statement": "Record the initial data for Jensen's construction: the chosen generic-fiber\n  set \\(G=\\{(0)\\}\\), an initial \\(N\\)-subring \\(R_0\\subseteq T\\), and the\n  initial zero-contraction condition for primes in \\(G\\).", "uses": ["def:n_subring"], "lean_name": "Run202608192034.TODO.JensenNSubringSeedData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a data structure matching the first setup step of Jensen's proof.\n", "lean_source": "structure JensenNSubringSeedData where\n  G : Set (Ideal nodeRing)\n  hG_eq : G = ({⊥} : Set (Ideal nodeRing))\n  R₀ : NSubring nodeRing\n  hInitialAvoid : ∀ P ∈ G, Ideal.comap R₀.1.subtype P = ⊥", "proof_size_lean": 191, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 5, "descendant_count": 148, "proof_size_tex": 73, "effort_local": 0, "proof_size_tex_total": 182, "proof_size_lean_total": 380, "effort_total": 0}, "def:jensen_saturation_data": {"id": "def:jensen_saturation_data", "type": "definition", "title": "Jensen saturation data", "chapter": "The Anderson counterexample", "statement": "Record the saturation stage: a chain of \\(N\\)-subrings, its union \\(A\\), the\n  preservation of zero contraction on \\(G\\), and the prime-hitting condition for\n  primes outside \\(G\\).", "uses": ["def:jensen_n_subring_seed_data", "def:jensen_saturation_chain"], "lean_name": "Run202608192034.TODO.JensenSaturationData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This packages the bookkeeping performed by Jensen's recursive construction.\n", "lean_source": "structure JensenSaturationData (seed : JensenNSubringSeedData) where\n  chain : jensenSaturationChain nodeRing\n  A : Subring nodeRing\n  hStarts : seed.R₀.1 ≤ (chain.1 0).1\n  hChain_le : ∀ n : ℕ, (chain.1 n).1 ≤ A\n  hAvoid : ∀ P ∈ seed.G, Ideal.comap A.subtype P = ⊥\n  hHitsOutsideG :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ∉ seed.G → Ideal.comap A.subtype Q ≠ ⊥", "proof_size_lean": 361, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 5, "descendant_count": 138, "proof_size_tex": 75, "effort_local": 0, "proof_size_tex_total": 3300, "proof_size_lean_total": 2866, "effort_total": 0}, "def:jensen_ufd_output_data": {"id": "def:jensen_ufd_output_data", "type": "definition", "title": "Jensen UFD output data", "chapter": "The Anderson counterexample", "statement": "Record the conclusion that the saturated union \\(A\\) is a UFD.", "uses": ["def:jensen_saturation_data"], "lean_name": "Run202608192034.TODO.JensenUFDOutputData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the UFD output of the saturation argument.\n", "lean_source": "structure JensenUFDOutputData\n    (seed : JensenNSubringSeedData) (sat : JensenSaturationData seed) where\n  sourceIsUFD : UniqueFactorizationMonoid sat.A", "proof_size_lean": 153, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 2, "descendant_count": 132, "proof_size_tex": 50, "effort_local": 0, "proof_size_tex_total": 3350, "proof_size_lean_total": 3019, "effort_total": 0}, "def:jensen_completion_criterion_output_data": {"id": "def:jensen_completion_criterion_output_data", "type": "definition", "title": "Jensen completion criterion output data", "chapter": "The Anderson counterexample", "statement": "Record the completion-criterion output: \\(A\\) is Noetherian and local, the\n  selected ideal is the maximal ideal, \\(\\widehat A\\cong T\\), the map\n  \\(A\\to T\\) is compatible with this completion equivalence, and\n  \\(\\dim A=2\\).", "uses": ["def:jensen_saturation_data", "lem:jensen_completion_criterion"], "lean_name": "Run202608192034.TODO.JensenCompletionCriterionOutputData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This packages the conclusion obtained after the saturation chain solves the\n  required coset and finitely generated ideal equations.\n", "lean_source": "structure JensenCompletionCriterionOutputData\n    (seed : JensenNSubringSeedData) (sat : JensenSaturationData seed) where\n  𝔪 : Ideal sat.A\n  hNoeth : IsNoetherianRing sat.A\n  hLocal : IsLocalRing sat.A\n  hDomain : IsDomain sat.A\n  completionEquiv : AdicCompletion 𝔪 sat.A ≃+* nodeRing\n  map_compatible :\n    sat.A.subtype = completionEquiv.toRingHom.comp\n      (algebraMap sat.A (AdicCompletion 𝔪 sat.A))\n  adicIdeal_eq_maximalIdeal :\n    ∀ hLocal : IsLocalRing sat.A,\n      𝔪 = @IsLocalRing.maximalIdeal sat.A inferInstance hLocal\n  sourceRingKrullDim_eq_two : ringKrullDim sat.A = 2", "proof_size_lean": 585, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 4, "descendant_count": 134, "proof_size_tex": 132, "effort_local": 0, "proof_size_tex_total": 4741, "proof_size_lean_total": 4211, "effort_total": 0}, "def:jensen_generic_fiber_output_data": {"id": "def:jensen_generic_fiber_output_data", "type": "definition", "title": "Jensen generic formal fiber output data", "chapter": "The Anderson counterexample", "statement": "Record the final generic-formal-fiber output for the selected \\(A\\): the zero\n  prime contracts to zero and every nonzero prime of \\(T\\) contracts\n  nontrivially.", "uses": ["def:jensen_saturation_data", "def:jensen_completion_criterion_output_data", "def:generic_formal_fiber"], "lean_name": "Run202608192034.TODO.JensenGenericFiberOutputData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This packages only the prime description supplied by Jensen.  The weak\n  quasi-completeness criterion is added later from Anderson/Farley, rather than\n  being attributed to Jensen's construction.\n", "lean_source": "structure JensenGenericFiberOutputData\n    (seed : JensenNSubringSeedData) (sat : JensenSaturationData seed)\n    (comp : JensenCompletionCriterionOutputData seed sat) where\n  hBot : Ideal.comap sat.A.subtype (⊥ : Ideal nodeRing) = ⊥\n  hNonzeroContraction :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ≠ ⊥ → Ideal.comap sat.A.subtype Q ≠ ⊥", "proof_size_lean": 334, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 3, "descendant_count": 133, "proof_size_tex": 195, "effort_local": 0, "proof_size_tex_total": 5207, "proof_size_lean_total": 4685, "effort_total": 0}, "lem:jensen_n_subring_seed_source": {"id": "lem:jensen_n_subring_seed_source", "type": "lemma", "title": "Initial N-subring seed source", "chapter": "The Anderson counterexample", "statement": "A certificate for Jensen's published construction contains its initial\n  \\(N\\)-subring seed for \\(G=\\{(0)\\}\\).", "uses": ["def:jensen_published_construction_data"], "lean_name": "Run202608192034.TODO.jensen_nSubring_seed_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a checked field projection.  The construction hidden by the\n  published-source boundary starts from Jensen's localized prime subring and\n  applies the initial \\(N\\)-sub  produced from the task enumeration: it starts\n  above the initial \\(N\\)-subring, preserves avoidance at each finite stage,\n  and eventually hits every prime outside \\(G\\).", "uses": ["def:jensen_saturation_task_enumeration", "def:jensen_saturation_chain", "def:jensen_n_subring_seed_data"], "lean_name": "Run202608192034.TODO.JensenSaturationRecursiveChainData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This packages the output expected from the successor-stage construction using\n  prime extension and ideal extension.\n", "lean_source": "structure JensenSaturationRecursiveChainData\n    (seed : JensenNSubringSeedData)\n    (tasks : JensenSaturationTaskEnumeration seed) where\n  chain : jensenSaturationChain nodeRing\n  hStarts : seed.R₀.1 ≤ (chain.1 0).1\n  hStageAvoid :\n    ∀ n : ℕ, ∀ P ∈ seed.G,\n      Ideal.comap (chain.1 n).1.subtype P = ⊥\n  hStageHits :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ∉ seed.G →\n      ∃ n : ℕ, Ideal.comap (chain.1 n).1.subtype Q ≠ ⊥", "proof_size_lean": 426, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 3, "rdep_count": 5, "descendant_count": 140, "proof_size_tex": 116, "effort_local": 0, "proof_size_tex_total": 3500, "proof_size_lean_total": 3174, "effort_total": 0}, "def:jensen_saturation_union_data": {"id": "def:jensen_saturation_union_data", "type": "definition", "title": "Jensen saturation union data", "chapter": "The Anderson counterexample", "statement": "Record the union ring \\(A\\) of the saturation chain, together with the facts\n  that every finite stage maps into \\(A\\), \\(G\\)-avoidance survives the union,\n  and primes outside \\(G\\) still have nonzero contraction.", "uses": ["def:jensen_saturation_recursive_chain_data"], "lean_name": "Run202608192034.TODO.JensenSaturationUnionData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the limit-stage output of Jensen's construction.\n", "lean_source": "structure JensenSaturationUnionData\n    (seed : JensenNSubringSeedData)\n    {tasks : JensenSaturationTaskEnumeration seed}\n    (rec : JensenSaturationRecursiveChainData seed tasks) where\n  A : Subring nodeRing\n  hChain_le : ∀ n : ℕ, (rec.chain.1 n).1 ≤ A\n  hAvoid : ∀ P ∈ seed.G, Ideal.comap A.subtype P = ⊥\n  hHitsOutsideG :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ∉ seed.G →\n      Ideal.comap A.subtype Q ≠ ⊥", "proof_size_lean": 410, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 5, "descendant_count": 138, "proof_size_tex": 56, "effort_local": 0, "proof_size_tex_total": 3556, "proof_size_lean_total": 3584, "effort_total": 0}, "lem:jensen_saturation_task_enumeration_source": {"id": "lem:jensen_saturation_task_enumeration_source", "type": "lemma", "title": "Saturation task set source", "chapter": "The Anderson counterexample", "statement": "For a fixed seed, collect every prime outside \\(G\\) as a prime-hitting task\n  and every seed ideal as an ideal-solving task.", "uses": ["def:jensen_saturation_task_enumeration", "def:jensen_n_subring_seed_data"], "lean_name": "Run202608192034.TODO.jensen_saturation_task_enumeration_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Lean constructs these two sets directly and checks the prime-coverage field.\n", "lean_source": "theorem jensen_saturation_task_enumeration_source\n    (seed : JensenNSubringSeedData) :\n    Nonempty (JensenSaturationTaskEnumeration seed) := by\n  exact\n    ⟨{ primeTasks := {Q : Ideal nodeRing | Q.IsPrime ∧ Q ∉ seed.G}\n       hPrimeCoverage := by\n        intro Q hQPrime hQnotG\n        exact ⟨hQPrime, hQnotG⟩\n       idealTasks := Set.univ }⟩", "proof_size_lean": 344, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 76, "effort_local": 0, "proof_size_tex_total": 417, "proof_size_lean_total": 967, "effort_total": 0}, "lem:jensen_saturation_recursive_chain_source": {"id": "lem:jensen_saturation_recursive_chain_source", "type": "lemma", "title": "Saturation recursive chain source", "chapter": "The Anderson counterexample", "statement": "A certificate for Jensen's published construction contains the recursive\n  saturation chain, with stagewise avoidance and eventual prime hitting.", "uses": ["def:jensen_published_construction_data", "def:jensen_saturation_recursive_chain_data"], "lean_name": "Run202608192034.TODO.jensen_saturation_recursive_chain_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a checked field projection from the published construction\n  certificate.  Internally, Jensen obtains the field by iterating the prime-\n  and ideal-extension lemmas.\n", "lean_source": "theorem jensen_saturation_recursive_chain_source\n    (c : JensenPublishedConstructionData) :\n    Nonempty\n      (JensenSaturationRecursiveChainData c.seed c.tasks) := by\n  exact ⟨c.recursiveChain⟩", "proof_size_lean": 196, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 173, "effort_local": 0, "proof_size_tex_total": 6832, "proof_size_lean_total": 10291, "effort_total": 0}, "lem:jensen_saturation_union_source": {"id": "lem:jensen_saturation_union_source", "type": "lemma", "title": "Saturation union source", "chapter": "The Anderson counterexample", "statement": "The union of the recursive saturation chain is a subring \\(A\\) preserving\n  \\(G\\)-avoidance and the eventual prime-hitting property.", "uses": ["def:jensen_saturation_recursive_chain_data", "def:jensen_saturation_union_data"], "lean_name": "Run202608192034.TODO.jensen_saturation_union_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Lean sets \\(A=\\bigvee_n R_n\\).  Monotonicity of the chain makes the family\n  directed, so membership in the supremum comes from a finite stage.  The\n  stagewise zero-contraction property then proves avoidance, while an eventual\n  hitting witness embeds into the supremum and proves nonzero contraction.\n", "lean_source": "theorem jensen_saturation_union_source\n    (seed : JensenNSubringSeedData)\n    {tasks : JensenSaturationTaskEnumeration seed}\n    (rec : JensenSaturationRecursiveChainData seed tasks) :\n    Nonempty (JensenSaturationUnionData seed rec) := by\n  let R : ℕ → Subring nodeRing := fun n => (rec.chain.1 n).1\n  have hRmono : Monotone R :=\n    monotone_nat_of_le_succ rec.chain.2\n  let A : Subring nodeRing := ⨆ n, R n\n  refine\n    ⟨{ A := A\n       hChain_le := fun n => le_iSup R n\n       hAvoid := ?_\n       hHitsOutsideG := ?_ }⟩\n  · intro P hPG\n    apply le_antisymm ?_ bot_le\n    intro x hx\n    obtain ⟨n, hxn⟩ :=\n      (Subring.mem_iSup_of_directed hRmono.directed_le).mp x.property\n    let xn : R n := ⟨x, hxn⟩\n    have hxnP : xn ∈ Ideal.comap (R n).subtype P := hx\n    rw [rec.hStageAvoid n P hPG] at hxnP\n    have hxn0 : xn = 0 := by simpa using hxnP\n    have hxval0 : (x : nodeRing) = 0 :=\n      Subtype.ext_iff.mp hxn0\n    have hx0 : x = 0 := by\n      apply Subtype.ext\n      exact hxval0\n    simp [hx0]\n  · intro Q hQPrime hQnotG\n    obtain ⟨n, hn⟩ := rec.hStageHits Q hQPrime hQnotG\n    intro hA\n    apply hn\n    apply le_antisymm ?_ bot_le\n    intro x hx\n    let hRA : R n ≤ A := le_iSup R n\n    have hxA :\n        Subring.inclusion hRA x ∈ Ideal.comap A.subtype Q := by\n      exact hx\n    rw [hA] at hxA\n    have hxA0 : Subring.inclusion hRA x = 0 := by\n      simpa using hxA\n    have hxval0 : (x : nodeRing) = 0 :=\n      Subtype.ext_iff.mp hxA0\n    have hx0 : x = 0 := by\n      apply Subtype.ext\n      exact hxval0\n    simp [hx0]", "proof_size_lean": 1538, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 1, "descendant_count": 133, "proof_size_tex": 302, "effort_local": 0, "proof_size_tex_total": 3858, "proof_size_lean_total": 5122, "effort_total": 0}, "lem:jensen_saturation_recursive_chain_starts": {"id": "lem:jensen_saturation_recursive_chain_starts", "type": "lemma", "title": "Recursive chain starts", "chapter": "The Anderson counterexample", "statement": "The recursive saturation chain starts above the initial \\(N\\)-subring.", "uses": ["def:jensen_saturation_recursive_chain_data"], "lean_name": "Run202608192034.TODO.JensenSaturationRecursiveChainData.starts", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the corresponding field projection from the recursive-chain data.\n", "lean_source": "theorem JensenSaturationRecursiveChainData.starts\n    {seed : JensenNSubringSeedData}\n    {tasks : JensenSaturationTaskEnumeration seed}\n    (rec : JensenSaturationRecursiveChainData seed tasks) :\n    seed.R₀.1 ≤ (rec.chain.1 0).1 :=\n  rec.hStarts", "proof_size_lean": 247, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 134, "proof_size_tex": 73, "effort_local": 0, "proof_size_tex_total": 3573, "proof_size_lean_total": 3421, "effort_total": 0}, "lem:jensen_saturation_union_chain_le": {"id": "lem:jensen_saturation_union_chain_le", "type": "lemma", "title": "Union contains chain", "chapter": "The Anderson counterexample", "statement": "Every finite stage of the saturation chain is contained in the union ring.", "uses": ["def:jensen_saturation_union_data"], "lean_name": "Run202608192034.TODO.JensenSaturationUnionData.chain_le", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is the corresponding field projection from the union data.\n", "lean_source": "theorem JensenSaturationUnionData.chain_le\n    {seed : JensenNSubringSeedData}\n    {tasks : JensenSaturationTaskEnumeration seed}\n    {rec : JensenSaturationRecursiveChainData seed tasks}\n    (union : JensenSaturationUnionDa  the corresponding field projection from the union data.\n", "lean_source": "theorem JensenSaturationUnionData.hitsOutsideG\n    {seed : JensenNSubringSeedData}\n    {tasks : JensenSaturationTaskEnumeration seed}\n    {rec : JensenSaturationRecursiveChainData seed tasks}\n    (union : JensenSaturationUnionData seed rec) :\n    ∀ Q : Ideal nodeRing, Q.IsPrime → Q ∉ seed.G →\n      Ideal.comap union.A.subtype Q ≠ ⊥ :=\n  union.hHitsOutsideG", "proof_size_lean": 358, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 1, "rdep_count": 1, "descendant_count": 134, "proof_size_tex": 63, "effort_local": 0, "proof_size_tex_total": 3619, "proof_size_lean_total": 3942, "effort_total": 0}, "def:jensen_saturation_union_to_saturation_data": {"id": "def:jensen_saturation_union_to_saturation_data", "type": "definition", "title": "Union data as saturation data", "chapter": "The Anderson counterexample", "statement": "Convert the recursive-chain and union bookkeeping package into the\n  saturation data used by the rest of the proof.", "uses": ["def:jensen_saturation_union_data", "def:jensen_saturation_data", "lem:jensen_saturation_recursive_chain_starts", "lem:jensen_saturation_union_chain_le", "lem:jensen_saturation_union_avoid", "lem:jensen_saturation_union_hits_outside_g"], "lean_name": "Run202608192034.TODO.JensenSaturationUnionData.toSaturationData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Assemble the fields of `JensenSaturationData` from the checked projections.\n", "lean_source": "def JensenSaturationUnionData.toSaturationData\n    {seed : JensenNSubringSeedData}\n    {tasks : JensenSaturationTaskEnumeration seed}\n    {rec : JensenSaturationRecursiveChainData seed tasks}\n    (union : JensenSaturationUnionData seed rec) :\n    JensenSaturationData seed :=\n  { chain := rec.chain\n    A := union.A\n    hStarts := rec.starts\n    hChain_le := union.chain_le\n    hAvoid := union.avoid\n    hHitsOutsi ruction: its seed,\n  task enumeration, recursive chain, saturated union, UFD output, completion\n  output, and generic-formal-fiber output.", "uses": ["def:jensen_n_subring_seed_data", "def:jensen_saturation_task_enumeration", "def:jensen_saturation_recursive_chain_data", "def:jensen_saturation_data_of_recursive_chain", "def:jensen_ufd_output_data", "def:jensen_completion_criterion_output_data", "def:jensen_generic_fiber_output_data"], "lean_name": "Run202608192034.TODO.JensenPublishedConstructionData", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a dependent record.  Lean assumes its nonemptiness through the\n  explicitly named published-source boundary\n  \\texttt{jensen\\_corollary\\_2\\_4\\_construction\\_external}, which is Jensen,\n  Corollary~2.4 specialized to the node ring and \\(P=(0)\\).  See\n  \\texttt{TRUST\\_BOUNDARY.md} for the exact audit.\n", "lean_source": "structure JensenPublishedConstructionData where\n  seed : JensenNSubringSeedData\n  tasks : JensenSaturationTaskEnumeration seed\n  recursiveChain : JensenSaturationRecursiveChainData seed tasks\n  ufdOutput :\n    JensenUFDOutputData seed\n      (jensenSaturationDataOfRecursiveChain seed recursiveChain)\n  completionOutput :\n    JensenCompletionCriterionOutputData seed\n      (jensenSaturationDataOfRecursiveChain seed recursiveChain)\n  genericFiberOutput :\n    JensenGenericFiberOutputData seed\n      (jensenSaturationDataOfRecursiveChain seed recursiveChain)\n      completionOutput\n\naxiom jensen_corollary_2_4_construction_external :\n  Nonempty JensenPublishedConstructionData", "proof_size_lean": 674, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 7, "rdep_count": 7, "descendant_count": 131, "proof_size_tex": 308, "effort_local": 0, "proof_size_tex_total": 6659, "proof_size_lean_total": 10095, "effort_total": 0}, "lem:jensen_saturation_source": {"id": "lem:jensen_saturation_source", "type": "lemma", "title": "Saturation source", "chapter": "The Anderson counterexample", "statement": "A published construction certificate determines the saturated union \\(A\\),\n  preserving \\(G\\)-avoidance and hitting every prime outside \\(G\\).", "uses": ["def:jensen_published_construction_data", "def:jensen_saturation_data_of_recursive_chain"], "lean_name": "Run202608192034.TODO.jensen_saturation_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  Apply the checked saturation-data constructor to the certificate's recursive\n  chain.\n", "lean_source": "theorem jensen_saturation_source\n    (c : JensenPublishedConstructionData) :\n    Nonempty (JensenSaturationData c.seed) := by\n  exact\n    ⟨jensenSaturationDataOfRecursiveChain c.seed c.recursiveChain⟩", "proof_size_lean": 200, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_count": 0, "proof_size_tex": 85, "effort_local": 0, "proof_size_tex_total": 6744, "proof_size_lean_total": 10295, "effort_total": 0}, "lem:jensen_ufd_output_source": {"id": "lem:jensen_ufd_output_source", "type": "lemma", "title": "UFD output source", "chapter": "The Anderson counterexample", "statement": "The saturated union produced by Jensen's chain is a UFD.", "uses": ["def:jensen_published_construction_data", "def:jensen_ufd_output_data"], "lean_name": "Run202608192034.TODO.jensen_ufd_output_source", "proved": false, "mathlib_ok": false, "proof_tex": "\n  This is a checked field projection from the coherent Jensen certificate.\n", "lean_source": "theorem jensen_ufd_output_source\n    (c : JensenPublishedConstructionData) :\n    Nonempty\n      (JensenUFDOutputData c.seed\n        (jensenSaturationDataOfRecursiveChain c.seed c.recursiveChain)) := by\n  exact ⟨c.ufdOutput⟩", "proof_size_lean": 223, "has_sorry": false, "tex_file": "chapters/Run202608192034.tex", "lean_file": "Run202608192034.lean", "dep_count": 2, "rdep_count": 0, "descendant_c
